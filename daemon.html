<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>DAEMON — PoxStar</title>
<meta name="description" content="Shooter de arena cyberpunk. Oleadas de procesos hostiles, gráficos vectoriales neón y un solo búfer de vida." />
<meta name="theme-color" content="#05070d" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233CFF9E' d='M12 2 L14.6 8.6 L21.5 9.2 L16.2 13.7 L17.9 20.5 L12 16.9 L6.1 20.5 L7.8 13.7 L2.5 9.2 L9.4 8.6 Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#05070d;color:#dCe8f5;font-family:'Share Tech Mono',ui-monospace,monospace;
  touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
canvas{display:block;width:100vw;height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.28;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px)}

.hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 16px;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  font-size:12px;letter-spacing:.14em}
.hud .col{display:flex;flex-direction:column;gap:4px}
.hud .col.r{align-items:flex-end;text-align:right}
.hud i{font-style:normal;color:#5b7089;font-size:10px;letter-spacing:.2em}
.hud b{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:25px;
  color:#3CFF9E;text-shadow:0 0 16px rgba(60,255,158,.5);line-height:1}
.hud b.cy{color:#00F0FF;text-shadow:0 0 16px rgba(0,240,255,.5)}
.hud b.yl{color:#FFE566;text-shadow:0 0 16px rgba(255,229,102,.5)}

.hp{position:fixed;left:16px;bottom:38px;z-index:20;width:190px;pointer-events:none}
.hp .k{font-size:9.5px;letter-spacing:.22em;color:#5b7089;margin-bottom:5px}
.hp .bar{height:7px;background:rgba(255,255,255,.08);overflow:hidden}
.hp .fill{height:100%;width:100%;background:#3CFF9E;transform-origin:0 50%;
  box-shadow:0 0 12px rgba(60,255,158,.7);transition:transform .15s,background .2s}
.hp .fill.mid{background:#FFE566;box-shadow:0 0 12px rgba(255,229,102,.7)}
.hp .fill.low{background:#FF2E97;box-shadow:0 0 12px rgba(255,46,151,.8);
  animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{opacity:.4}}
.home{position:fixed;left:16px;bottom:14px;z-index:20;font-size:11px;letter-spacing:.16em;
  color:#5b7089;text-decoration:none;transition:color .2s}
.home:hover{color:#00F0FF}

.wave{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;
  opacity:0}
.wave.show{animation:waveIn 1.7s ease-out}
.wave span{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;
  font-size:clamp(40px,9vw,86px);letter-spacing:.14em;color:#00F0FF;
  text-shadow:0 0 34px rgba(0,240,255,.6)}
@keyframes waveIn{0%{opacity:0;transform:scale(.85)}18%{opacity:1;transform:scale(1)}
  72%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

.ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:rgba(3,6,12,.9);backdrop-filter:blur(3px);text-align:center;cursor:default}
.ov[hidden]{display:none}
.ov .box{width:min(500px,100%)}
.ov h1{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;line-height:.95;
  font-size:clamp(42px,11vw,76px);letter-spacing:.1em;margin-bottom:6px;
  color:#3CFF9E;text-shadow:0 0 28px rgba(60,255,158,.55)}
.ov h1.no{color:#FF2E97;text-shadow:0 0 28px rgba(255,46,151,.55)}
.ov .sub{font-size:12px;letter-spacing:.2em;color:#5b7089;margin-bottom:22px}
.ov .stats{display:flex;justify-content:center;gap:28px;margin-bottom:24px;flex-wrap:wrap}
.ov .stats .k{font-size:10px;letter-spacing:.2em;color:#5b7089;margin-bottom:4px}
.ov .stats .v{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:30px;
  color:#FFE566}
.ov .keys{font-size:12px;line-height:2;color:#93a9c0;margin-bottom:22px}
.ov .keys b{color:#3CFF9E;font-weight:400}
.btn{display:inline-block;border:1px solid #3CFF9E;color:#3CFF9E;padding:12px 30px;
  font-size:12.5px;letter-spacing:.2em;text-decoration:none;cursor:pointer;
  background:none;font-family:inherit;transition:all .2s;margin:4px}
.btn:hover{background:#3CFF9E;color:#000;box-shadow:0 0 24px rgba(60,255,158,.6)}
.btn.alt{border-color:#5b7089;color:#5b7089}
.btn.alt:hover{background:#5b7089;color:#000;box-shadow:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <div class="col"><i>PUNTOS</i><b id="hScore">0</b></div>
  <div class="col" style="align-items:center"><i>OLEADA</i><b class="cy" id="hWave">1</b></div>
  <div class="col r"><i>RÉCORD</i><b class="yl" id="hBest">0</b></div>
</div>

<div class="hp"><div class="k">INTEGRIDAD</div><div class="bar"><div class="fill" id="hpFill"></div></div></div>
<a class="home" href="index.html">&larr; POXSTAR</a>

<div class="wave" id="waveMsg"><span id="waveTxt">OLEADA 1</span></div>

<div class="ov" id="ovStart">
  <div class="box">
    <h1>DAEMON</h1>
    <p class="sub">2044 · PROCESOS HOSTILES DETECTADOS</p>
    <div class="keys">
      <p><b>WASD</b> / <b>FLECHAS</b> — moverse</p>
      <p><b>RATÓN</b> — apuntar &nbsp;·&nbsp; <b>CLIC</b> — disparar</p>
      <p>En móvil: <b>arrastra</b> para moverte, dispara solo.</p>
    </div>
    <button class="btn" id="btnPlay">EJECUTAR</button>
  </div>
</div>

<div class="ov" id="ovEnd" hidden>
  <div class="box">
    <h1 class="no">PROCESO<br>TERMINADO</h1>
    <div class="stats">
      <div><div class="k">PUNTOS</div><div class="v" id="eScore">0</div></div>
      <div><div class="k">OLEADA</div><div class="v" id="eWave">1</div></div>
      <div><div class="k">RÉCORD</div><div class="v" id="eBest">0</div></div>
    </div>
    <button class="btn" id="btnAgain">REINICIAR</button>
    <a class="btn alt" href="index.html">SALIR</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  var cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
  var W=0,H=0,DPR=1;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cvs.width=W*DPR; cvs.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',resize); resize();

  var GR='#3CFF9E', CY='#00F0FF', MG='#FF2E97', YL='#FFE566';
  var $=function(id){return document.getElementById(id);};

  var G={ playing:false, score:0, best:0, wave:0, hp:100, maxHp:100,
    p:{x:0,y:0,vx:0,vy:0,a:0,r:15,cool:0,inv:0},
    bul:[], en:[], ebul:[], parts:[], pops:[],
    keys:{}, mx:0, my:0, firing:false, touch:null,
    spawnLeft:0, spawnT:0, shake:0, t:0 };
  try{ G.best=parseInt(localStorage.getItem('pox-daemon-best')||'0',10)||0; }catch(e){}
  $('hBest').textContent=G.best;

  /* ── Audio ── */
  var actx=null;
  function snd(f1,f2,dur,type,vol){
    try{ if(!actx) return;
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||'square'; o.frequency.setValueAtTime(f1,actx.currentTime);
      if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),actx.currentTime+dur);
      g.gain.setValueAtTime(vol||0.04,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  /* ── Entrada ── */
  addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(e.key.toLowerCase())>=0) e.preventDefault();
  });
  addEventListener('keyup',function(e){ G.keys[e.key.toLowerCase()]=false; });
  addEventListener('mousemove',function(e){ G.mx=e.clientX; G.my=e.clientY; });
  cvs.addEventListener('mousedown',function(e){ if(e.button===0) G.firing=true; });
  addEventListener('mouseup',function(){ G.firing=false; });
  cvs.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch'){ G.touch={x:e.clientX,y:e.clientY}; G.firing=true; }
  });
  cvs.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'&&G.touch){ G.touch.x=e.clientX; G.touch.y=e.clientY; }
  });
  addEventListener('pointerup',function(e){
    if(e.pointerType==='touch'){ G.touch=null; G.firing=false; }
  });

  /* ── Reinicio ── */
  function reset(){
    G.playing=true; G.score=0; G.wave=0; G.hp=G.maxHp;
    G.p.x=W/2; G.p.y=H/2; G.p.vx=0; G.p.vy=0; G.p.cool=0; G.p.inv=60;
    G.bul=[]; G.en=[]; G.ebul=[]; G.parts=[]; G.pops=[];
    G.spawnLeft=0; G.spawnT=0; G.shake=0; G.t=0;
    nextWave();
  }

  function nextWave(){
    G.wave++;
    G.spawnLeft = 4 + G.wave*2;
    G.spawnT = 0;
    $('hWave').textContent=G.wave;
    var w=$('waveMsg'); $('waveTxt').textContent='OLEADA '+G.wave;
    w.classList.remove('show'); void w.offsetWidth; w.classList.add('show');
    snd(440,880,0.25,'sine',0.05);
    if (G.wave>1) G.hp=Math.min(G.maxHp,G.hp+14);
  }

  /* ── Enemigos ── */
  function spawnEnemy(){
    var edge=Math.floor(Math.random()*4), x,y;
    if(edge===0){x=-40;y=Math.random()*H;} else if(edge===1){x=W+40;y=Math.random()*H;}
    else if(edge===2){x=Math.random()*W;y=-40;} else {x=Math.random()*W;y=H+40;}
    var roll=Math.random(), type='chase';
    if (G.wave>=3 && roll<0.26) type='shoot';
    else if (G.wave>=5 && roll<0.42) type='split';
    var cfg={
      chase:{hp:2,r:14,sp:1.5,col:CY,pts:10},
      shoot:{hp:3,r:16,sp:0.85,col:MG,pts:22},
      split:{hp:4,r:20,sp:1.1,col:YL,pts:30}
    }[type];
    G.en.push({x:x,y:y,type:type,hp:cfg.hp,r:cfg.r,
      sp:cfg.sp*(1+G.wave*0.045),col:cfg.col,pts:cfg.pts,a:0,cool:40+Math.random()*60,flash:0});
  }
  function splitInto(e){
    for(var i=0;i<2;i++){
      G.en.push({x:e.x+(Math.random()-0.5)*30,y:e.y+(Math.random()-0.5)*30,type:'chase',
        hp:2,r:11,sp:1.9*(1+G.wave*0.04),col:CY,pts:8,a:0,cool:0,flash:0});
    }
  }

  function burst(x,y,col,n,pw){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, s=(0.5+Math.random())*(pw||5);
      G.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col});
    }
  }
  function popText(x,y,txt,col){ G.pops.push({x:x,y:y,txt:txt,col:col,life:1}); }

  /* ── Actualización ── */
  function update(dt){
    // dt viene en SEGUNDOS: el factor a 60 fps es dt*60 (=1). Dividir además
    // entre 16.7 dejaría todo el juego al 6 % de velocidad.
    var k=dt*60; G.t+=k;
    var p=G.p;

    // movimiento
    var ax=0, ay=0;
    if(G.keys['a']||G.keys['arrowleft'])  ax-=1;
    if(G.keys['d']||G.keys['arrowright']) ax+=1;
    if(G.keys['w']||G.keys['arrowup'])    ay-=1;
    if(G.keys['s']||G.keys['arrowdown'])  ay+=1;
    if(G.touch){
      var tdx=G.touch.x-p.x, tdy=G.touch.y-p.y, td=Math.hypot(tdx,tdy);
      if(td>18){ ax=tdx/td; ay=tdy/td; }
    }
    var m=Math.hypot(ax,ay); if(m>0){ ax/=m; ay/=m; }
    p.vx+=ax*0.85*k; p.vy+=ay*0.85*k;
    p.vx*=Math.pow(0.88,k); p.vy*=Math.pow(0.88,k);
    p.x+=p.vx*k; p.y+=p.vy*k;
    p.x=Math.max(p.r,Math.min(W-p.r,p.x)); p.y=Math.max(p.r,Math.min(H-p.r,p.y));

    // apuntado
    var tx=G.mx, ty=G.my;
    if(G.touch||G.mx===0&&G.my===0){
      var near=null, nd=1e9;
      G.en.forEach(function(e){ var d=Math.hypot(e.x-p.x,e.y-p.y); if(d<nd){nd=d;near=e;} });
      if(near){ tx=near.x; ty=near.y; } else { tx=p.x+1; ty=p.y; }
    }
    p.a=Math.atan2(ty-p.y,tx-p.x);
    if(p.inv>0) p.inv-=k;

    // disparo
    p.cool-=k;
    if(G.firing && p.cool<=0){
      p.cool=7;
      G.bul.push({x:p.x+Math.cos(p.a)*18,y:p.y+Math.sin(p.a)*18,
        vx:Math.cos(p.a)*11,vy:Math.sin(p.a)*11,life:70});
      snd(700,380,0.05,'square',0.028);
      p.vx-=Math.cos(p.a)*0.7; p.vy-=Math.sin(p.a)*0.7;
    }

    // spawns
    if(G.spawnLeft>0){
      G.spawnT-=k;
      if(G.spawnT<=0){ spawnEnemy(); G.spawnLeft--; G.spawnT=Math.max(14,42-G.wave*2); }
    } else if(G.en.length===0){ nextWave(); }

    // enemigos
    for(var i=G.en.length-1;i>=0;i--){
      var e=G.en[i];
      var dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.a=Math.atan2(dy,dx);
      if(e.type==='shoot'){
        if(d>230){ e.x+=dx/d*e.sp*k; e.y+=dy/d*e.sp*k; }
        else if(d<170){ e.x-=dx/d*e.sp*0.6*k; e.y-=dy/d*e.sp*0.6*k; }
        e.cool-=k;
        if(e.cool<=0){
          e.cool=70+Math.random()*50;
          G.ebul.push({x:e.x,y:e.y,vx:dx/d*4.2,vy:dy/d*4.2,life:150});
          snd(220,120,0.1,'sawtooth',0.03);
        }
      } else { e.x+=dx/d*e.sp*k; e.y+=dy/d*e.sp*k; }
      if(e.flash>0) e.flash-=k;

      // choque con el jugador
      if(d<e.r+p.r && p.inv<=0){ hurt(e.type==='split'?18:12); p.inv=48;
        p.vx-=dx/d*7; p.vy-=dy/d*7; }
    }

    // balas propias
    for(var b=G.bul.length-1;b>=0;b--){
      var bu=G.bul[b]; bu.x+=bu.vx*k; bu.y+=bu.vy*k; bu.life-=k;
      if(bu.life<=0||bu.x<-20||bu.x>W+20||bu.y<-20||bu.y>H+20){ G.bul.splice(b,1); continue; }
      for(var j=G.en.length-1;j>=0;j--){
        var en=G.en[j];
        if(Math.hypot(en.x-bu.x,en.y-bu.y)<en.r){
          en.hp--; en.flash=6; G.bul.splice(b,1);
          burst(bu.x,bu.y,en.col,5,3.5);
          if(en.hp<=0){
            G.score+=en.pts; popText(en.x,en.y,'+'+en.pts,en.col);
            burst(en.x,en.y,en.col,18,6);
            if(en.type==='split') splitInto(en);
            G.en.splice(j,1);
            G.shake=Math.min(1,G.shake+0.22);
            snd(300,80,0.14,'sawtooth',0.05);
          } else snd(500,300,0.04,'square',0.025);
          break;
        }
      }
    }

    // balas enemigas
    for(var eb=G.ebul.length-1;eb>=0;eb--){
      var q=G.ebul[eb]; q.x+=q.vx*k; q.y+=q.vy*k; q.life-=k;
      if(q.life<=0||q.x<-30||q.x>W+30||q.y<-30||q.y>H+30){ G.ebul.splice(eb,1); continue; }
      if(Math.hypot(q.x-p.x,q.y-p.y)<p.r && p.inv<=0){
        G.ebul.splice(eb,1); hurt(10); p.inv=36;
      }
    }

    // partículas y textos
    for(var t=G.parts.length-1;t>=0;t--){
      var pt=G.parts[t]; pt.x+=pt.vx*k; pt.y+=pt.vy*k;
      pt.vx*=Math.pow(0.94,k); pt.vy*=Math.pow(0.94,k); pt.life-=0.028*k;
      if(pt.life<=0) G.parts.splice(t,1);
    }
    for(var o=G.pops.length-1;o>=0;o--){
      var po=G.pops[o]; po.y-=0.7*k; po.life-=0.018*k;
      if(po.life<=0) G.pops.splice(o,1);
    }
    if(G.shake>0) G.shake=Math.max(0,G.shake-0.045*k);

    $('hScore').textContent=G.score;
  }

  function hurt(n){
    G.hp-=n; G.shake=Math.min(1.4,G.shake+0.5);
    snd(160,60,0.2,'sawtooth',0.06);
    burst(G.p.x,G.p.y,MG,12,5);
    var f=$('hpFill'), r=Math.max(0,G.hp/G.maxHp);
    f.style.transform='scaleX('+r+')';
    f.className='fill'+(r<0.3?' low':(r<0.6?' mid':''));
    if(G.hp<=0) die();
  }

  function die(){
    G.playing=false;
    burst(G.p.x,G.p.y,CY,40,9); burst(G.p.x,G.p.y,MG,26,7);
    G.shake=1.5;
    snd(300,40,0.6,'sawtooth',0.08);
    if(G.score>G.best){ G.best=G.score;
      try{ localStorage.setItem('pox-daemon-best',String(G.best)); }catch(e){} }
    setTimeout(function(){
      $('eScore').textContent=G.score; $('eWave').textContent=G.wave;
      $('eBest').textContent=G.best; $('hBest').textContent=G.best;
      $('ovEnd').hidden=false;
    },780);
  }

  /* ── Dibujo ── */
  function poly(x,y,r,n,rot,col,lw,fill){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var a=Math.PI*2*i/n-Math.PI/2;
      ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.shadowBlur=16; ctx.shadowColor=col;
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    ctx.strokeStyle=col; ctx.lineWidth=lw||2; ctx.stroke();
    ctx.restore();
  }

  function draw(){
    ctx.save();
    if(G.shake>0&&!reduce) ctx.translate((Math.random()-0.5)*16*G.shake,(Math.random()-0.5)*16*G.shake);

    ctx.fillStyle='#05070d'; ctx.fillRect(-30,-30,W+60,H+60);
    var vg=ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,H*0.78);
    vg.addColorStop(0,'rgba(20,14,48,.85)'); vg.addColorStop(1,'rgba(5,7,13,0)');
    ctx.fillStyle=vg; ctx.fillRect(-30,-30,W+60,H+60);

    // rejilla
    ctx.strokeStyle='rgba(0,240,255,.07)'; ctx.lineWidth=1;
    var gs=54, off=(G.t*0.35)%gs;
    ctx.beginPath();
    for(var x=-off;x<W+gs;x+=gs){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for(var y=-off;y<H+gs;y+=gs){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();

    // borde de arena
    ctx.strokeStyle='rgba(60,255,158,.22)'; ctx.lineWidth=2;
    ctx.strokeRect(3,3,W-6,H-6);

    // partículas
    G.parts.forEach(function(p){
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
      ctx.fillRect(p.x-2,p.y-2,4,4);
    });
    ctx.globalAlpha=1;

    // balas enemigas
    G.ebul.forEach(function(b){
      ctx.save(); ctx.shadowBlur=14; ctx.shadowColor=MG; ctx.fillStyle=MG;
      ctx.beginPath(); ctx.arc(b.x,b.y,4.5,0,7); ctx.fill(); ctx.restore();
    });
    // balas propias
    G.bul.forEach(function(b){
      ctx.save(); ctx.shadowBlur=12; ctx.shadowColor=GR;
      ctx.strokeStyle=GR; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*0.9,b.y-b.vy*0.9); ctx.stroke(); ctx.restore();
    });

    // enemigos
    G.en.forEach(function(e){
      var col=e.flash>0?'#ffffff':e.col;
      var sides=e.type==='chase'?3:(e.type==='shoot'?5:6);
      poly(e.x,e.y,e.r,sides,e.a+Math.PI/2,col,2,'rgba(5,7,13,.8)');
      if(e.type==='split'){ poly(e.x,e.y,e.r*0.45,6,-e.a,col,1.5); }
      if(e.type==='shoot'){
        ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle=col; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r+7+Math.sin(G.t*0.08)*3,0,7); ctx.stroke(); ctx.restore();
      }
    });

    // textos flotantes
    G.pops.forEach(function(p){
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.col; ctx.font='600 15px Rajdhani, system-ui, sans-serif';
      ctx.textAlign='center'; ctx.shadowBlur=10; ctx.shadowColor=p.col;
      ctx.fillText(p.txt,p.x,p.y); ctx.restore();
    });

    // jugador
    if(G.playing){
      var p=G.p, blink = p.inv>0 && Math.floor(G.t*0.25)%2===0;
      if(!blink){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
        ctx.shadowBlur=22; ctx.shadowColor=GR;
        ctx.beginPath(); ctx.moveTo(19,0); ctx.lineTo(-11,-11);
        ctx.lineTo(-6,0); ctx.lineTo(-11,11); ctx.closePath();
        ctx.fillStyle='rgba(5,7,13,.9)'; ctx.fill();
        ctx.strokeStyle=GR; ctx.lineWidth=2.5; ctx.stroke();
        // propulsor
        if(Math.hypot(p.vx,p.vy)>0.6){
          ctx.beginPath(); ctx.moveTo(-8,-5); ctx.lineTo(-16-Math.random()*8,0);
          ctx.lineTo(-8,5); ctx.strokeStyle=CY; ctx.lineWidth=2; ctx.stroke();
        }
        ctx.restore();
      }
      // retícula
      ctx.save(); ctx.globalAlpha=.5; ctx.strokeStyle=GR; ctx.lineWidth=1;
      var rx=p.x+Math.cos(p.a)*46, ry=p.y+Math.sin(p.a)*46;
      ctx.beginPath(); ctx.arc(rx,ry,5,0,7); ctx.stroke(); ctx.restore();
    }

    ctx.restore();
  }

  /* ── Bucle ── */
  var last=0;
  function loop(ts){
    var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
    if(G.playing) update(dt);
    else {
      var k=dt*60;
      for(var i=G.parts.length-1;i>=0;i--){
        var p=G.parts[i]; p.x+=p.vx*k; p.y+=p.vy*k;
        p.vx*=Math.pow(0.94,k); p.vy*=Math.pow(0.94,k); p.life-=0.02*k;
        if(p.life<=0) G.parts.splice(i,1);
      }
      if(G.shake>0) G.shake=Math.max(0,G.shake-0.03*k);
    }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function start(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    $('ovStart').hidden=true; $('ovEnd').hidden=true;
    $('hpFill').style.transform='scaleX(1)'; $('hpFill').className='fill';
    G.mx=W/2; G.my=H/2-100;
    reset();
  }
  $('btnPlay').addEventListener('click',start);
  $('btnAgain').addEventListener('click',start);
})();
</script>
</body>
