<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11192b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Putup · Tu próxima gran historia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171e32'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23b7f675'/%3E%3C/svg%3E">
  <style>
:root {
  /* Recortes de la pantalla del teléfono (muesca, barra de gestos): 0 en un navegador de escritorio. */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --bg: #171e32;
  --panel: #19243b;
  --panel-2: #1f2c47;
  --glass: #142036e6;
  --line: #ffffff18;
  --line-2: #ffffff2a;
  --text: #f3f5ff;
  --muted: #acb9d1;
  --faint: #8e9db7;
  --lime: #b7f675;
  --lime-2: #ceff9c;
  --ink: #17282a;
  --pink: #ff7ab5;
  --gold: #f7e36b;
  --coral: #ff8a7a;
  --radius: 16px;
  font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body {
  margin: 0; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none;
  /* En un teléfono: sin rebote al arrastrar, sin menú al mantener pulsado y sin destello azul al tocar. */
  overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
/* dvh descuenta las barras del navegador móvil, que 100vh ignora. */
@supports (height: 100dvh) { canvas { height: 100dvh; } }
canvas.dragging { cursor: grabbing; }
canvas.over-pc { cursor: pointer; }
body:not([data-mode="home"]) canvas { cursor: default; }

/* ---------- Controles ---------- */
button, input { font: inherit; }
button {
  cursor: pointer; border: 1px solid var(--line-2); background: #ffffff0d; color: var(--text);
  padding: 11px 17px; border-radius: 10px; font-weight: 600;
  transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
}
button:hover { background: #ffffff1f; border-color: #a9a8ff; }
button:active { transform: translateY(1px) scale(.98); }
button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; transform: none; }
.primary { background: var(--lime); color: var(--ink); border: 0; box-shadow: 0 6px 24px #b7f67533; }
.primary:hover { background: var(--lime-2); box-shadow: 0 8px 30px #b7f67555; }
.ghost { background: transparent; }
.wide { width: 100%; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 2px 6px; margin: 0 2px; border-radius: 6px;
  background: #ffffff14; border: 1px solid var(--line-2); border-bottom-width: 2px;
  font: 700 11px/1.4 inherit; color: var(--text); text-align: center;
}
input[type=text] {
  width: 100%; padding: 14px 58px 14px 14px; border-radius: 10px; border: 1px solid #ffffff30;
  background: #0e192e; color: white; transition: border-color .15s, box-shadow .15s;
}
input[type=text]:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 3px #b7f67533; }
label { font-size: 13px; color: #c3cee1; }
a { color: var(--lime); }

/* ---------- Cabecera y HUD ---------- */
header {
  position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: 16px;
  padding: calc(22px + var(--sat)) calc(32px + var(--sar)) 22px calc(32px + var(--sal));
  background: linear-gradient(#11192bd9, transparent); pointer-events: none;
}
header > * { pointer-events: auto; }
.brand { font-size: 38px; font-weight: 850; letter-spacing: -3px; line-height: 1; text-shadow: 0 2px 18px #0006; }
.brand span { color: var(--lime); font-size: 24px; margin: 0 2px; text-shadow: 0 0 16px #b7f67599; }
.brand small { display: block; font-size: 9px; letter-spacing: 2px; margin-top: 9px; color: #afbad0; text-shadow: none; }
#stats { margin-left: auto; display: flex; gap: 12px; }
.stat {
  padding: 10px 18px; background: #172236df; border: 1px solid var(--line); border-radius: 12px; min-width: 116px;
  backdrop-filter: blur(6px); transition: border-color .3s, box-shadow .3s;
}
.stat small { display: block; font-size: 10px; letter-spacing: 1.5px; color: #a8b6cd; margin-bottom: 4px; }
.stat strong { font-size: 19px; font-variant-numeric: tabular-nums; }
.stat.bump { border-color: #b7f67588; box-shadow: 0 0 22px #b7f67533; }
.stat.bump strong { color: var(--lime); }
button.icon { padding: 10px 12px; font-size: 16px; line-height: 1; }
#walls { font-size: 13px; padding: 10px 14px; white-space: nowrap; }
.badge {
  display: inline-block; margin: 4px 0 10px; padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
  color: var(--ink); background: linear-gradient(90deg, var(--lime), #e0f7a0); box-shadow: 0 4px 16px #b7f67533;
}
.letters { display: grid; gap: 12px; margin: 18px 0; }
.letter {
  padding: 18px 20px; border-radius: 12px; background: #f6f1e4; color: #3a3226; transform: rotate(-.4deg);
  box-shadow: 0 8px 24px #0005; border-left: 4px solid var(--lime);
}
.letter:nth-child(2n) { transform: rotate(.5deg); }
.letter p { color: #3a3226; font-size: 16px; font-style: italic; margin: 8px 0; }
.letter .tag { color: #6b8a2e; }
.letter .fine { color: #7a6e5c; }

aside {
  position: absolute; top: calc(128px + var(--sat)); left: calc(32px + var(--sal)); width: 280px;
  background: var(--glass); padding: 22px;
  border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(8px);
  box-shadow: 0 16px 50px #0005; animation: slide-in .5s ease-out both;
}
.eyebrow { font-size: 10px; letter-spacing: 2px; color: var(--lime); font-weight: 750; }
h2 { font-size: 23px; letter-spacing: -.6px; margin: 12px 0 8px; }
p { color: var(--muted); line-height: 1.6; font-size: 14px; }
#progress { height: 6px; background: #ffffff12; border-radius: 9px; margin-top: 16px; overflow: hidden; }
#progress i {
  display: block; height: 100%; border-radius: 9px; transition: width .8s cubic-bezier(.2, .8, .2, 1);
  background: linear-gradient(90deg, #8fdc52, var(--lime)); box-shadow: 0 0 12px #b7f67588;
}
#progress-label { display: block; margin-top: 8px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
#location { position: absolute; bottom: calc(86px + var(--sab)); left: calc(32px + var(--sal)); color: #d4def0; font-size: 11px; letter-spacing: 2px; text-shadow: 0 1px 6px #000a; }
body:not([data-mode="home"]) #location { color: #ffb3ab; }

footer {
  position: absolute; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; width: 100%;
  padding: 18px calc(32px + var(--sar)) calc(18px + var(--sab)) calc(32px + var(--sal));
  background: #111a2ae8; border-top: 1px solid #ffffff12; font-size: 11px; color: #afbdd4; backdrop-filter: blur(6px);
}
footer kbd { margin-right: 6px; }
.run-only { display: none; }
body[data-mode="run"] .run-only { display: inline; }
body:not([data-mode="home"]) .home-only, body:not([data-mode="home"]) aside { display: none; }

#prompt {
  position: absolute; bottom: 118px; left: 50%; padding: 12px 20px; border-radius: 12px; background: var(--lime);
  color: #1b2d29; font-weight: 700; box-shadow: 0 10px 30px #b7f67544; opacity: 0; pointer-events: none;
  transform: translate(-50%, 12px); transition: opacity .2s, transform .2s;
}
#prompt.show { opacity: 1; transform: translate(-50%, 0); animation: bob 1.6s ease-in-out infinite; }
#prompt kbd { background: #17282a; color: var(--lime); border-color: #17282a; }
#toast {
  position: absolute; top: 104px; left: 50%; transform: translate(-50%, -12px); background: var(--lime); color: #192924;
  border-radius: 12px; padding: 12px 22px; font-weight: 650; opacity: 0; z-index: 10; pointer-events: none;
  box-shadow: 0 12px 40px #0006; transition: opacity .25s, transform .25s; max-width: calc(100vw - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { background: var(--coral); color: #2a1210; }
body[data-mode="run"] #toast, body[data-mode="arcade"] #toast { top: 196px; }

#touch {
  position: absolute; bottom: 78px; left: var(--sal); right: var(--sar); display: none;
  justify-content: space-between; padding: 0 16px; gap: 12px;
}
#touch button {
  flex: 1; max-width: 140px; padding: 20px 0; font-size: 20px; background: #142036cc;
  backdrop-filter: blur(6px); touch-action: none; -webkit-tap-highlight-color: transparent;
}
#touch button.big { max-width: none; color: var(--lime); border-color: #b7f67566; }
#touch button.down { background: #24406acc; transform: translateY(1px) scale(.98); }
/* Solo en pantallas táctiles: con ratón la barra sobra y el teclado es más preciso. */
@media (pointer: coarse) {
  #touch:not([hidden]) { display: flex; bottom: calc(18px + var(--sab)); }
  footer { display: none; }
  aside { bottom: calc(16px + var(--sab)); }
}
/* Con el teléfono de lado casi no hay alto: los botones se apilan en el borde derecho,
   donde ya cae el pulgar, en vez de comerse la parte de abajo del tablero. */
@media (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
  #touch:not([hidden]) {
    flex-direction: column-reverse; width: auto; left: auto; gap: 8px;
    right: calc(12px + var(--sar)); bottom: calc(12px + var(--sab));
  }
  #touch button, #touch button.big { flex: none; max-width: none; min-width: 108px; padding: 12px 16px; font-size: 16px; }
}

/* ---------- Ventanas ---------- */
.veil {
  position: absolute; inset: 0; background: #080e22a8; backdrop-filter: blur(9px); display: grid;
  place-items: center; z-index: 5; animation: fade .2s ease-out;
  padding: calc(8px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal));
}
.veil[hidden] { display: none; }
#panel {
  position: relative; width: min(880px, 94vw); max-height: 88vh; overflow: auto; background: linear-gradient(160deg, #1d2944, var(--panel) 45%);
  border: 1px solid var(--line-2); border-radius: 22px; box-shadow: 0 24px 100px #0008, inset 0 1px #ffffff14; padding: 32px;
  user-select: text; -webkit-user-select: text;
}
#panel.pop { animation: pop .32s cubic-bezier(.2, 1.3, .4, 1); }
#panel h1 { font-size: 36px; letter-spacing: -1.2px; margin: 12px 0; }
.lead { font-size: 15px; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; margin: 16px 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 22px 0; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
.card { padding: 22px; border-radius: 14px; background: #ffffff07; border: 1px solid #ffffff15; transition: border-color .2s, transform .2s; }
.card:hover { border-color: #ffffff26; }
.card h3 { margin: 8px 0; font-size: 19px; }
.card p { margin: 8px 0 15px; }
.card.center { text-align: center; }
.card.center p { margin: 4px 0 0; }
.tag { font-size: 10px; letter-spacing: 1.3px; color: var(--lime); font-weight: 700; }
.fine { font-size: 11px; color: var(--faint); }
.big { font-size: 40px; font-weight: 800; color: var(--lime); font-variant-numeric: tabular-nums; }
.big.dim { color: var(--faint); }
.banner { padding: 12px 16px; border-radius: 12px; background: #b7f6751a; border: 1px solid #b7f67555; color: var(--text); font-weight: 600; }
.quote { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.quote strong { display: block; margin-top: 6px; }
.quote p { margin: 4px 0 0; font-style: italic; }
.wallet { font-size: 22px; font-weight: 800; color: var(--gold); padding: 8px 16px; border-radius: 12px; background: #f7e36b14; border: 1px solid #f7e36b44; }

.mini-stats { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.mini-stats div { flex: 1; min-width: 90px; padding: 12px; border-radius: 12px; background: #ffffff08; border: 1px solid var(--line); }
.mini-stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.mini-stats small { font-size: 11px; color: var(--faint); }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0; }
.summary span { padding: 6px 12px; border-radius: 99px; background: #ffffff0c; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }

/* Ilustración del minijuego */
.art { position: relative; height: 124px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: linear-gradient(#0b0a26, #2a1553 60%, #c2407e); }
.art-sunset { background: linear-gradient(#2b1a4d, #c2507a 60%, #ffb36b); }
.art-sun {
  position: absolute; left: 50%; bottom: 38px; width: 74px; height: 74px; margin-left: -37px; border-radius: 50%;
  background: linear-gradient(#ffe07a, #ff4f9a); filter: drop-shadow(0 0 18px #ff4f9a);
  -webkit-mask: linear-gradient(#000 55%, transparent 55% 60%, #000 60% 70%, transparent 70% 74%, #000 74% 84%, transparent 84% 89%, #000 89%);
  mask: linear-gradient(#000 55%, transparent 55% 60%, #000 60% 70%, transparent 70% 74%, #000 74% 84%, transparent 84% 89%, #000 89%);
}
.art-road {
  position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background:
  linear-gradient(90deg, transparent 49.4%, #c7d2ee 49.4% 50.6%, transparent 50.6%),
  repeating-linear-gradient(90deg, #d24fff55 0 1px, transparent 1px 26px), #1a1238;
  transform: perspective(90px) rotateX(38deg); transform-origin: bottom;
}
.art-star { position: absolute; right: 22%; top: 26px; font-size: 26px; color: var(--gold); text-shadow: 0 0 14px var(--gold); animation: float 2s ease-in-out infinite; }

.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: #0e192e; border: 1px solid var(--line); margin: 4px 0 10px; }
.seg button { padding: 7px 12px; border: 0; background: transparent; font-size: 13px; }
.seg button.on { background: #ffffff1a; color: var(--lime); }

.toggle { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; cursor: pointer; font-size: 14px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 40px; height: 22px; border-radius: 99px; background: #ffffff22; position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform .2s; }
.toggle input:checked + .switch { background: #ff4d4d; }
.toggle input:checked + .switch::after { transform: translateX(18px); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--lime); outline-offset: 2px; }

/* Editor */
.clip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #ffffff06; border: 1px solid transparent; border-radius: 10px; margin-top: 8px; cursor: pointer; transition: background .15s, border-color .15s; }
.clip:hover { background: #ffffff0d; }
.clip:has(input:checked) { border-color: #b7f67544; background: #b7f6750d; }
.clip input { accent-color: var(--lime); width: 16px; height: 16px; }
.clip-icon { width: 22px; text-align: center; }
.clip-time { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.field { position: relative; margin: 8px 0 18px; }
.count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--faint); }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 18px; }
.thumb-pick { padding: 4px; border-radius: 12px; }
.thumb-pick.select { border-color: var(--lime); background: #b7f67518; box-shadow: 0 0 0 2px #b7f67544; }
.reach { padding: 14px; border-radius: 12px; background: #0e192e; border: 1px solid var(--line); }
.reach b { color: var(--lime); font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 9px; background: #ffffff12; margin: 10px 0 4px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; border-radius: 9px; background: linear-gradient(90deg, #6c8fd8, var(--lime)); transition: width .35s ease; }
.reach .fine { margin: 6px 0 0; }

/* Miniaturas de vídeo */
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; display: grid; place-items: center; color: white; background: linear-gradient(135deg, #7474e8, #354962); }
.thumb.t1 { background: linear-gradient(135deg, #ecad73, #b65969); }
.thumb.t2 { background: linear-gradient(135deg, #9b5fc0, #2a1553); }
.thumb.t3 { background: linear-gradient(135deg, #e8584f, #3b1430); }
.thumb.t4 { background: linear-gradient(135deg, #3f9f8d, #16324a); }
.thumb::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 70% 20%, #ffffff33, transparent 55%); }
.thumb-icon { font-size: 30px; text-shadow: 0 4px 16px #0006; }
.thumb-label { position: absolute; left: 6px; top: 6px; font-size: 8px; font-weight: 800; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; background: #0007; }
.thumb-title { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 11px; font-weight: 800; line-height: 1.2; text-shadow: 0 2px 6px #000a; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.video .thumb { margin-bottom: 12px; }
.video .thumb-icon { font-size: 40px; }
.video h3 { font-size: 16px; }
.published { display: flex; gap: 18px; align-items: center; margin: 18px 0 0; }
.published .thumb { width: 200px; flex: none; }

/* Tienda */
.shop-item { display: flex; flex-direction: column; }
.shop-item button { margin-top: auto; }
.shop-item.owned { border-color: #b7f67544; }
.shop-icon { font-size: 30px; margin-bottom: 8px; }
.pips { display: flex; gap: 5px; margin: 0 0 14px; }
.pips i { width: 22px; height: 5px; border-radius: 3px; background: #ffffff1c; }
.pips i.on { background: var(--lime); box-shadow: 0 0 8px #b7f67588; }

/* Confeti al publicar */
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 22px; }
.confetti i {
  position: absolute; top: -12px; left: var(--x); width: 8px; height: 13px; border-radius: 2px; background: var(--c);
  animation: confetti 2.2s var(--d) cubic-bezier(.25, .6, .5, 1) forwards; opacity: 0;
}

@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(-16px); } }
@keyframes bob { 50% { transform: translate(-50%, -4px); } }
@keyframes float { 50% { transform: translateY(-6px) rotate(8deg); } }
@keyframes confetti {
  0% { opacity: 1; transform: translateY(0) rotate(0); }
  100% { opacity: 0; transform: translateY(520px) rotate(var(--r)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

@media (max-width: 860px) {
  .grid.three { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  header { padding: calc(14px + var(--sat)) 16px 14px; gap: 8px; flex-wrap: wrap; }
  .brand { font-size: 28px; letter-spacing: -2px; }
  .brand small { display: none; }
  #stats { gap: 6px; }
  .stat { min-width: 0; padding: 6px 10px; }
  .stat small { font-size: 8px; letter-spacing: 1px; }
  .stat strong { font-size: 15px; }
  #help { padding: 9px 11px; }
  #walls { padding: 9px 11px; font-size: 16px; }
  #walls .wl { display: none; }
  aside { top: auto; bottom: 70px; left: 16px; right: 16px; width: auto; padding: 14px 16px; }
  aside h2 { font-size: 18px; margin: 6px 0 4px; }
  aside p { display: none; }
  #location { display: none; }
  #prompt { bottom: 196px; }
  .grid { grid-template-columns: 1fr; }
  footer { gap: 6px 14px; padding: 12px 16px; font-size: 10px; }
  footer .home-only:nth-child(n+3) { display: none; }
  #panel { padding: 22px; max-height: calc(100vh - var(--sat) - var(--sab) - 24px); }
  #panel h1 { font-size: 28px; }
  .published { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 480px) {
  #stats { order: 3; width: 100%; margin: 0; }
  .stat { flex: 1; }
  #sound { margin-left: auto; }
}

/* ---------- Biblioteca de juegos ---------- */
#panel.wide { width: min(1120px, 96vw); }
.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0; }
@media (max-width: 980px) { .games { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .games { grid-template-columns: 1fr; } }
.card.game { display: flex; flex-direction: column; padding: 16px; }
.card.game .art { height: 96px; margin-bottom: 12px; }
.card.game h3 { font-size: 17px; }
.card.game p { flex: 1; font-size: 13px; margin: 6px 0 12px; }
.card.game .fine { flex: none; margin: 8px 0 0; }
.channel-strip { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.channel-strip h3 { margin: 6px 0 0; }

  <script>
'use strict';
/* Putup · Motor 3D mínimo sobre Canvas 2D.
   Cada primitiva se convierte en polígonos que se ordenan por capa y profundidad
   (algoritmo del pintor). Incluye iluminación direccional + luces puntuales,
   niebla, recorte contra el plano cercano, brillos y partículas. */

const NEAR = 0.12;
const NO = Object.freeze({});
/** Respeta la preferencia del sistema: sin sacudidas ni líneas de velocidad. */
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const LAYER = Object.freeze({ BG: 0, FLOOR: 1, WALL: 1.5, RUG: 1.8, DECAL: 2, TRACK: 3, OBJ: 5 });

const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
/** Interpolación exponencial independiente de los FPS. */
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const rand = (a, b) => a + Math.random() * (b - a);
/** Pseudoaleatorio determinista (para detalles que no deben parpadear entre fotogramas). */
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- Color ---------- */
const colorCache = new Map();
function rgb(c) {
  if (typeof c !== 'string') return c;
  let v = colorCache.get(c);
  if (!v) {
    const n = parseInt(c.replace('#', ''), 16);
    v = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    colorCache.set(c, v);
  }
  return v;
}
const mixRGB = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
function css(c, a = 1) {
  const r = clamp(c[0] | 0, 0, 255), g = clamp(c[1] | 0, 0, 255), b = clamp(c[2] | 0, 0, 255);
  return a < 1 ? `rgba(${r},${g},${b},${a.toFixed(3)})` : `rgb(${r},${g},${b})`;
}
/** Tono HSL → RGB (0-255), para luces que cambian de color. */
function hsl(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}

/* ---------- Estado del renderizador ---------- */
const R = {
  ctx: null, w: 0, h: 0, dpr: 1,
  cam: null, faces: [], groups: [], drawOrder: [], sortBreaks: 0, cur: null, layer: LAYER.OBJ, group: null, base: { depth: 0, gd: 0, sub: 0 },
  light: V3.norm([-0.35, 1, 0.45]), ambient: 0.56, diffuse: 0.46,
  lights: [], fog: null, // fog = { color:[r,g,b], near, far }
};

function setCamera(pos, target, zoom = 1.1, horizon = 0.54) {
  const f = V3.norm(V3.sub(target, pos));
  const r = V3.norm(V3.cross(f, [0, 1, 0]));
  const u = V3.cross(r, f);
  R.cam = { pos, f, r, u, focal: Math.min(R.w, R.h) * zoom, cx: R.w / 2, cy: R.h * horizon };
}
function toCam(p) {
  const c = R.cam, v = [p[0] - c.pos[0], p[1] - c.pos[1], p[2] - c.pos[2]];
  return [V3.dot(v, c.r), V3.dot(v, c.u), V3.dot(v, c.f)];
}
function toScreen(c) {
  const k = R.cam.focal / c[2];
  return [R.cam.cx + c[0] * k, R.cam.cy - c[1] * k];
}
/** Mundo → pantalla. Devuelve [x, y, profundidad] o null si queda detrás de la cámara. */
function project(p) {
  const c = toCam(p);
  return c[2] < NEAR ? null : [...toScreen(c), c[2]];
}

/* ---------- Piezas genéricas ---------- */
/** Sofá orientado: `yaw` 0 mira hacia +z; `len` es el ancho. */
function drawCouch(x, z, yaw, len, body, cushion, pillows = []) {
  const p = rig(x, 0, z, yaw), seats = Math.max(1, Math.round(len / 1.1)), sw = (len - 0.5) / seats;
  shadow(x, z, len / 2 + 0.1, 0.62, 0.28);
  beginGroup([x, 0, z]);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) p(sx * (len / 2 - 0.12), 0.05, sz * 0.4, 0.08, 0.1, 0.08, '3a2f2a');
  p(0, 0.28, 0, len, 0.36, 1.0, body);
  p(0, 0.8, -0.4, len, 0.72, 0.22, body);
  for (let i = 0; i < seats; i++) {
    const cx = -len / 2 + 0.25 + sw * (i + 0.5);
    p(cx, 0.53, 0.12, sw - 0.04, 0.14, 0.76, cushion);
    p(cx, 0.8, -0.22, sw - 0.06, 0.46, 0.14, cushion);
  }
  for (const s of [-1, 1]) p(s * (len / 2 - 0.12), 0.52, 0.02, 0.24, 0.56, 1.04, body, { top: cushion });
  pillows.forEach(([px, c]) => p(px, 0.74, -0.1, 0.32, 0.32, 0.12, c, { ry: px * 0.4 }));
  endGroup();
}
function drawTableLamp(x, y, z, shade = 'ffe2b0') {
  box(x, y + 0.03, z, 0.18, 0.06, 0.18, '2a2f45');

}
/** Módulo de cocina bajo con encimera; `face` = dirección hacia la que mira el frente (+1/-1 en el eje). */
function counterModule(axis, x, z, w, kind, t) {
  const d = 0.62, frontSign = -1; // todos los tramos miran hacia el interior (-x o -z)
  const bx = axis === 'x' ? d : w, bz = axis === 'x' ? w : d;
  box(x, 0.43, z, bx - 0.02, 0.86, bz - 0.02, 'f2efe8');
  box(x + (axis === 'x' ? -0.02 : 0), 0.885, z + (axis === 'z' ? -0.02 : 0), bx + 0.03, 0.05, bz + 0.03, '3a3f55', { top: '4a5068' });
  const f = axis === 'x' ? makeFrame([x - d / 2 + 0.005, 0, z], [0, 0, 1], [0, 1, 0]) : makeFrame([x, 0, z - d / 2 + 0.005], [-1, 0, 0], [0, 1, 0]);
  if (kind === 'stove') {
    rectOn(f, 0, 0.42, w - 0.1, 0.62, '2b3042');
    rectOn(f, 0, 0.45, w - 0.24, 0.34, '4a5470', { over: true });
    rectOn(f, 0, 0.72, w - 0.2, 0.03, 'c9ced9', { over: true });
    for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) {
      const cx = x + (axis === 'x' ? i * 0.13 : j * 0.13), cz = z + (axis === 'x' ? j * 0.13 : i * 0.13);
      discOn(floorFrame(0.913), cx, -cz, 0.09, '1b1e28', NO, 0, 12);
      discOn(floorFrame(0.915), cx, -cz, 0.05, Math.sin(t * 3 + i + j) > 0.95 ? 'ff6a3d' : '2b2f3d', { emissive: true }, 0, 10);
    }
  } else if (kind === 'sink') {
    rectOn(f, -w / 4 + 0.01, 0.44, w / 2 - 0.06, 0.62, 'e4e0d8');
    rectOn(f, w / 4 - 0.01, 0.44, w / 2 - 0.06, 0.62, 'e4e0d8');
    floorRect(x + (axis === 'x' ? 0.05 : 0), z + (axis === 'z' ? 0.05 : 0), axis === 'x' ? 0.38 : w - 0.18, axis === 'x' ? w - 0.18 : 0.38, 0.912, '9aa3b5');
    const fx = x + (axis === 'x' ? 0.22 : 0), fz = z + (axis === 'z' ? 0.22 : 0);
    box(fx, 1.02, fz, 0.04, 0.22, 0.04, 'c9ced9');
    box(fx - (axis === 'x' ? 0.08 : 0), 1.12, fz - (axis === 'z' ? 0.08 : 0), axis === 'x' ? 0.18 : 0.03, 0.03, axis === 'x' ? 0.03 : 0.18, 'c9ced9');
  } else if (kind === 'drawers') {
    for (let k = 0; k < 3; k++) {
      rectOn(f, 0, 0.18 + k * 0.25, w - 0.08, 0.21, 'e4e0d8');
      rectOn(f, 0, 0.24 + k * 0.25, 0.18, 0.025, 'aab0bd', { over: true });
    }
  } else {
    rectOn(f, 0, 0.44, w - 0.08, 0.72, 'e4e0d8');
    rectOn(f, frontSign * (w / 2 - 0.12), 0.62, 0.025, 0.16, 'aab0bd', { over: true });
  }
}

}

    detail = next === PLAQUE_AT ? 'A los 1.000 suscriptores recibirás una placa para tu pared.' : 'Mejora tu equipo en la tienda: más calidad, más alcance.';
  } else { title = '¡Leyenda de Putup!'; detail = 'Has superado todos los hitos. Sigue creando por diversión.'; }
  $('#objective').textContent = title;
  $('#detail').textContent = detail;
  const pct = next ? ((subs - prev) / (next - prev)) * 100 : 100;
  $('#progress').innerHTML = `<i style="width:${pct.toFixed(1)}%"></i>`;
  $('#progress-label').textContent = next ? `${fmt(subs)} / ${fmt(next)} suscriptores` : `${fmt(subs)} suscriptores`;
}
const setStatText = key => { $('#' + key).textContent = (key === 'money' ? '$ ' : '') + fmt(shown[key]); };
/** Muestra los valores guardados sin animación (al arrancar). */
function syncStats() {
  for (const key of ['subs', 'views', 'money']) { shown[key] = save[key]; setStatText(key); }
}
/** Anima los contadores de la cabecera hacia los valores guardados. */
function tickStats(dt) {
  for (const key of ['subs', 'views', 'money']) {
    if (shown[key] === save[key]) continue;
    const before = Math.floor(shown[key]);
    shown[key] = Math.abs(save[key] - shown[key]) < 1 ? save[key] : damp(shown[key], save[key], 5, dt);
    if (Math.floor(shown[key]) !== before) {
      setStatText(key);
      $('#' + key).parentElement.classList.add('bump');
    } else if (shown[key] === save[key]) $('#' + key).parentElement.classList.remove('bump');
  }
}
function tickUI(dt) {
  if (toastLeft > 0 && (toastLeft -= dt) <= 0) $('#toast').classList.remove('show');
  tickStats(dt);
  const it = mode === 'home' && modal.hidden && !(avatar.nap > 0) ? nearestInteraction() : null;
  const text = it ? it.label() : '';
  if (text !== promptText) {
    promptText = text;
    const el = $('#prompt');
    if (text) el.innerHTML = `<kbd>E</kbd> ${text}`;
    el.classList.toggle('show', !!text);
  }
}

const RUN_TOUCH = [

function show(html, { onClose = null, wide = false } = {}) {
  keys.clear();
  panel.classList.toggle('wide', wide);
  avatar.target = null;
  modalOnClose = onClose;
  panel.innerHTML = html;
  modal.hidden = false;
  panel.classList.remove('pop');
  void panel.offsetWidth; // reinicia la animación de entrada
  panel.classList.add('pop');
  bind('close', closeModal);
  const first = panel.querySelector('.primary');
  if (first) first.focus();
}
function closeModal() {
  if (modal.hidden) return;
  modal.hidden = true;
  keys.clear();
  const focused = document.activeElement;
  if (focused && focused !== document.body && focused.blur) focused.blur(); // que Espacio no pulse un botón oculto
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if ((mode === 'run' && run && run.outro <= 0) || (mode === 'arcade' && arcade && arcade.outro <= 0)) Sound.startMusic();
  updateMission();
}
function bind(id, fn) {
  const el = document.getElementById(id);
  if (el) el.onclick = () => { Sound.click(); fn(); };
}
function heading(tag, title) {
  return `<div class="row between"><span class="eyebrow">${tag}</span><button id="close" class="ghost" aria-label="Cerrar">✕ Cerrar</button></div><h1>${title}</h1>`;
}
function thumbArt(i, title = '') {
  const t = THUMBS[i] || THUMBS[0];
  return `<div class="thumb t${i}"><span class="thumb-icon">${t.icon}</span><span class="thumb-label">${t.label}</span>${title ? `<span class="thumb-title">${escapeHTML(title)}</span>` : ''}</div>`;
}
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!Number.isFinite(s)) return '';
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  return `hace ${Math.floor(s / 86400)} d`;
}
const miniStats = items => `<div class="mini-stats">${items.map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join('')}</div>`;

    <div class="grid three">
      <div class="card center"><div class="big" data-count="${res.views}">0</div><p>vistas simuladas</p></div>
      <div class="card center"><div class="big" data-count="${res.subs}" data-prefix="+">+0</div><p>nuevos suscriptores</p></div>
      <div class="card center"><div class="big ${res.money ? '' : 'dim'}" data-count="${res.money}" data-prefix="$ ">$ 0</div><p>ingresos ficticios</p></div>
    </div>
    ${res.crossed.includes(MONETIZE_AT) ? '<p class="banner">🎉 ¡100 suscriptores! Has desbloqueado la monetización ficticia.</p>' : ''}
    ${res.crossed.includes(PLAQUE_AT) ? '<p class="banner">🏆 ¡1.000 suscriptores! Tu placa de plata ya cuelga en la pared del estudio.</p>' : ''}
    ${extra.map(m => `<p class="banner">🚀 ¡Superaste los ${fmt(m)} suscriptores!</p>`).join('')}
    ${save.subs < MONETIZE_AT ? `<p>Te faltan ${fmt(MONETIZE_AT - save.subs)} suscriptores para desbloquear los ingresos ficticios.</p>` : ''}
    ${save.channel ? '' : '<p class="banner">✏ Tu canal todavía no tiene nombre propio.</p>'}
    <button id="continue" class="primary">Continuar creando →</button>
    ${save.channel ? '' : '<button id="name-it">✏ Ponerle nombre al canal</button>'}
    <div class="confetti" aria-hidden="true">${confetti(40)}</div>`);
  countUp();
  bind('name-it', () => renameChannel(desktop));
  bind('continue', desktop);
}
function confetti(n) {
  const colors = ['#b7f675', '#f7e36b', '#ff7ab5', '#6c8fd8', '#ffffff'];
  let s = '';
  for (let i = 0; i < n; i++) {
    s += `<i style="--x:${rand(0, 100).toFixed(1)}%;--d:${rand(0, 0.7).toFixed(2)}s;--r:${Math.round(rand(-540, 540))}deg;--c:${colors[i % colors.length]}"></i>`;
  }
  return s;
}
function countUp() {
  const els = panel.querySelectorAll('[data-count]'), start = performance.now(), dur = 1200;
  const step = now => {
    const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
    els.forEach(el => { el.textContent = (el.dataset.prefix || '') + fmt(+el.dataset.count * e); });
    if (k < 1 && !modal.hidden) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function practiceResult(gameId, r) {
  const g = gameById(gameId), summary = r.summary || [`★ ${r.stars} estrellas`, `✕ ${r.hits} choques`, `${fmt(r.score)} puntos`];
  show(heading(`PRÁCTICA · ${g.name.toUpperCase()}`, '¡Buen entrenamiento!') + `
    <div class="summary">${summary.map(s => `<span>${s}</span>`).join('')}</div>
    <p>No activaste la grabación, así que esta partida no se puede publicar.</p>
    <div class="row"><button id="again" class="primary">Jugar otra vez grabando</button><button id="pc">Volver al ordenador</button></div>`);
  bind('again', () => { record = true; launchGame(gameId); });
  bind('pc', desktop);
}

function pause() {
  if ((mode !== 'run' && mode !== 'arcade') || !modal.hidden) return;
  Sound.stopMusic();
  show(heading(mode === 'run' ? 'SALTO NEÓN' : gameById(arcade.id).name.toUpperCase(), 'Partida en pausa') + `
    <p>${record ? 'La grabación continuará cuando vuelvas.' : 'Estás en una partida de práctica.'}</p>
    <div class="row"><button id="resume" class="primary">Seguir jugando</button><button id="quit">Abandonar partida</button></div>`);
  bind('resume', closeModal);
  bind('quit', abandonGame);
}

  <script>
'use strict';
/* Putup · Entrada, bucle principal y arranque. */

const canvas = $('#world');
R.ctx = canvas.getContext('2d');
const keys = new Set(); // teclas pulsadas por código físico (funciona igual en QWERTY y AZERTY)
let pointer = null;

/* ---------- Teclado ---------- */
const KEY_NAMES = { ' ': 'Space', spacebar: 'Space', escape: 'Escape', esc: 'Escape', arrowup: 'ArrowUp', arrowdown: 'ArrowDown', arrowleft: 'ArrowLeft', arrowright: 'ArrowRight' };
/** Código físico de la tecla; si el navegador no lo da (teclados virtuales), se deduce de e.key. */
function keyCode(e) {
  if (e.code) return e.code;
  const k = (e.key || '').toLowerCase();
  return k.length === 1 && k >= 'a' && k <= 'z' ? 'Key' + k.toUpperCase() : KEY_NAMES[k] || e.key;
}
window.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName, code = keyCode(e);
  if (tag === 'INPUT' || tag === 'TEXTAREA') { if (code === 'Escape') closeModal(); return; }
  if (modal.hidden && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) e.preventDefault();
  Sound.unlock();
  if (code === 'Escape') {
    if (!modal.hidden) closeModal();
    else if (mode === 'run' || mode === 'arcade') pause();
    else if (mode === 'cards') polQuit();
    return;
  }
  if (code === 'KeyM' && !e.repeat) { toggleSound(); return; }
  if (!modal.hidden) return;
  keys.add(code);
  if (e.repeat) return;
  if (mode === 'home') {
    const it = nearestInteraction();
    if (code === 'KeyE' && it) interact(it);
    else if (code === 'KeyC') toggleWalls();
    else if (code === 'KeyH') help();
  } else if (mode === 'run') {
    if (code === 'KeyA' || code === 'ArrowLeft') steer(-1);
    else if (code === 'KeyD' || code === 'ArrowRight') steer(1);
    else if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') jump();
    else if (code === 'KeyP') pause();
  } else if (mode === 'arcade') {
    if (code === 'KeyP') pause(); else arcadeKey(code);
  }
});
window.addEventListener('keyup', e => {
  const code = keyCode(e);
  keys.delete(code);
  if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') releaseJump();
});
const pausable = () => (mode === 'run' || mode === 'arcade') && modal.hidden;
window.addEventListener('blur', () => { keys.clear(); pointer = null; if (pausable()) pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && pausable()) pause(); });

/* ---------- Ratón y táctil ----------
   Casa: arrastrar gira la cámara, clic camina (o usa el ordenador), rueda acerca.
   Carrera: deslizar a los lados cambia de carril, hacia arriba salta; tocar el tercio izquierdo/derecho también. */
canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  pointer = { x: e.clientX, sx: e.clientX, sy: e.clientY, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!pointer) {
    if (mode === 'home' && e.pointerType === 'mouse') canvas.classList.toggle('over-pc', modal.hidden && !!pickInteraction(e.clientX, e.clientY));
    return;
  }
  const dx = e.clientX - pointer.x;
  pointer.x = e.clientX;
  if (Math.hypot(e.clientX - pointer.sx, e.clientY - pointer.sy) > 6) pointer.moved = true;
  if (mode === 'home' && pointer.moved) { view.goal += dx * 0.007; canvas.classList.add('dragging'); }
  else if (mode === 'arcade' && arcadePlaying() && arcade.def.drag) arcade.def.drag(arcade.s, e.clientX, e.clientY, arcade);
});
canvas.addEventListener('pointerup', e => {
  const p = pointer;
  pointer = null;
  canvas.classList.remove('dragging');
  if (!p || !modal.hidden) return;
  const dx = e.clientX - p.sx, dy = e.clientY - p.sy;
  if (mode === 'home') {
    if (!p.moved) homeClick(e.clientX, e.clientY);
  } else if (mode === 'run') {
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) steer(Math.sign(dx));
    else if (dy < -40) jump();
    else if (!p.moved) {
      if (e.clientX < R.w / 3) steer(-1);
      else if (e.clientX > (R.w * 2) / 3) steer(1);
      else jump();
    }
    releaseJump();
  } else if (mode === 'arcade') arcadePointer(e.clientX, e.clientY, dx, dy);
});
canvas.addEventListener('pointercancel', () => { pointer = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => {
  if (mode !== 'home' || !modal.hidden) return;
  e.preventDefault();
  view.distGoal = clamp(view.distGoal + Math.sign(e.deltaY) * 1.2, 7, 28);
}, { passive: false });

/* La barra táctil se rehace al cambiar de modo, así que escucha el contenedor.
   Un botón con data-hold entra en `keys` y el juego lo lee como tecla mantenida. */
const touchBar = $('#touch');
touchBar.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  b.setPointerCapture(e.pointerId);
  b.classList.add('down');
  Sound.unlock();
  const act = b.dataset.touch, code = b.dataset.code;
  if (act === 'left') steer(-1);
  else if (act === 'right') steer(1);
  else if (act === 'jump') jump();
  else if (code) { if (b.dataset.hold) keys.add(code); arcadeKey(code); }
});
const touchRelease = e => {
  const b = e.target.closest('button');
  if (!b) return;
  b.classList.remove('down');
  if (b.dataset.code) keys.delete(b.dataset.code);
  if (b.dataset.touch === 'jump') releaseJump();
};
touchBar.addEventListener('pointerup', touchRelease);
touchBar.addEventListener('pointercancel', touchRelease);

/* El botón "atrás" de Android llama aquí: devuelve true si el juego se ha quedado
   la pulsación (cerrar una ventana, pausar) y false para salir de la aplicación. */
window.putupBack = function () {
  if (!modal.hidden) { closeModal(); return true; }
  if (mode === 'run' || mode === 'arcade') { pause(); return true; }
  if (mode === 'cards') { polQuit(); return true; }
  return false;
};
$('#help').onclick = () => { Sound.unlock(); if (mode === 'run' || mode === 'arcade') pause(); else help(); };
$('#sound').onclick = () => { Sound.unlock(); toggleSound(); };
$('#walls').onclick = () => { Sound.unlock(); toggleWalls(); };

/* ---------- Bucle ---------- */
function drawVignette() {
  const ctx = R.ctx, g = ctx.createRadialGradient(R.w / 2, R.h / 2, Math.min(R.w, R.h) * 0.35, R.w / 2, R.h / 2, Math.max(R.w, R.h) * 0.75);
  g.addColorStop(0, 'rgba(6,9,22,0)');
  g.addColorStop(1, 'rgba(6,9,22,.5)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, R.w, R.h);
}

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  clock += dt;
  resizeRenderer(canvas);
  if (mode === 'run') { if (modal.hidden) updateRun(dt); }
  else if (mode === 'arcade') { if (modal.hidden) updateArcade(dt); }
  else if (mode === 'cards') updatePolenom(dt);
  else updateHome(dt);
  // Una partida puede terminar dentro de su actualización: se dibuja el modo en el que quedó.
  if (mode === 'run') renderRun(clock);
  else if (mode === 'arcade') renderArcade(clock);
  else if (mode === 'cards') { R.ctx.fillStyle = '#10152a'; R.ctx.fillRect(0, 0, R.w, R.h); }
  else renderHome(clock);
  drawVignette();
  tickUI(dt);
  requestAnimationFrame(frame);
}

Sound.setMuted(save.muted);
updateSoundButton();
updateWallsButton();
setModeUI();
syncStats();
stats();
help();
requestAnimationFrame(frame);
  </script>

  const sink = document.createElement('script');
  sink.id = 'qa-render-state';
  sink.type = 'application/json';
  document.body.appendChild(sink);
  setInterval(() => {
    const order = R.drawOrder, index = new Map(R.groups.map((g, i) => [g, i]));
    window.__qaRender = {
      camera: R.cam && R.cam.pos,
      sortBreaks: R.sortBreaks,
      groups: order.map((g, order) => ({
        index: index.get(g), order, box: g.box.slice(), screen: g.sb.slice(), depth: g.depth, faces: g.faces.length,
        behind: (g.behind || []).map(h => index.get(h)),
      })),
    };
    sink.textContent = JSON.stringify(window.__qaRender);
  }, 200);
})();
