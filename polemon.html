<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Polemon Edición Aventura</title>
<style>
/* Polemon — consola portátil oscura, un único aspecto visual deliberado. */
:root {
  --shell: #1b1726;
  --shell-hi: #2a2439;
  --bezel: #0d0b13;
  --ink: #ece6f6;
  --muted: #9a90b0;
  --btn-a: #d2425f;
  --btn-b: #c8577a;
  --btn-shadow: #6e1f35;
  --dpad: #3a3448;
  --dpad-hi: #4d4560;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  background: var(--shell);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: PS2P, "Press Start 2P", ui-monospace, monospace;
}
#app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-areas: "screen";
  grid-template-rows: minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  padding: 16px;
  gap: 12px;
}
#screen-wrap {
  grid-area: screen;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  border-radius: 6px;
  box-shadow: 0 0 0 6px var(--bezel), 0 0 0 8px var(--shell-hi), 0 12px 40px #0009;
  outline: none;
}
.pad { display: none; }

/* ---- Controles táctiles ---- */
body.touch #app {
  grid-template-areas: "screen screen" "dpad actions";
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-columns: 1fr 1fr;
}
body.touch .pad { display: flex; align-items: center; justify-content: center; }
body.touch.portrait #app { grid-template-rows: auto auto; align-content: center; gap: 28px; }
#dpad { grid-area: dpad; }
#actions { grid-area: actions; position: relative; gap: 14px; flex-wrap: wrap; max-width: 220px; justify-self: center; }
.cross {
  position: relative;
  width: 150px; height: 150px;
  touch-action: none;
}
.cross .arm, .cross .hub { position: absolute; background: var(--dpad); box-shadow: inset 0 -4px 0 #0005, 0 3px 0 #0007; }
.cross .arm.v { left: 50px; top: 4px; width: 50px; height: 142px; border-radius: 8px; }
.cross .arm.h { top: 50px; left: 4px; height: 50px; width: 142px; border-radius: 8px; }
.cross .hub { left: 50px; top: 50px; width: 50px; height: 50px; background: var(--dpad-hi); border-radius: 50%; box-shadow: none; transform: scale(.55); }
.cross.up .arm.v, .cross.down .arm.v, .cross.left .arm.h, .cross.right .arm.h { background: var(--dpad-hi); }
.btn {
  font: inherit;
  color: #fff;
  border: 0;
  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.btn.round {
  width: 72px; height: 72px; border-radius: 50%;
  font-size: 18px;
  background: var(--btn-a);
  box-shadow: inset 0 -6px 0 #0004, 0 4px 0 var(--btn-shadow);
}
.btn.round.b { background: var(--btn-b); margin-top: 40px; }
.btn.pill {
  flex-basis: 100%;
  max-width: 120px;
  margin: 4px auto 0;
  padding: 10px 0;
  font-size: 10px;
  border-radius: 20px;
  background: var(--dpad);
  color: var(--muted);
  box-shadow: 0 3px 0 #0007;
}
.btn.down, .btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 #0004, 0 1px 0 var(--btn-shadow); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

@media (orientation: landscape) {
  body.touch #app {
    grid-template-areas: "dpad screen actions";
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #actions { max-width: 170px; }
}
@media (orientation: landscape) and (max-height: 420px) {
  .cross { width: 120px; height: 120px; }
  .cross .arm.v { left: 40px; width: 40px; height: 112px; }
  .cross .arm.h { top: 40px; height: 40px; width: 112px; }
  .cross .hub { left: 40px; top: 40px; width: 40px; height: 40px; }
  .btn.round { width: 58px; height: 58px; font-size: 14px; }
  .btn.round.b { margin-top: 30px; }
}

/* ---- Entrada de nombre ---- */
#name-entry {
  position: fixed;
  left: 50%; top: 22%;
  transform: translateX(-50%);
  width: min(320px, calc(100% - 32px));
  box-sizing: border-box;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 16px;
  background: #f8f8f0;
  color: #303040;
  border: 4px solid #384868;
  border-radius: 8px;
  box-shadow: 0 10px 40px #000a;
  z-index: 10;
}
#name-entry[hidden] { display: none; }
#name-entry label { flex-basis: 100%; font-size: 11px; }
#name-entry input {
  flex: 1; min-width: 0;
  font: inherit; font-size: 14px;
  padding: 10px 8px;
  border: 2px solid #384868; border-radius: 4px;
  background: #fff; color: #303040;
  text-transform: uppercase;
  -webkit-user-select: text; user-select: text;
}
#name-entry button {
  font: inherit; font-size: 12px;
  padding: 10px 14px;
  border: 0; border-radius: 4px;
  background: var(--btn-a); color: #fff;
  box-shadow: 0 3px 0 var(--btn-shadow);
}
@media (prefers-reduced-motion: reduce) {
  .btn.down, .btn:active { transform: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="screen-wrap"><canvas id="screen" width="320" height="240" tabindex="0" aria-label="Pantalla del juego Polemon"></canvas></div>
  <div id="dpad" class="pad" aria-hidden="true">
    <div class="cross"><span class="arm v"></span><span class="arm h"></span><span class="hub"></span></div>
  </div>
  <div id="actions" class="pad" aria-hidden="true">
    <button type="button" class="btn round b" data-btn="b">B</button>
    <button type="button" class="btn round a" data-btn="a">A</button>
    <button type="button" class="btn pill" data-btn="start">MENU</button>
  </div>
  <form id="name-entry" hidden>
    <label for="name-input" id="name-label">Tu nombre</label>
    <input id="name-input" maxlength="8" autocomplete="off" spellcheck="false">
    <button type="submit" id="name-ok">OK</button>
  </form>
</div>

<script>
'use strict';
// ============================================================
//  Núcleo: pantalla, entrada, escenas, temporizadores y bucle
// ============================================================
const W = 320, H = 240, TS = 16;
// Tamaño nativo de los sprites grandes de criaturas (se dibujan a x2) y de los iconos
const SPR = 50, ICON = 30;
const FONT = 'PS2P, "Press Start 2P", ui-monospace, monospace';

const rnd = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  chance: p => Math.random() < p,
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  float: (a, b) => a + Math.random() * (b - a),
};
function seeded(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

// ---- Color ----
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) { return '#' + ((1 << 24) | (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255)).toString(16).slice(1); }
function darken(hex, f) { const [r, g, b] = hexToRgb(hex); return rgbToHex(r * f, g * f, b * f); }
function lighten(hex, f) { const [r, g, b] = hexToRgb(hex); return rgbToHex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f); }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---- Pantalla ----
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize() {
  const wrap = document.getElementById('screen-wrap');
  const touch = document.body.classList.contains('touch');
  const portrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', touch && portrait);
  const aw = Math.max(64, wrap.clientWidth - 16);
  const ah = touch && portrait ? Math.max(48, window.innerHeight - 300) : Math.max(48, wrap.clientHeight - 16);
  const css = Math.min(aw / W, ah / H);
  const dpr = window.devicePixelRatio || 1;
  SCALE = Math.max(1, Math.round(css * dpr));
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  canvas.style.width = Math.floor(W * css) + 'px';
  canvas.style.height = Math.floor(H * css) + 'px';
}
window.addEventListener('resize', () => resize());

// ---- Entrada ----
const Input = {
  down: Object.create(null), held: Object.create(null), _q: [], _rep: Object.create(null),
  pressed: Object.create(null), rpt: Object.create(null),
  keymap: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'a', Space: 'a', Enter: 'a', NumpadEnter: 'a', KeyJ: 'a',
    KeyX: 'b', Backspace: 'b', KeyK: 'b',
    Escape: 'start', KeyC: 'start', KeyQ: 'start', Tab: 'start',
    ShiftLeft: 'run', ShiftRight: 'run',

    catch: { bpm: 150, ch: [{ w: 'p50', v: .16, s: 'e5:2 g5:2 c6:2 e6:2 d6:2 c6:2 d6:2 g6:8' }, { w: 'tri', v: .2, s: 'c3:8 g3:8 c4:4' }] },
    badge: { bpm: 140, ch: [{ w: 'p50', v: .16, s: 'c6:2 c6:2 c6:2 g5:2 a5:2 b5:2 c6:4 e6:4 g6:8' }, { w: 'tri', v: .2, s: 'c3:6 f3:6 g3:4 c4:12' }] },
    item: { bpm: 160, ch: [{ w: 'p50', v: .15, s: 'g5:2 a5:2 b5:2 d6:6' }, { w: 'tri', v: .2, s: 'g3:12' }] },
    evodone: { bpm: 130, ch: [{ w: 'p50', v: .16, s: 'c6:2 b5:2 c6:2 e6:4 g6:4 e6:2 g6:2 c7:8' }, { w: 'tri', v: .2, s: 'c3:8 g3:8 c4:8' }] },
  };

  const parsed = {};
  function parse(song) {
    const chans = song.ch.map(c => {
      const ev = []; let t = 0;
      for (const tok of c.s.trim().split(/\s+/)) {
        const [n, l] = tok.split(':');

  function getSong(name, table = SONGS) { const k = (table === JINGLES ? 'j_' : '') + name; if (!parsed[k]) parsed[k] = parse(table[name]); return parsed[k]; }

  function init() {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? 0.55 : 0; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
    for (const [k, d] of [['p12', 0.125], ['p25', 0.25], ['p50', 0.5]]) {

  }
  function unlock() {
    if (!ac) init();

  function tone(dest, wave, f, t, dur, vol, slideTo) {
    const o = ac.createOscillator();

    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq;
    const g = ac.createGain();

    s.connect(fl); fl.connect(g); g.connect(dest);

  }
  function drum(dest, n, t, vol) {
    if (n === 'k') { tone(dest, 'sine', 150, t, 0.12, vol * 4, 45); }
    else if (n === 's') noise(dest, t, 0.12, vol * 2.2, 1800, 'bandpass');

  function music(name) {
    if (name === curName) return;
    curName = name;

    const song = getSong(name);
    const bus = ac.createGain(); bus.gain.value = 1; bus.connect(musicBus);

      const b = cur.bus;

  // Toca una melodía corta; la música se silencia mientras tanto
  function jingle(name) {

  function sfx(name) {
    if (!ac || muted) return;
    const t = ac.currentTime + 0.005, d = sfxBus;
    switch (name) {
      case 'blip': tone(d, 'p50', 1320, t, 0.045, 0.12); break;
      case 'move': tone(d, 'p25', 990, t, 0.03, 0.08); break;
      case 'bump': tone(d, 'p50', 90, t, 0.09, 0.18); break;
      case 'door': noise(d, t, 0.18, 0.25, 900, 'lowpass'); tone(d, 'p25', 220, t, 0.12, 0.1, 110); break;
      case 'stairs': for (let i = 0; i < 4; i++) tone(d, 'p25', 440 - i * 60, t + i * 0.05, 0.05, 0.1); break;
      case 'hit': noise(d, t, 0.16, 0.5, 1200, 'lowpass'); tone(d, 'p50', 220, t, 0.12, 0.15, 60); break;
      case 'super': noise(d, t, 0.25, 0.6, 2500, 'lowpass'); tone(d, 'p50', 330, t, 0.2, 0.18, 50); break;
      case 'weak': noise(d, t, 0.1, 0.3, 700, 'lowpass'); break;
      case 'faint': tone(d, 'p50', 700, t, 0.55, 0.15, 80); break;
      case 'ball': noise(d, t, 0.3, 0.25, 4000, 'bandpass'); tone(d, 'p25', 500, t, 0.3, 0.06, 1200); break;
      case 'shake': tone(d, 'p50', 200, t, 0.05, 0.15); tone(d, 'p50', 160, t + 0.08, 0.05, 0.15); break;
      case 'poof': noise(d, t, 0.35, 0.35, 1500, 'bandpass'); break;
      case 'exp': tone(d, 'p25', 400, t, 0.5, 0.08, 1200); break;
      case 'run': for (let i = 0; i < 3; i++) tone(d, 'p50', 800 - i * 200, t + i * 0.07, 0.06, 0.1); break;
      case 'statup': for (let i = 0; i < 5; i++) tone(d, 'p25', 500 + i * 120, t + i * 0.05, 0.05, 0.08); break;
      case 'statdown': for (let i = 0; i < 5; i++) tone(d, 'p25', 900 - i * 120, t + i * 0.05, 0.05, 0.08); break;
      case 'heal': for (let i = 0; i < 4; i++) tone(d, 'p25', 600 + i * 150, t + i * 0.06, 0.08, 0.08); break;
      case 'status': tone(d, 'p12', 300, t, 0.25, 0.1, 600); break;
      case 'error': tone(d, 'p50', 160, t, 0.15, 0.15); break;
      case 'money': tone(d, 'p50', 1500, t, 0.05, 0.1); tone(d, 'p50', 2000, t + 0.06, 0.1, 0.1); break;
      case 'surprise': tone(d, 'p50', 1100, t, 0.08, 0.12); tone(d, 'p50', 1500, t + 0.08, 0.12, 0.12); break;
      case 'jump': tone(d, 'p25', 300, t, 0.15, 0.1, 600); break;
      case 'bolt': noise(d, t, 0.3, 0.4, 3000); break;
    }
  }
  // Grito procedimental de cada especie
  function cry(spId, pitch = 1) {
    if (!ac || muted) return;
    const h = hashStr(spId);
    const sp = SPECIES[spId];
    const size = sp && sp.spr ? sp.spr.s || 0.8 : 0.8;
    const base = (260 + (h % 420)) * (1.25 - size * 0.45) * pitch;
    const t = ac.currentTime + 0.01;
    const segs = 2 + (h >> 4) % 2;
    let tt = t;
    for (let i = 0; i < segs; i++) {
      const f1 = base * (0.8 + ((h >> (i * 3)) & 7) / 10);
      const f2 = f1 * (0.6 + ((h >> (i * 5 + 2)) & 7) / 8);
      const dur = 0.09 + ((h >> (i * 2 + 7)) & 3) * 0.04;
      tone(sfxBus, i % 2 ? 'p25' : 'p50', f1, tt, dur, 0.12, f2);
      tt += dur * 0.9;
    }
  }
  function toggleMute() {
    muted = !muted;
    Store.set('polemon_mute', muted ? '1' : '0');
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, ac.currentTime, 0.02);
  }
  function setMusic(on) { musicOn = on; if (musicBus) musicBus.gain.setTargetAtTime(on ? 0.55 : 0, ac.currentTime, 0.02); }
  return {
    unlock, music, sfx, cry, jingle, toggleMute, setMusic,
    get muted() { return muted; }, get current() { return curName; },
  };
})();

<script>
'use strict';
// ============================================================
//  Interfaz: cajas, texto, diálogos y menús de elección
// ============================================================
const BOX = {
  std: { out: '#2c3550', mid: '#7f9fd0', inn: '#d4e0f2', bg: '#fbfbf6', fg: '#363644', sh: '#d6d6ce' },
  dark: { out: '#0e1222', mid: '#6070a8', inn: '#36406a', bg: '#232b4a', fg: '#f4f4f4', sh: '#151a30' },
  hud: { out: '#3a3428', mid: '#a89868', inn: '#e0d4b0', bg: '#f8f4e4', fg: '#363644', sh: '#ddd6c0' },
  sign: { out: '#4a3420', mid: '#a07848', inn: '#c8a070', bg: '#f2e4c4', fg: '#3a2a18', sh: '#dccaa4' },
  red: { out: '#3a1620', mid: '#d05070', inn: '#f0b0c0', bg: '#fbf4f4', fg: '#363644', sh: '#ead6d6' },
};
function drawBox(x, y, w, h, style = 'std') {
  const s = BOX[style] || BOX.std;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = s.out;
  ctx.fillRect(x + 2, y, w - 4, h); ctx.fillRect(x, y + 2, w, h - 4); ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = s.mid;
  ctx.fillRect(x + 2, y + 1, w - 4, h - 2); ctx.fillRect(x + 1, y + 2, w - 2, h - 4);
  ctx.fillStyle = s.inn; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
  ctx.fillStyle = s.bg; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
}
function txt(s, x, y, col = '#363644', size = 8, align = 'left') {
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillStyle = col;
  ctx.fillText(fixGlyphs(String(s)), Math.round(x), Math.round(y));
}
// La fuente pixelada no tiene mayúsculas acentuadas legibles ni ligaduras
const ACC_UP = { 'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U', 'Ü': 'U' };
function fixGlyphs(s) { return s.replace(/[ÁÉÍÓÚÜ]/g, c => ACC_UP[c]).replace(/f(?=[ilf])/g, 'f\u200C'); }
function txtSh(s, x, y, col, sh, size = 8, align = 'left') {
  txt(s, x + 1, y + 1, sh, size, align);
  txt(s, x, y, col, size, align);
}
function textW(s, size = 8) { ctx.font = size + 'px ' + FONT; return ctx.measureText(fixGlyphs(String(s))).width; }
function fmt(s) {
  if (typeof G === 'undefined' || !G) return s;
  return String(s).replace(/\{P\}/g, G.name || 'ROJO').replace(/\{R\}/g, G.rival || 'GARI');
}
function wrapText(s, maxW, size = 8) {
  const out = [];
  for (const para of String(s).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (textW(t, size) > maxW && line) { out.push(line); line = w; }
      else line = t;
    }
    out.push(line);
  }
  return out;
}
function drawCursor(x, y, col = '#363644') {
  ctx.fillStyle = col;
  for (let i = 0; i < 4; i++) ctx.fillRect(x + i, y + i, 1, 7 - i * 2);
}
function drawDownArrow(x, y, col = '#c84050') {
  if (Math.floor(Game.time * 3) % 2) return;
  ctx.fillStyle = col;
  ctx.fillRect(x, y, 7, 1); ctx.fillRect(x + 1, y + 1, 5, 1); ctx.fillRect(x + 2, y + 2, 3, 1); ctx.fillRect(x + 3, y + 3, 1, 1);
}

// ---- Caja de texto (diálogo) ----
class TextBox {
  constructor(text, o = {}) {
    this.o = o;
    this.style = o.style || 'std';
    this.h = 48; this.x = 0; this.y = H - this.h; this.w = o.w || W;
    const pages = [];
    for (const part of fmt(text).split('|')) {
      const lines = wrapText(part, this.w - 24);
      for (let i = 0; i < lines.length; i += 2) pages.push(lines.slice(i, i + 2));
    }
    this.pages = pages.length ? pages : [['']];
    this.page = 0; this.chars = 0; this.autoT = 0; this.typedDone = false;
    this.resolve = null; this.onTyped = null;
  }
  get pageText() { return this.pages[this.page].join('\n'); }
  update(dt) {
    const total = this.pageText.length;
    if (this.chars < total) {
      const spd = [35, 70, 160][G && G.opts ? G.opts.speed : 1] || 70;
      const fast = Input.d('a') || Input.d('b');
      this.chars = Math.min(total, this.chars + spd * dt * (fast ? 3 : 1));
      if (Input.p('a') || Input.p('b')) this.chars = total;
      return;
    }
    if (this.o.hold) {
      if (!this.typedDone && this.page === this.pages.length - 1) { this.typedDone = true; if (this.onTyped) this.onTyped(); }
      else if (this.page < this.pages.length - 1 && (Input.p('a') || Input.p('b'))) { Sound.sfx('blip'); this.next(); }
      return;
    }
    if (this.o.auto != null) {
      this.autoT += dt * 1000;
      if (this.autoT >= this.o.auto || Input.p('a') || Input.p('b')) this.next();
    } else if (Input.p('a') || Input.p('b')) { Sound.sfx('blip'); this.next(); }
  }
  next() {
    if (this.page < this.pages.length - 1) { this.page++; this.chars = 0; this.autoT = 0; }
    else this.close();
  }
  close() { Scenes.remove(this); if (this.resolve) { const r = this.resolve; this.resolve = null; r(); } }
  draw() {
    const s = BOX[this.style];
    drawBox(this.x, this.y, this.w, this.h, this.style);
    const shown = this.pageText.slice(0, Math.floor(this.chars)).split('\n');
    shown.forEach((l, i) => txtSh(l, this.x + 12, this.y + 12 + i * 16, s.fg, s.sh));
    const full = this.chars >= this.pageText.length;
    if (full && !(this.o.hold && this.page === this.pages.length - 1) && this.o.auto == null) drawDownArrow(this.x + this.w - 18, this.y + this.h - 10);
  }
}
function say(text, o = {}) {
  return new Promise(res => { const tb = new TextBox(text, o); tb.resolve = res; Scenes.push(tb); });
}
// Muestra un texto que permanece abierto; devuelve la caja cuando termina de escribirse
function sayHold(text, o = {}) {
  return new Promise(res => {
    const tb = new TextBox(text, Object.assign({}, o, { hold: true }));
    tb.onTyped = () => res(tb);
    Scenes.push(tb);
  });
}

// ---- Menú de elección ----
class Choice {
  constructor(items, o = {}) {
    this.items = items; this.o = o;
    this.i = clamp(o.start || 0, 0, items.length - 1);
    this.cols = o.cols || 1;
    this.rows = Math.ceil(items.length / this.cols);
    const size = o.size || 8;
    this.size = size;
    this.rowH = o.rowH || 16;
    const maxW = Math.max(...items.map(t => textW(typeof t === 'string' ? t : t.label, size)));
    this.colW = o.colW || maxW + 20;
    this.w = o.w || this.colW * this.cols + 16;
    this.h = o.h || this.rows * this.rowH + 12;
    this.x = o.x != null ? o.x : W - this.w - 2;
    this.y = o.y != null ? o.y : H - 48 - this.h - 2;
    this.style = o.style || 'std';
    this.resolve = null;
    if (o.onMove) o.onMove(this.i);
  }
  label(k) { const t = this.items[k]; return typeof t === 'string' ? t : t.label; }
  move(di) {
    const n = this.items.length, prev = this.i;
    if (this.cols === 1) this.i = (this.i + di + n) % n;
    else {
      let r = Math.floor(this.i / this.cols), c = this.i % this.cols;
      if (di === -1 || di === 1) c = clamp(c + di, 0, this.cols - 1);
      else r = clamp(r + Math.sign(di), 0, this.rows - 1);
      const ni = r * this.cols + c;
      if (ni < n) this.i = ni;
    }
    if (prev !== this.i) { Sound.sfx('move'); if (this.o.onMove) this.o.onMove(this.i); }
  }
  update() {
    if (this.cols === 1) {
      if (Input.r('up')) this.move(-1);
      if (Input.r('down')) this.move(1);
    } else {
      if (Input.r('left')) this.move(-1);
      if (Input.r('right')) this.move(1);
      if (Input.r('up')) this.move(-10);
      if (Input.r('down')) this.move(10);
    }
    if (Input.p('a')) {
      const t = this.items[this.i];
      if (t && t.disabled) { Sound.sfx('bump'); return; }
      Sound.sfx('blip'); this.done(this.i);
    } else if (Input.p('b') && this.o.cancel !== false) { Sound.sfx('blip'); this.done(-1); }
  }
  done(v) { Scenes.remove(this); if (this.resolve) this.resolve(v); }
  draw() {
    const s = BOX[this.style];
    drawBox(this.x, this.y, this.w, this.h, this.style);
    for (let k = 0; k < this.items.length; k++) {
      const r = Math.floor(k / this.cols), c = k % this.cols;
      const x = this.x + 16 + c * this.colW, y = this.y + 8 + r * this.rowH + (this.rowH - this.size) / 2 - 2;
      const t = this.items[k];
      const col = t && t.disabled ? '#a0a0a8' : (t && t.color) || s.fg;
      txt(this.label(k), x, y, col, this.size);
      if (k === this.i) drawCursor(x - 9, y, s.fg);
    }
    if (this.o.extra) this.o.extra(this);
  }
}
function choose(items, o = {}) {
  return new Promise(res => { const c = new Choice(items, o); c.resolve = res; Scenes.push(c); });
}
// Pregunta con texto + opciones. Devuelve índice (−1 = cancelado)
async function ask(text, items = ['SÍ', 'NO'], o = {}) {
  const tb = await sayHold(text, o);
  const r = await choose(items, o);
  Scenes.remove(tb);
  return r;
}
async function yesNo(text, o = {}) { return (await ask(text, ['SÍ', 'NO'], o)) === 0; }

// ---- Selector de cantidad ----
class QtyPicker {
  constructor(max, price, o = {}) { this.max = Math.max(1, max); this.n = 1; this.price = price || 0; this.o = o; this.resolve = null; }
  update() {
    if (Input.r('up')) { this.n = this.n >= this.max ? 1 : this.n + 1; Sound.sfx('move'); }
    if (Input.r('down')) { this.n = this.n <= 1 ? this.max : this.n - 1; Sound.sfx('move'); }
    if (Input.r('right')) { this.n = Math.min(this.max, this.n + 10); Sound.sfx('move'); }
    if (Input.r('left')) { this.n = Math.max(1, this.n - 10); Sound.sfx('move'); }
    if (Input.p('a')) { Sound.sfx('blip'); this.done(this.n); }
    else if (Input.p('b')) { Sound.sfx('blip'); this.done(0); }
  }
  done(v) { Scenes.remove(this); this.resolve(v); }
  draw() {
    // caja sobre la de texto, a la derecha; flechas arriba/abajo centradas sobre las cifras
    const w = this.price ? 128 : 72, h = 28, x = W - w - 2, y = H - 48 - h - 2;
    drawBox(x, y, w, h);
    txt('x' + String(this.n).padStart(2, '0'), x + 12, y + 10);
    if (this.price) txt('$' + this.n * this.price, x + w - 12, y + 10, '#363644', 8, 'right');

    ctx.fillStyle = '#c84050';
    ctx.fillRect(ax, y + 6, 5, 1); ctx.fillRect(ax + 1, y + 5, 3, 1); ctx.fillRect(ax + 2, y + 4, 1, 1);
    ctx.fillRect(ax, y + 21, 5, 1); ctx.fillRect(ax + 1, y + 22, 3, 1); ctx.fillRect(ax + 2, y + 23, 1, 1);
  }
}
function pickQty(max, price) { return new Promise(res => { const q = new QtyPicker(max, price); q.resolve = res; Scenes.push(q); }); }

// ---- Elementos compartidos ----
function hpColor(f) { return f > 0.5 ? '#48d070' : f > 0.2 ? '#f0c030' : '#f05048'; }
function drawHPBar(x, y, w, frac) {
  frac = clamp(frac, 0, 1);
  ctx.fillStyle = '#383840'; ctx.fillRect(x - 1, y - 1, w + 2, 6);
  ctx.fillStyle = '#505058'; ctx.fillRect(x, y, w, 4);
  const fw = Math.ceil(w * frac);
  if (fw > 0) {
    ctx.fillStyle = hpColor(frac); ctx.fillRect(x, y, fw, 4);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y, fw, 1);

}
function drawTypeTag(type, x, y, w = 44) {

  ctx.fillStyle = t.color; ctx.fillRect(x + 1, y + 1, w - 2, 9);

}
const STATUS_TAG = {
  psn: ['ENV', '#a050c0'], brn: ['QUE', '#e06030'], par: ['PAR', '#d0b020'], slp: ['DOR', '#8890a0'], frz: ['CON', '#60b8e0'], fnt: ['DEB', '#b04040'],
};
function drawStatusTag(st, x, y) {

const SPECIES = {};
const DEX = [];
function sp(id, name, types, b, cr, xp, evo, ls, spr, dx) {
  const learn = ls.split(',').map(s => { const [l, m] = s.trim().split(/\s+/); return [+l, m]; });

  SPECIES[id] = { id, name, types: types.split('/'), base: b, cr, xp, evo: ev, learn, spr, dx, num: DEX.length + 1 };
  DEX.push(id);
}

<script>
'use strict';
// ============================================================
//  Arte procedimental de criaturas
//  Cada especie se describe con un "plan corporal", una paleta y rasgos.
//  Se dibuja con formas vectoriales que luego se cuantizan a píxeles,
//  con contorno oscuro por pieza y sombreado de 3 tonos.
// ============================================================
const Art = (() => {
  const cache = new Map();
  let N = 40, A = 32, E0 = 0, F0 = 0;   // tamaño de lienzo y transformación base
  let M = null, O = null;               // buffer RGBA principal y marca de contorno
  let tcv = null, tctx = null;
  let mat = [1, 0, 0, 1, 0, 0];
  const stack = [];
  let partPal = [];
  let eyes = [], marks = [];
  let curSp = null;

  const rgbCache = new Map();
  const rgb = h => { let v = rgbCache.get(h); if (!v) { v = hexToRgb(h); rgbCache.set(h, v); } return v; };

  function setMat(dx, dy, s) {
    mat = [A * s, 0, 0, A * s, A * (0.5 - 0.5 * s + dx) + E0, A * (1 - s + dy) + F0];
  }
  function toPx(u, v) { return [mat[0] * u + mat[4], mat[3] * v + mat[5]]; }
  function unitPx() { return 1 / mat[0]; }

  // ---- Geometría (coordenadas unitarias) ----
  const g = {
    c(col) { if (!partPal.includes(col)) partPal.push(col); tctx.fillStyle = col; tctx.strokeStyle = col; return g; },
    ell(x, y, rx, ry, rot = 0) { tctx.beginPath(); tctx.ellipse(x, y, Math.max(rx, 0.002), Math.max(ry, 0.002), rot, 0, Math.PI * 2); tctx.fill(); return g; },
    circ(x, y, r) { return g.ell(x, y, r, r); },
    poly(pts) { tctx.beginPath(); tctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) tctx.lineTo(pts[i], pts[i + 1]); tctx.closePath(); tctx.fill(); return g; },
    cap(x1, y1, x2, y2, r) {
      const w = Math.max(r * 2, unitPx() * 1.3);
      tctx.lineCap = 'round'; tctx.lineJoin = 'round'; tctx.lineWidth = w;
      tctx.beginPath(); tctx.moveTo(x1, y1); tctx.lineTo(x2, y2); tctx.stroke(); return g;
    },
    path(pts, r) {
      const w = Math.max(r * 2, unitPx() * 1.3);
      tctx.lineCap = 'round'; tctx.lineJoin = 'round'; tctx.lineWidth = w;
      tctx.beginPath(); tctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) tctx.lineTo(pts[i], pts[i + 1]); tctx.stroke(); return g;
    },
    curve(x1, y1, cx, cy, x2, y2, r) {
      const w = Math.max(r * 2, unitPx() * 1.3);
      tctx.lineCap = 'round'; tctx.lineWidth = w;
      tctx.beginPath(); tctx.moveTo(x1, y1); tctx.quadraticCurveTo(cx, cy, x2, y2); tctx.stroke(); return g;
    },
    rect(x, y, w, h) { tctx.fillRect(x, y, w, h); return g; },
    tri(x1, y1, x2, y2, x3, y3) { return g.poly([x1, y1, x2, y2, x3, y3]); },
    // llama en forma de lágrima apuntando hacia arriba
    flame(x, y, r, h, lean = 0) {
      tctx.beginPath();
      tctx.moveTo(x - r, y);
      tctx.quadraticCurveTo(x - r * 1.1, y - h * 0.55, x + lean, y - h);
      tctx.quadraticCurveTo(x + r * 1.1, y - h * 0.55, x + r, y);
      tctx.arc(x, y, r, 0, Math.PI, false);
      tctx.fill(); return g;
    },
  };

  // ---- Procesado de piezas ----
  function shadeCol(c, tone) {
    if (tone < 0) return [c[0] * 0.74 + 4, c[1] * 0.74 + 2, c[2] * 0.8 + 10];
    if (tone > 0) return [c[0] + (255 - c[0]) * 0.28, c[1] + (255 - c[1]) * 0.28, c[2] + (255 - c[2]) * 0.24];
    return c;
  }
  function outlineCol(c) { return [c[0] * 0.3 + 18, c[1] * 0.26 + 12, c[2] * 0.32 + 26]; }

  function part(color, fn, o = {}) {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.clearRect(0, 0, N, N);
    tctx.setTransform(mat[0], mat[1], mat[2], mat[3], mat[4], mat[5]);
    partPal = [];
    g.c(color);

    back: (id, n = 40) => get(id, n, true),
    icon: id => get(id, ICON, false),

      case TL.water: case TL.pool: mask = maskFor(map, x, y, n => n === TL.water || n === TL.pool || n === TL.bridge || n === TL.pier || n === -1 || n === TL.void); fr = frameT % 4; break;
      case TL.mount: mask = maskFor(map, x, y, n => n === TL.mount || n === TL.cave || n === -1); break;
      case TL.cwall: mask = maskFor(map, x, y, n => n === TL.cwall || n === -1 || n === TL.void); break;
      case TL.path: mask = maskFor(map, x, y, n => n === TL.path || n === TL.door || n === TL.struct || n === TL.bridge || n === -1 || n === TL.sign || n === TL.cave); break;
      case TL.bridge: { const l = map.at(x - 1, y), r = map.at(x + 1, y); mask = (l === TL.bridge || r === TL.bridge) ? 16 : 0; break; }
      case TL.flower: case TL.brazier: fr = frameT % 2; break;
      case TL.lava: case TL.ilava: fr = frameT % 4; break;
    }
    return drawTile(t, mask, fr, th, v);
  }
  // Hierba alta que tapa los pies
  let grassOverlay = null, darkOverlay = null;
  function overlay(dark) {
    if (!grassOverlay) {
      for (const d of [0, 1]) {
        const c = makeCanvas(16, 16), x = c.getContext('2d');
        const base = d ? '#3a8840' : '#4aa850', dk = d ? '#1e5828' : '#2c7838', lt = d ? '#60b058' : '#78d070';
        for (const [px, py] of [[0, 9], [4, 8], [8, 9], [12, 8]]) {
          x.fillStyle = dk; x.fillRect(px, py + 2, 1, 5); x.fillRect(px + 2, py + 2, 1, 5); x.fillStyle = base; x.fillRect(px + 1, py, 1, 7); x.fillStyle = lt; x.fillRect(px + 1, py, 1, 1);
        }
        x.fillStyle = base; x.fillRect(0, 13, 16, 3);
        if (d) darkOverlay = c; else grassOverlay = c;
      }
    }
    return dark ? darkOverlay : grassOverlay;
  }

  // ---- Edificios ----
  const BKIND = {
    house: { w: 4, h: 4, door: 1, roof: '#d05040', wall: '#f0e4c8' },
    bighouse: { w: 6, h: 4, door: 2, roof: '#5878c0', wall: '#f0e4c8' },
    center: { w: 5, h: 4, door: 2, roof: '#e05868', wall: '#f8f4f4', sign: 'cross' },
    mart: { w: 4, h: 4, door: 1, roof: '#4878d0', wall: '#f4f4f8', sign: 'TIENDA' },
    gym: { w: 7, h: 5, door: 3, roof: '#687890', wall: '#e0d8c8', sign: 'GIMNASIO' },
    lab: { w: 6, h: 4, door: 2, roof: '#888898', wall: '#f8f8f8', sign: 'LAB' },
    tower: { w: 5, h: 6, door: 2, roof: '#6a4a8a', wall: '#b8a8c8', tall: true },
    dept: { w: 7, h: 5, door: 3, roof: '#48a0a0', wall: '#f0f0e8', sign: 'COMERCIAL' },
    plant: { w: 6, h: 5, door: 2, roof: '#505868', wall: '#9098a8', sign: 'bolt' },
    league: { w: 9, h: 6, door: 4, roof: '#3858a8', wall: '#f4f0e4', sign: 'LIGA' },
    mansion: { w: 7, h: 5, door: 3, roof: '#6a4030', wall: '#d8c8a8' },
    museum: { w: 6, h: 4, door: 2, roof: '#a08060', wall: '#e8e0d0', sign: 'MUSEO' },
    dojo: { w: 6, h: 4, door: 2, roof: '#a04030', wall: '#f0e0c0', sign: 'DOJO' },
    silfo: { w: 7, h: 5, door: 3, roof: '#506878', wall: '#c8d0d8', sign: 'SILFO' },
  };
  function building(kind, opts = {}) {
    const key = 'B|' + kind + '|' + (opts.roof || '') + '|' + (opts.sign || '');
    let c = cache.get(key);
    if (c) return c;
    const K = BKIND[kind];
    const w = K.w * 16, h = K.h * 16;
    c = makeCanvas(w, h);
    const x = c.getContext('2d');
    const R = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(a, b, ww, hh); };
    const roof = opts.roof || K.roof, wall = K.wall;
    const roofH = K.tall ? h - 40 : Math.round(h * 0.5);
    const wallTop = roofH;
    // pared
    R(1, wallTop, w - 2, h - wallTop, wall);
    R(1, h - 3, w - 2, 3, darken(wall, 0.75));
    R(1, wallTop, w - 2, 2, darken(wall, 0.85));
    // tejado
    const rd = darken(roof, 0.7), rl = lighten(roof, 0.25);
    R(0, 2, w, roofH - 2, roof);
    R(2, 0, w - 4, 2, roof);
    for (let yy = 6; yy < roofH - 4; yy += 5) R(1, yy, w - 2, 1, rd);
    R(2, 1, w - 4, 2, rl);
    R(0, roofH - 4, w, 4, rd);
    R(0, roofH - 1, w, 1, darken(roof, 0.5));
    // contorno
    x.fillStyle = '#302830';
    x.fillRect(0, 2, 1, roofH - 2); x.fillRect(w - 1, 2, 1, roofH - 2); x.fillRect(2, 0, w - 4, 1);
    x.fillRect(1, wallTop, 1, h - wallTop); x.fillRect(w - 2, wallTop, 1, h - wallTop);
    // puerta
    const dx = K.door * 16;
    const doorC = kind === 'center' || kind === 'mart' || kind === 'dept' || kind === 'silfo' ? '#78c8e8' : '#8a5a30';
    R(dx + 2, h - 14, 12, 14, '#302830');
    R(dx + 3, h - 13, 10, 13, doorC);
    if (doorC === '#78c8e8') { R(dx + 8, h - 13, 1, 13, '#4890b0'); R(dx + 4, h - 12, 2, 6, '#c8f0ff'); }
    else { R(dx + 11, h - 7, 1, 2, '#f0c040'); R(dx + 3, h - 13, 10, 1, darken(doorC, 0.7)); }
    // ventanas
    const winY = K.tall ? wallTop + 6 : h - 14;
    for (let i = 0; i < K.w; i++) {
      if (i === K.door) continue;
      if (K.w > 5 && (i === K.door - 1 || i === K.door + 1) && kind !== 'tower') continue;
      const wx = i * 16 + 3;
      R(wx, winY, 10, 8, '#384858'); R(wx + 1, winY + 1, 8, 6, '#88c0e8'); R(wx + 1, winY + 1, 3, 2, '#d8f0ff'); R(wx + 5, winY + 1, 1, 6, '#384858');
    }
    if (K.tall) for (let yy = wallTop + 20; yy < h - 18; yy += 14) for (let i = 1; i < K.w - 1; i += 2) { const wx = i * 16 + 3; R(wx, yy, 10, 8, '#283040'); R(wx + 1, yy + 1, 8, 6, '#a080c0'); }
    // letrero
    const sign = opts.sign || K.sign;
    if (sign) {
      const sy = Math.max(3, roofH - 15);
      if (sign === 'cross') {
        R(w / 2 - 8, sy, 16, 12, '#f8f8f8'); R(w / 2 - 8, sy, 16, 1, '#c8c8c8');
        R(w / 2 - 2, sy + 2, 4, 8, '#e04050'); R(w / 2 - 5, sy + 4, 10, 4, '#e04050');
      } else if (sign === 'bolt') {
        R(w / 2 - 8, sy, 16, 12, '#303038');
        x.fillStyle = '#f0d030'; x.beginPath(); x.moveTo(w / 2 + 2, sy + 1); x.lineTo(w / 2 - 4, sy + 7); x.lineTo(w / 2, sy + 7); x.lineTo(w / 2 - 2, sy + 11); x.lineTo(w / 2 + 4, sy + 5); x.lineTo(w / 2, sy + 5); x.closePath(); x.fill();
      } else {
        x.font = '8px ' + FONT; const tw = Math.ceil(x.measureText(sign).width) + 6;
        const sx = Math.round(w / 2 - tw / 2);
        R(sx, sy, tw, 12, '#f8f8f0'); R(sx, sy + 11, tw, 1, '#a0a098');
        x.fillStyle = '#304068'; x.textBaseline = 'top'; x.textAlign = 'left'; x.fillText(sign, sx + 3, sy + 2);
      }
    }
    if (kind === 'league') { for (let i = 0; i < K.w; i += 2) R(i * 16 + 6, wallTop + 2, 4, h - wallTop - 4, '#e8dcc0'); R(0, wallTop, w, 2, '#d8b848'); }
    cache.set(key, c);
    return c;
  }
  return { tileImg, overlay, building, BKIND, drawTile };
})();

<script>
'use strict';
// ============================================================
//  Polemon individuales: stats, experiencia, movimientos, evolución
// ============================================================
const EXP_MULT = 1.35;
let _uid = 1;
function expAt(n) { return n <= 1 ? 0 : n * n * n; }
function calcStats(m) {
  const b = SPECIES[m.sp].base, L = m.lvl, iv = m.iv;
  m.maxhp = Math.floor((2 * b[0] + iv[0]) * L / 100) + L + 10;
  const st = i => Math.floor((2 * b[i] + iv[i]) * L / 100) + 5;
  m.atk = st(1); m.def = st(2); m.spa = st(3); m.spd = st(4); m.spe = st(5);
}
function defaultMoves(spId, lvl) {
  const ids = [];
  for (const [l, mvId] of SPECIES[spId].learn) if (l <= lvl && !ids.includes(mvId)) ids.push(mvId);
  return ids.slice(-4).map(id => ({ id, pp: MOVES[id].pp }));
}
function makeMon(spId, lvl, o = {}) {
  if (!SPECIES[spId]) throw new Error('Especie desconocida: ' + spId);
  const ivMin = o.ivMin || 0;
  const m = {
    uid: Date.now().toString(36) + '_' + (_uid++) + '_' + Math.floor(Math.random() * 1e6).toString(36),
    sp: spId, lvl, exp: expAt(lvl), iv: Array.from({ length: 6 }, () => rnd.int(ivMin, 31)),
    hp: 0, status: null, sleep: 0, moves: [], nick: o.nick || null, ot: o.ot || null,
  };
  calcStats(m);
  m.hp = m.maxhp;
  m.moves = o.moves ? o.moves.map(id => ({ id, pp: MOVES[id].pp })) : defaultMoves(spId, lvl);
  return m;
}
function monName(m) { return m.nick || SPECIES[m.sp].name; }
function learnAt(spId, lvl) { return SPECIES[spId].learn.filter(([l]) => l === lvl).map(x => x[1]); }
function knows(m, mvId) { return m.moves.some(x => x.id === mvId); }
// Sube experiencia sin interfaz (devuelve niveles alcanzados)
function addExpRaw(m, amt) {
  const levels = [];
  m.exp += amt;
  while (m.lvl < 100 && m.exp >= expAt(m.lvl + 1)) levels.push(levelUpRaw(m));
  return levels;
}
function levelUpRaw(m) {
  const old = { maxhp: m.maxhp, atk: m.atk, def: m.def, spa: m.spa, spd: m.spd, spe: m.spe };
  m.lvl++;
  if (m.exp < expAt(m.lvl)) m.exp = expAt(m.lvl);
  calcStats(m);
  if (m.hp > 0) m.hp = Math.min(m.maxhp, m.hp + (m.maxhp - old.maxhp));
  return { lvl: m.lvl, old };
}
function evoTarget(m, trigger, item) {
  for (const e of SPECIES[m.sp].evo) {
    if (trigger === 'level' && e.lvl && m.lvl >= e.lvl) return e.to;
    if (trigger === 'item' && e.item && e.item === item) return e.to;
    if (trigger === 'trade' && e.trade) return e.to;
  }
  return null;
}
function evolveRaw(m, to) {
  const oldMax = m.maxhp;
  m.sp = to;
  calcStats(m);
  if (m.hp > 0) m.hp = Math.min(m.maxhp, m.hp + (m.maxhp - oldMax));
  registerCaught(to);
}
function healMon(m) { m.hp = m.maxhp; m.status = null; m.sleep = 0; for (const mv of m.moves) mv.pp = MOVES[mv.id].pp; }
function healParty() { for (const m of G.party) healMon(m); }
function aliveCount() { return G.party.filter(m => m.hp > 0).length; }
function firstAlive() { return G.party.findIndex(m => m.hp > 0); }
function registerSeen(sp2) { if (G && G.dex) G.dex.seen[sp2] = true; }
function registerCaught(sp2) { if (G && G.dex) { G.dex.seen[sp2] = true; G.dex.caught[sp2] = true; } }
function dexCount() { return { seen: Object.keys(G.dex.seen).length, caught: Object.keys(G.dex.caught).length }; }
function avgPartyLevel() { return G.party.length ? Math.round(G.party.reduce((s, m) => s + m.lvl, 0) / G.party.length) : 5; }
function maxPartyLevel() { return G.party.reduce((s, m) => Math.max(s, m.lvl), 1); }
// Añade un Polemon al equipo o a la caja
function addToParty(m) {
  registerCaught(m.sp);
  if (!m.ot) m.ot = G.name;
  if (G.party.length < 6) { G.party.push(m); return 'party'; }
  G.box.push(m);
  return 'box';
}
function itemCount(id) { return G.bag[id] || 0; }
function addItem(id, n = 1) { G.bag[id] = (G.bag[id] || 0) + n; }
function removeItem(id, n = 1) { G.bag[id] = Math.max(0, (G.bag[id] || 0) - n); if (!G.bag[id]) delete G.bag[id]; }
function badgeCount() { return G.badges.filter(Boolean).length; }
function bestRod() { return itemCount('superCana') ? 3 : itemCount('canaBuena') ? 2 : itemCount('canaVieja') ? 1 : 0; }

const BALL_SPRITE = { bolsibola: 'bolsibola', superbola: 'superbola', ultrabola: 'ultrabola', masterbola: 'masterbola' };

const BTL = (() => {

  const PW = 16 * 4, PH = 20 * 4;                     // tamaño de las personas
  const e = { cx: W * 3 / 4, cy: Math.round(F * 0.54) };   // plataforma rival

    p: { cx: p.cx, bottom: F + 2, plat: [p.cx, p.cy, 75, 17], hud: { x: W - 157, y: F - 58, w: 152, h: 52 } },
    trainer: { x: e.cx - PW / 2, y: e.cy - PH - 8 },  // de pie sobre la plataforma rival

}

class BattleScene {

    this.p = new Side('p', G.party, Math.max(0, firstAlive()));

  msg(t, auto = 900) { return say(t, { style: 'dark', auto }); }
  msgWait(t) { return say(t, { style: 'dark' }); }
  stat(side, k) {

      case 'agua': this.spawn(18, () => ({ x: tx + rnd.float(-32, 32), y: ty - 38 + rnd.float(-12, 12), vx: rnd.float(-19, 19), vy: rnd.float(50, 112), life: rnd.float(.4, .7), c: rnd.pick(['#5898e0', '#a0d0f8', '#ffffff']), s: rnd.int(2, 3) })); break;
      case 'planta': case 'bicho': this.spawn(14, i => ({ x: tx, y: ty, vx: Math.cos(i) * rnd.float(38, 75), vy: Math.sin(i) * rnd.float(38, 75), life: rnd.float(.4, .7), c: rnd.pick([col, '#48a048', lc]), s: 3, shape: 'leaf' })); break;
      case 'electrico': this.spawn(6, () => ({ x: tx + rnd.float(-30, 30), y: ty - 42, vx: 0, vy: 0, life: .35, c: '#f8e040', shape: 'bolt', len: rnd.float(38, 62) })); this.flashT = 0.15; break;
      case 'hielo': this.spawn(16, () => ({ x: tx + rnd.float(-30, 30), y: ty + rnd.float(-25, 25), vx: rnd.float(-25, 25), vy: rnd.float(-25, 25), life: rnd.float(.4, .8), c: rnd.pick(['#c8f0ff', '#78c8d8', '#ffffff']), s: rnd.int(2, 4), shape: 'shard' })); break;
      case 'psiquico': case 'hada': for (let i = 0; i < 3; i++) this.parts.push({ x: tx, y: ty, vx: 0, vy: 0, life: .5 + i * .12, max: .5 + i * .12, c: type === 'hada' ? '#f8a8c8' : '#f858a8', shape: 'ring', delay: i * .1 }); this.spawn(8, () => ({ x: tx + rnd.float(-25, 25), y: ty + rnd.float(-25, 25), vx: 0, vy: -25, life: .5, c: '#fff0f8', s: 2 })); break;
      case 'fantasma': case 'siniestro': this.spawn(12, () => ({ x: tx + rnd.float(-25, 25), y: ty + rnd.float(-12, 25), vx: rnd.float(-19, 19), vy: rnd.float(-50, -12), life: rnd.float(.4, .8), c: rnd.pick(['#504070', '#302040', '#806098']), s: rnd.int(3, 5) })); break;

      case 'veneno': this.spawn(14, () => ({ x: tx + rnd.float(-25, 25), y: ty + rnd.float(0, 25), vx: rnd.float(-10, 10), vy: rnd.float(-50, -19), life: rnd.float(.4, .8), c: rnd.pick(['#a040a0', '#d080d0', '#703070']), s: rnd.int(2, 4), shape: 'ring2' })); break;

      case 'dragon': this.spawn(16, i => ({ x: tx, y: ty, vx: Math.cos(i * .8) * 62, vy: Math.sin(i * .8) * 62, life: .6, c: rnd.pick(['#7038f8', '#a080f8', '#50a0f0']), s: 3 })); break;
