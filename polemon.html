  npcAt(x, y) {
    for (const n of this.npcs) {
      if (!this.visible(n)) continue;
      if ((n.x === x && n.y === y) || (n.moving && n.tx === x && n.ty === y)) return n;
    }
    return null;
  },
  blocked(x, y, forNpc) {
    const t = this.map.at(x, y);
    if (t < 0) return true;
    const tp = TP[t];
    if (tp.solid || tp.ledge) return true;
    if (forNpc && (tp.warp || tp.grass && false)) return true;
    if (this.npcAt(x, y)) return true;
    if (forNpc) { const p = this.p; if ((p.x === x && p.y === y) || (p.moving && p.tx === x && p.ty === y)) return true; }
    return false;
  },
  updateArea(force) {
    const m = this.map, p = this.p;
    const a = m.area(p.x, p.y);
    const name = fmt(a.name || m.name || '');
    const key = m.id + '|' + name;
    if (key !== this.areaKey) {
      const prevName = this.areaKey ? this.areaKey.split('|')[1] : null;
      this.areaKey = key;
      if (name && name !== prevName && (m.outdoor || force)) this.banner = { text: name, t: 0 };
      Sound.music(a.music || m.music || 'route');
    }
  },
  battleBg() {
    const m = this.map, a = m.area(this.p.x, this.p.y);
    if (a && a.bg) return a.bg;
    return m.bg || 'grass';
  },
  // ---------- bucle ----------
  update(dt) {
    const p = this.p;
    this.updateNpcs(dt);
    if (this.banner) { this.banner.t += dt; if (this.banner.t > 2.4) this.banner = null; }
    if (p.moving) { this.stepPlayer(dt); return; }
    if (this.lock) return;
    if (Input.p('start')) { Sound.sfx('blip'); this.run(() => startMenu()); return; }
    if (Input.p('a')) { this.interact(); return; }
    const d = Input.dir();
    if (!d) { p.turnT = 0; return; }
    if (d !== p.dir) {
      p.dir = d; G.dir = d; p.turnT = 0.09; return;
    }
    if (p.turnT > 0) { p.turnT -= dt; return; }
    this.tryMove(d);
  },
  tick(dt) { this.updateNpcs(dt); if (this.p.moving && this.lock) this.stepPlayer(dt); },
  tryMove(d) {
    const p = this.p, [dx, dy] = DIRS[d];
    const nx = p.x + dx, ny = p.y + dy;
    const t = this.map.at(nx, ny);
    if (t === TL.ledge && d === 'down' && !this.blocked(nx, ny + 1) && !this.npcAt(nx, ny + 1)) {
      Sound.sfx('jump');
      this.beginStep(nx, ny + 1, true);
      return true;
    }
    if (this.blocked(nx, ny)) {
      this.bumpT -= 1 / 60;
      if (this.bumpT <= 0) { Sound.sfx('bump'); this.bumpT = 0.35; }
      return false;
    }
    this.beginStep(nx, ny, false);
    return true;
  },
  beginStep(tx, ty, hop) {
    const p = this.p;
    p.fx = p.x; p.fy = p.y; p.tx = tx; p.ty = ty; p.t = 0; p.moving = true; p.hop = hop;
    p.run = !hop && (Input.d('b') || Input.d('run')) && !p.scripted;
    p.frame = (this.stepN++ % 2) + 1;
  },
  stepPlayer(dt) {
    const p = this.p;
    const dur = p.hop ? 0.36 : p.run ? RUN_T : WALK_T;
    p.t += dt / dur;
    if (p.t >= 1) {
      p.x = p.tx; p.y = p.ty; p.px = p.x * TS; p.py = p.y * TS; p.moving = false; p.hop = false;
      G.x = p.x; G.y = p.y;
      if (p.onDone) { const f = p.onDone; p.onDone = null; f(); }
      else if (!p.scripted) this.onStep();
      // continuar andando sin parón si se mantiene la dirección
      if (!this.lock && !p.moving && !p.scripted) {
        const d = Input.dir();
        if (d === p.dir) this.tryMove(d);
      }
    } else {
      p.px = lerp(p.fx, p.tx, p.t) * TS; p.py = lerp(p.fy, p.ty, p.t) * TS;
    }
  },
  updateNpcs(dt) {
    for (const n of this.npcs) {
      if (n.moving) {
        n.t += dt / (n.dur || NPC_T);
        if (n.t >= 1) { n.x = n.tx; n.y = n.ty; n.px = n.x * TS; n.py = n.y * TS; n.moving = false; if (n.onDone) { const f = n.onDone; n.onDone = null; f(); } }
        else { n.px = lerp(n.fx, n.tx, n.t) * TS; n.py = lerp(n.fy, n.ty, n.t) * TS; }
        continue;
      }
      if (this.lock || n.scripted || !this.visible(n)) continue;
      const mv = n.d.move;
      if (mv !== 'wander' && mv !== 'look') continue;
      n.wT -= dt;
      if (n.wT > 0) continue;
      n.wT = rnd.float(1.2, 3.5);
      const d = rnd.pick(['up', 'down', 'left', 'right']);
      n.dir = d;
      if (mv === 'wander') {
        const [dx, dy] = DIRS[d], nx = n.x + dx, ny = n.y + dy;
        if (Math.abs(nx - n.homeX) <= 2 && Math.abs(ny - n.homeY) <= 2 && !this.blocked(nx, ny, true)) this.npcBegin(n, nx, ny);
      }
    }
    if (!this.lock && !this.p.moving) this.checkSight();
  },
  npcBegin(n, tx, ty, dur) { n.fx = n.x; n.fy = n.y; n.tx = tx; n.ty = ty; n.t = 0; n.moving = true; n.dur = dur || NPC_T; },
  // ---------- ayudas para guiones ----------
  run(fn) {
    this.lock++;
    return Promise.resolve().then(fn).catch(e => { console.error(e); Game.error = String(e && e.stack || e); }).finally(() => { this.lock = Math.max(0, this.lock - 1); Input.consume(); });
  },
  npcStep(n, d, dur) {
    return new Promise(res => {
      n.dir = d;
      const [dx, dy] = DIRS[d];
      this.npcBegin(n, n.x + dx, n.y + dy, dur);
      n.onDone = res;
    });
  },
  playerStep(d) {
    return new Promise(res => {
      const p = this.p; p.dir = d;
      const [dx, dy] = DIRS[d];
      p.scripted = true;
      this.beginStep(p.x + dx, p.y + dy, false);
      p.run = false;
      p.onDone = () => { p.scripted = false; res(); };
    });
  },
  findNpc(id) { return this.npcs.find(n => n.id === id); },
  spawnNpc(d) { const n = this.makeNpc(d); n.scripted = true; this.npcs.push(n); return n; },
  removeNpc(n) { const i = this.npcs.indexOf(n); if (i >= 0) this.npcs.splice(i, 1); },
  facePlayer(n) { const p = this.p; const dx = p.x - n.x, dy = p.y - n.y; n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); },
  async walkNpcTo(n, x, y) {
    let guard = 0;
    while ((n.x !== x || n.y !== y) && guard++ < 40) {
      const d = n.x !== x ? (x > n.x ? 'right' : 'left') : (y > n.y ? 'down' : 'up');
      await this.npcStep(n, d);
    }
  },
  async warpTo(mapId, x, y, dir, sfx = 'door') {
    Sound.sfx(sfx);
    await Fade.out(200);
    this.load(mapId, x, y, dir);
    await Fade.in(200);
  },
  // ---------- eventos al pisar ----------
  async onStep() {
    const p = this.p, m = this.map;
    // repelente
    if (G.repel > 0) { G.repel--; if (G.repel === 0) return this.run(() => say('El efecto del REPELENTE se ha acabado.')); }
    // portales
    const w = m.getWarp(p.x, p.y);
    if (w) return this.run(() => this.takeWarp(w));
    this.updateArea();
    // disparadores
    for (const tr of m.triggers) {
      if (p.x >= tr.x && p.x < tr.x + tr.w && p.y >= tr.y && p.y < tr.y + tr.h && !G.flags['TR:' + tr.id]) {
        const fn = SCRIPTS[tr.script];
        if (fn) { await this.run(() => fn(tr)); return; }
      }
    }
    if (this.checkSight()) return;
    // encuentros
    const t = m.at(p.x, p.y);
    const a = m.area(p.x, p.y);
    let table = null, rate = 1 / 10;
    if (TP[t].grass) table = a.grass || m.enc;
    else if (m.dungeon && (t === TL.cfloor || t === TL.floor || t === TL.ice)) { table = m.enc; rate = m.encRate; }
    if (table && aliveCount() > 0 && rnd.chance(rate)) {
      const [sp2, lvl] = pickEncounter(table);
      const lead = G.party[firstAlive()];
      if (G.repel > 0 && lead && lvl < lead.lvl) return;
      return this.run(() => this.wildBattle(sp2, lvl));
    }
  },
  async takeWarp(w) {
    if (w.lock) {
      const L = w.lock;
      const ok = L.flag ? G.flags[L.flag] : badgeCount() >= (L.badges || 0);
      if (!ok) {
        await say(L.text || 'Está cerrado.');
        const back = OPP[this.p.dir];
        if (!this.blocked(this.p.x + DIRS[back][0], this.p.y + DIRS[back][1])) await this.playerStep(back);
        return;
      }
    }
    if (w.onEnter && SCRIPTS[w.onEnter]) await SCRIPTS[w.onEnter](w);
    const t = this.map.at(this.p.x, this.p.y);
    const sfx = t === TL.up || t === TL.down ? 'stairs' : 'door';
    await this.warpTo(w.to, w.x, w.y, w.dir || this.p.dir, sfx);
  },
  // ---------- entrenadores ----------
  checkSight() {
    if (this.lock || aliveCount() === 0) return false;
    const p = this.p;
    for (const n of this.npcs) {
      const t = n.d.trainer;
      if (!t || !t.sight || n.moving || !this.visible(n)) continue;
      if (G.flags['T:' + n.id]) continue;
      const [dx, dy] = DIRS[n.dir];
      for (let k = 1; k <= t.sight; k++) {
        const x = n.x + dx * k, y = n.y + dy * k;
        if (p.x === x && p.y === y) { this.run(() => this.engage(n, k)); return true; }
        const tt = this.map.at(x, y);
        if (tt < 0 || (TP[tt].solid && !TP[tt].water) || this.npcAt(x, y)) break;
      }
    }
    return false;
  },
  async engage(n, dist) {
    Sound.sfx('surprise');
    this.bubble = { n, t: 0 };
    await wait(650);
    this.bubble = null;
    for (let k = 1; k < dist; k++) await this.npcStep(n, n.dir);
    this.p.dir = OPP[n.dir];
    await say(n.d.trainer.intro);
    await this.trainerBattle(n);
  },
  async trainerBattle(n, override) {
    const t = Object.assign({ look: n.look }, n.d.trainer, override || {});
    let team = typeof t.team === 'function' ? t.team() : t.team;
    if (t.scale) { const base = Math.max(5, maxPartyLevel() - 1); team = team.map(([s, l]) => [s, clamp(base + l, 3, 100)]); }
    const party = team.map(([s, l]) => makeMon(s, l, { ivMin: t.boss ? 18 : 4 }));
    const r = await this.battle({ trainer: t, enemyParty: party, canLose: t.canLose });
    if (r === 'win') {
      if (!t.rematch) G.flags['T:' + n.id] = true;
      if (t.elite) G.flags['E_' + t.elite] = true;
      if (t.badge != null) await giveBadge(t.badge, t.reward);
      else if (t.reward) await giveItem(t.reward);
    }
    return r;
  },
  async battle(o) {
    o.bg = o.bg || this.battleBg();
    const r = await startBattle(o);
    if (r === 'lose' && !o.canLose) { await this.blackout(); return r; }
    if (r === 'lose' && o.canLose) healParty();
    await Fade.in(300);
    return r;
  },
  async wildBattle(sp2, lvl, o = {}) {
    const mon = makeMon(sp2, lvl, { ivMin: o.legend ? 20 : 0 });
    return this.battle(Object.assign({ wild: true, enemyParty: [mon] }, o));
  },
  async blackout() {
    G.money = Math.floor(G.money / 2);
    healParty();
    for (const e of ELITE) delete G.flags['E_' + e.id];
    const h = G.lastHeal || { map: 'casa_jugador', x: 4, y: 5 };
    this.load(h.map, h.x, h.y, 'up');
    await Fade.in(500);
    await say(G.name + ' corrió a ponerse a salvo y cuidó de su equipo.|Has perdido la mitad de tu dinero...');
  },
  // ---------- interacción ----------
  interact() {
    const p = this.p, [dx, dy] = DIRS[p.dir];
    let fx = p.x + dx, fy = p.y + dy;
    let n = this.npcAt(fx, fy);
    const t = this.map.at(fx, fy);
    if (!n && t === TL.counter) { n = this.npcAt(fx + dx, fy + dy); }
    if (n) { this.run(() => this.talk(n)); return; }
    const sign = this.map.signs.get(fx + ',' + fy);
    if (sign) { this.run(() => say(sign.replace(/\{BADGE(\d)\}/g, (_, i) => G.badges[+i] ? G.name : '...'))); return; }
    if (t === TL.pc) { this.run(() => pcMenu()); return; }
    if ((t === TL.water || t === TL.pool) && bestRod()) { this.run(() => this.fish(fx, fy)); return; }
    if (t === TL.tv) { this.run(() => say('Ponen una película: unos niños recorren el mundo con sus Polemon.|¡Ojalá fuera yo!')); return; }
    if (t === TL.shelf) { this.run(() => say('Está lleno de libros sobre Polemon.')); return; }
    if (t === TL.machine) { this.run(() => say('Una máquina para curar Polemon. ¡Hace «tilín-tilín»!')); return; }
    if (t === TL.kitchen) { this.run(() => say('Huele de maravilla.')); return; }
  },
  async talk(n) {
    const d = n.d;
    if (!d.gate && d.move !== 'none') this.facePlayer(n);
    if (d.item) {
      if (d.fake) {
        await say('¡Es una POLEBOLA!... ¡Un momento, se está moviendo!');
        const r = await this.wildBattle(d.fake.sp, d.fake.lvl);
        if (r !== 'lose') G.flags['I:' + n.id] = true;
        return;
      }
      G.flags['I:' + n.id] = true;
      await giveItem(d.item.id, d.item.qty, true);
      return;
    }
    if (d.legend) {
      if (d.intro) {
        const parts = d.intro.split('|');
        await say(parts[0]);
        Sound.cry(d.legend.sp);
        if (parts[1]) await say(parts[1]);
      }
      const r = await this.wildBattle(d.legend.sp, d.legend.lvl, { legend: true });
      if (r === 'win' || r === 'caught') {
        G.flags['L:' + n.id] = true;
        if (r === 'win') await say('El Polemon se marchó...');
      }
      return;
    }
    if (d.gate) { await say(d.gate.text); return; }
    if (d.starter) { await SCRIPTS.starterBall(n); return; }
    if (d.trainer) {
      const t = d.trainer;
      if (G.flags['T:' + n.id] && !t.rematch) { await say(t.after); return; }
      await say(t.intro);
      await this.trainerBattle(n);
      return;
    }
    if (d.script && SCRIPTS[d.script]) { await SCRIPTS[d.script](n); return; }
    if (d.text) await say(d.text);
  },
  async fish(fx, fy) {
    const rod = bestRod();
    await say('¡' + G.name + ' lanzó la caña!');
    const tb = await sayHold('...');
    await wait(rnd.int(800, 2200));
    Scenes.remove(tb);
    const a = this.map.area(fx, fy) || {};
    const table = a.fish === 'reserva' && rod >= 2 ? FISH.reserva : FISH[rod];
    if (rnd.chance(rod === 1 ? 0.85 : 0.7)) {
      Sound.sfx('surprise');
      await say('¡Ha picado algo!');
      const [sp2, lvl] = pickEncounter(table);
      await this.wildBattle(sp2, lvl, { bg: 'water' });
    } else await say('Parece que no pica nada...');
  },
  // ---------- dibujo ----------
  camera() {
    const m = this.map, p = this.p;
    let cx = Math.round(p.px + 8 - W / 2), cy = Math.round(p.py + 8 - H / 2);
    const mw = m.w * TS, mh = m.h * TS;
    cx = mw <= W ? Math.round((mw - W) / 2) : clamp(cx, 0, mw - W);
    cy = mh <= H ? Math.round((mh - H) / 2) : clamp(cy, 0, mh - H);
    return [cx, cy];
  },
  draw() {
    const m = this.map;
    if (!m) return;
    const [cx, cy] = this.camera();
    ctx.fillStyle = m.outdoor ? '#2e8040' : '#000';
    ctx.fillRect(0, 0, W, H);
    const fr = Math.floor(Game.time * 2.2);
    const x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS);
    for (let ty = y0; ty <= y0 + Math.ceil(H / TS); ty++) {
      for (let tx = x0; tx <= x0 + Math.ceil(W / TS); tx++) {
        if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) continue;
        ctx.drawImage(Tiles.tileImg(m, tx, ty, fr), tx * TS - cx, ty * TS - cy);
      }
    }
    for (const s of m.structs) {
      if ((s.x + s.w) * TS < cx || s.x * TS > cx + W || (s.y + s.h) * TS < cy || s.y * TS > cy + H) continue;
      ctx.drawImage(Tiles.building(s.kind, { roof: s.roof, sign: s.sign }), s.x * TS - cx, s.y * TS - cy);
    }
    // sprites
    const list = [];
    for (const n of this.npcs) if (this.visible(n)) list.push(n);
    list.push(this.p);
    list.sort((a, b) => a.py - b.py);
    for (const s of list) {
      const x = Math.round(s.px - cx), y = Math.round(s.py - cy);
      if (x < -20 || y < -24 || x > W + 4 || y > H + 4) continue;
      if (s === this.p) this.drawPlayer(x, y);
      else this.drawNpc(s, x, y);
      // hierba alta sobre los pies
      const gx = Math.round(s.px / TS), gy = Math.round(s.py / TS);
      const gt = m.at(gx, gy);
      if ((gt === TL.tall || gt === TL.darktall) && (!s.moving || s.t > 0.5)) ctx.drawImage(Tiles.overlay(gt === TL.darktall), gx * TS - cx, gy * TS - cy);
    }
    if (this.bubble) {
      const n = this.bubble.n, x = Math.round(n.px - cx), y = Math.round(n.py - cy) - 22;
      ctx.fillStyle = '#303040'; ctx.fillRect(x + 3, y, 10, 12);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 4, y + 1, 8, 10);
      ctx.fillStyle = '#e03030'; ctx.fillRect(x + 7, y + 2, 2, 5); ctx.fillRect(x + 7, y + 8, 2, 2);
    }
    if (this.banner) {
      const b = this.banner, tw = textW(b.text) + 20;
      const yy = b.t < 0.25 ? -26 + 30 * (b.t / 0.25) : b.t > 2.1 ? 4 - 30 * ((b.t - 2.1) / 0.3) : 4;
      drawBox(4, Math.round(yy), tw, 22, 'sign');
      txt(b.text, 14, Math.round(yy) + 7, '#3a2a18');
    }
  },
  drawPlayer(x, y) {
    const p = this.p;
    let f = 0;
    if (p.moving && !p.hop) f = p.t > 0.25 && p.t < 0.8 ? p.frame : 0;
    let oy = 0;
    if (p.hop) oy = -Math.sin(p.t * Math.PI) * 10;
    People.draw(ctx, 'player', p.dir, f, x, y + oy);
  },
  drawNpc(n, x, y) {
    const d = n.d;
    if (d.item) {
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x + 4, y + 12, 8, 3);
      drawBallIcon(x + 1, y + 1, 'bolsibola', 2);
      return;
    }
    if (d.starter) { drawBallIcon(x + 1, y + 2, 'bolsibola', 2); return; }
    if (d.legend) {
      const img = Art.front(d.legend.sp, 40);
      const bob = Math.round(Math.sin(Game.time * 3) * 1.5);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 8, y + 14, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(img, x - 12, y - 22 + bob);
      return;
    }
    let f = 0;
    if (n.moving) f = n.t > 0.25 && n.t < 0.8 ? ((n.x + n.y) % 2) + 1 : 0;
    People.draw(ctx, n.look || 'man', n.dir, f, x, y);
  },
};
function pickEncounter(table) {
  const tot = table.reduce((s, e) => s + e[3], 0);
  let r = Math.random() * tot;
  for (const e of table) { r -= e[3]; if (r <= 0) return [e[0], rnd.int(e[1], e[2])]; }
  const e = table[table.length - 1];
  return [e[0], rnd.int(e[1], e[2])];
}
// ---- Utilidades de recompensa ----
async function giveItem(id, qty = 1, found) {
  addItem(id, qty);
  const it2 = ITEMS[id];
  Sound.jingle('item');
  await say((found ? '¡' + G.name + ' encontró ' : '¡' + G.name + ' recibió ') + (qty > 1 ? qty + ' x ' : '') + it2.name.toUpperCase() + '!');
  if (it2.pocket === 'mt') await say('Guardaste ' + it2.name.toUpperCase() + ' en el bolsillo de MT.');
}
async function giveMon(sp2, lvl, o = {}) {
  const m = makeMon(sp2, lvl, o);
  m.ot = o.ot || G.name;
  const where = addToParty(m);
  Sound.jingle('catch');
  await say('¡' + G.name + ' recibió a ' + monName(m) + '!');
  if (where === 'box') await say(monName(m) + ' ha sido enviado a la CAJA del PC.');
  return m;
}
async function giveBadge(i, mt) {
  G.badges[i] = true;
  await Sound.jingle('badge');
  await say('¡' + G.name + ' recibió la ' + GYMS[i].badge.toUpperCase() + '!');
  if (mt) await giveItem(mt);
  saveGame(true);
}

<script>
'use strict';
// ============================================================
//  Escenas: título, introducción, evolución, intercambio, Salón de la Fama

function drawLogo(x, y, size, text, fill = '#f8d030', edge = '#284890') {
  for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [-2, -2], [2, 2], [-2, 2], [2, -2], [0, 4], [2, 4], [-2, 4]]) txt(text, x + dx, y + dy, edge, size, 'center');
  txt(text, x, y, fill, size, 'center');
  ctx.save(); ctx.beginPath(); ctx.rect(0, y, W, size * 0.45); ctx.clip(); txt(text, x, y, '#fff4a8', size, 'center'); ctx.restore();
}

// ---------------- Título ----------------
// Composición: logo arriba, criatura (SPR x2) + protagonista (x4) sobre las colinas, franja inferior con créditos
const TITLE_LAYOUT = {
  hill: x => 197 + Math.sin(x / 37.5) * 10,   // línea de las colinas
  band: H - 18,                               // franja oscura inferior
  monX: W / 2 - 84, monY: 98,                 // criatura de 100x100 (pies sobre la colina)
  plX: W / 2 + 20, plY: 116,                  // protagonista de 64x80
  menuCY: 136,                                // centro vertical del menú de título
};
class TitleScene {
  constructor() {
    this.opaque = true; this.t = 0; this.mon = rnd.pick(DEX); this.monT = 0; this.stage = 0; this.busy = false;
    this.stars = Array.from({ length: 60 }, () => [rnd.int(0, W), rnd.int(0, 160), rnd.float(0.3, 1)]);
  }
  update(dt) {
    this.t += dt; this.monT += dt;
    if (this.monT > 3.2) { this.monT = 0; this.mon = rnd.pick(DEX); }
    if (this.busy) return;
    if (Input.p('a') || Input.p('start')) { Sound.unlock(); Sound.sfx('blip'); this.busy = true; titleMenu(this).finally(() => { this.busy = false; }); }
  }
  draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#101838'); g.addColorStop(0.6, '#283c78'); g.addColorStop(1, '#58a048');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const [x, y, b] of this.stars) { ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(this.t * b * 2 + x))})`; ctx.fillRect(x, y, 1, 1); }
    // colinas
    ctx.fillStyle = '#3c8040';
    ctx.beginPath(); ctx.moveTo(0, TITLE_LAYOUT.hill(0)); for (let x = 0; x <= W; x += 8) ctx.lineTo(x, TITLE_LAYOUT.hill(x)); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = '#2e6a34'; ctx.fillRect(0, TITLE_LAYOUT.band, W, H - TITLE_LAYOUT.band);
    drawLogo(W / 2, 24, 32, 'POLEMON');
    txt('EDICIÓN AVENTURA', W / 2, 68, '#f0f0ff', 8, 'center');
    // criatura que entra
    const S2 = SPR * 2;
    const k = Math.min(1, this.monT / 0.5), out = Math.max(0, (this.monT - 2.8) / 0.4);
    const x = lerp(-S2 - 10, TITLE_LAYOUT.monX, easeOut(k)) + out * (W - TITLE_LAYOUT.monX + 10);
    ctx.drawImage(Art.front(this.mon, SPR), Math.round(x), TITLE_LAYOUT.monY, S2, S2);
    ctx.drawImage(People.get('player', 'down', 0), TITLE_LAYOUT.plX, TITLE_LAYOUT.plY, 64, 80);
    if (!this.busy && Math.floor(this.t * 2) % 2 === 0) txt(document.body.classList.contains('touch') ? 'TOCA  A  PARA EMPEZAR' : 'PULSA  Z / ENTER', W / 2, TITLE_LAYOUT.band - 14, '#ffffff', 8, 'center');
    const fy = TITLE_LAYOUT.band + 6;
    txt('Fan-juego no oficial', 6, fy, '#a8c8a0', 6);
    txt('M: silenciar', W - 6, fy, '#a8c8a0', 6, 'right');
  }
}

// ---------------- Introducción ----------------
function askName(label, def) {
  return new Promise(res => {
    const form = document.getElementById('name-entry'), input = document.getElementById('name-input');
    document.getElementById('name-label').textContent = label;
    input.value = def;
    form.hidden = false;
    setTimeout(() => { try { input.focus(); input.select(); } catch (e) {} }, 50);
    const submit = e => {
      e.preventDefault();
      form.removeEventListener('submit', submit);
      form.hidden = true;
      let v = input.value.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑÜ0-9 ]/g, '').trim().slice(0, 8);
      if (!v) v = def;
      Input.releaseAll(); Input.consume();
      try { canvas.focus(); } catch (e2) {}
      res(v);
    };
    form.addEventListener('submit', submit);
  });
}

// Sprite grande (SPR x2) centrado en el área que queda sobre la caja de texto
const SCENE_MON_Y = Math.round((H - 48 - SPR * 2) / 2);
async function evolveUI(m, to, fromField) {
  const from = m.sp, nm = monName(m);
  const prev = Sound.current;
  if (fromField) await Fade.out(250);
  const sc = { opaque: true, sp: from, mode: 'normal', phase: 0, t: 0, white: 0,
    draw() {
      ctx.fillStyle = '#101020'; ctx.fillRect(0, 0, W, H);
      const t = Game.time;
      for (let i = 0; i < 32; i++) { ctx.fillStyle = `rgba(120,160,255,${0.15 + 0.15 * Math.sin(t * 3 + i)})`; ctx.fillRect((i * 37 + t * 40) % W, (i * 23) % (H - 52), 2, 2); }
      const img = this.mode === 'sil' ? Art.silhouette(this.sp, SPR) : Art.front(this.sp, SPR);
      ctx.drawImage(img, W / 2 - SPR, SCENE_MON_Y, SPR * 2, SPR * 2);
      if (this.white > 0) { ctx.fillStyle = `rgba(255,255,255,${this.white})`; ctx.fillRect(0, 0, W, H); }
      drawBox(0, H - 48, W, 48, 'dark');
    } };
  Scenes.push(sc);
  await Fade.in(300);
  Sound.music('evolve');
  await say('¿Qué? ¡' + nm + ' está evolucionando!', { style: 'dark' });
  sc.mode = 'sil';
  let cancelled = false;
  const total = 3600; let el = 0, swap = 420, acc = 0;
  await new Promise(res => {
    Tasks.add({ step(d) {
      el += d; acc += d;
      if (Input.p('b')) { cancelled = true; res(); return true; }
      if (acc >= swap) { acc = 0; sc.sp = sc.sp === from ? to : from; swap = Math.max(60, swap * 0.86); }
      if (el >= total) { res(); return true; }
      return false;
    } });
  });
  if (cancelled) {
    sc.sp = from; sc.mode = 'normal';
    Sound.music(prev);
    await say('¿Eh? ¡' + nm + ' no ha evolucionado!', { style: 'dark' });
  } else {
    await tween(300, t => { sc.white = t; });
    sc.sp = to; sc.mode = 'normal';
    await tween(400, t => { sc.white = 1 - t; });
    Sound.cry(to);
    await Sound.jingle('evodone');
    await say('¡Enhorabuena! ¡Tu ' + nm + ' ha evolucionado en ' + SPECIES[to].name + '!', { style: 'dark' });
    evolveRaw(m, to);
    for (const mv of learnAt(to, m.lvl)) await learnMoveUI(m, mv, { style: 'dark' });
  }
  await Fade.out(300);
  Scenes.remove(sc);
  if (prev) Sound.music(prev);
  if (fromField) await Fade.in(300);
  return !cancelled;
}

    const rs = RIVAL_STARTER[id];
    G.flags['S:' + rs] = true;
    await say('{R}: ¡Pues yo me quedo con este!|¡{R} recibió a ' + spOf(rs).name.toUpperCase() + '!');
  },
  async labRivalBattle(tr) {
    if (!G.flags.starter || G.flags.rivalLab) return;
    const n = OW.findNpc('rival_lab');
    if (n) { OW.facePlayer(n); OW.p.dir = 'up'; }
    Sound.music('trainer');
    await say('{R}: ¡Espera, {P}! ¡Vamos a ver qué tal son nuestros Polemon!|¡Venga, luchemos!');
    const r = await OW.battle({ trainer: rivalTrainer(0, { lose: '¡¿Qué?! ¡Ha elegido mal mi Polemon!', canLose: true }), enemyParty: rivalTeam(0).map(([s, l]) => makeMon(s, l)), canLose: true });
    G.flags.rivalLab = true;
    healParty();
    await say(r === 'win' ? '{R}: Vale, vale, has ganado. ¡Pero me haré más fuerte! ¡Hasta luego, perdedor!' : '{R}: ¡Ja! ¡Soy el mejor! ¡Hasta luego, perdedor!');
    await say('PROF. ROBLE: {P}, espera. Toma esto: es la POLEDEX.|Registra automáticamente los Polemon que ves y atrapas. ¡Mi sueño es completarla!');
    G.flags.dex = true; addItem('bolsidex'); Sound.jingle('item');
    await say('¡' + G.name + ' recibió la POLEDEX!');
    await giveItem('bolsibola', 5);
    await say('PROF. ROBLE: Con las POLEBOLAS puedes atrapar Polemon salvajes. ¡Debilítalos primero!|Ve al norte, a CIUDAD VERDIA. ¡Tu aventura comienza ahora!');
  },
  async pocionGratis(n) {
    if (!G.flags.pocionGratis) {
      await say('¡Hola! Trabajo en la TIENDA POLEMON de CIUDAD VERDIA. ¡Toma una muestra gratis!');
      G.flags.pocionGratis = true; await giveItem('pocion');
    } else await say('¡Visita la TIENDA POLEMON de CIUDAD VERDIA! Tenemos de todo.');
  },
  // ---------- Centros, tiendas, PC ----------
  async nurse(n) {
    await say('¡Hola! Bienvenido al CENTRO POLEMON.');
    if (!(await yesNo('Curamos a tus Polemon para que vuelvan a estar en plena forma. ¿Quieres que los cure?'))) { await say('¡Vuelve cuando quieras!'); return; }
    await say('Muy bien, déjame tus Polemon un momento...');
    healParty();
    await Sound.jingle('heal');
    G.lastHeal = { map: OW.map.id, x: OW.p.x, y: OW.p.y };
    saveGame(true);
    await say('¡Gracias por esperar! Tus Polemon están en plena forma.|¡Esperamos volver a verte!');
  },
  async shop(n) { await shopMenu(n.d.stock); },
  async tradeIdaVuelta(n) {
    await say('¡Hola! Me encantan los intercambios.|Si quieres, te cambio un Polemon y te lo devuelvo enseguida. Dicen que algunos EVOLUCIONAN al intercambiarlos...');
    if (!(await yesNo('¿Hacemos un intercambio de ida y vuelta?'))) { await say('¡Cuando quieras!'); return; }
    const i = await partyMenu({ mode: 'select', msg: '¿Qué Polemon quieres intercambiar?', filter: m => evoTarget(m, 'trade') ? true : 'NORMAL' });
    if (i < 0) return;
    const m = G.party[i];
    await tradeUI(m, m);
    const to = evoTarget(m, 'trade');
    if (to) await evolveUI(m, to, true);
    else await say('¡Aquí tienes a ' + monName(m) + ', sano y salvo!');
  },
  async tradeOnline(n) {
    await say('¡Hola! Hago INTERCAMBIOS SORPRESA con entrenadores de todo el mundo.|Tú me das un Polemon y recibes otro al azar, ¡de nivel parecido!');
    if (G.party.length < 2) { await say('Necesitas al menos dos Polemon en el equipo.'); return; }
    if (!(await yesNo('¿Quieres hacer un intercambio sorpresa?'))) { await say('¡Cuando quieras!'); return; }
    const i = await partyMenu({ mode: 'select', msg: '¿Qué Polemon vas a enviar?' });
    if (i < 0) return;
    const give = G.party[i];
    const pool = DEX.filter(id => SPECIES[id].cr > 3 && id !== 'miu');
    const lvl = clamp(give.lvl + rnd.int(-2, 2), 2, 100);
    let pick = rnd.pick(pool);
    for (let k = 0; k < 20; k++) { const c = rnd.pick(pool); if (!SPECIES[c].evo.some(e => e.lvl && e.lvl <= lvl)) { pick = c; break; } }
    const names = ['ALEX', 'MAR', 'TAO', 'NOA', 'IKER', 'LUA', 'ZOE', 'KAI', 'LEO', 'ANA'];
    const got = makeMon(pick, lvl, { ot: rnd.pick(names), ivMin: 5 });
    await tradeUI(give, got, true);
    G.party[i] = got; registerCaught(got.sp);
    const to = evoTarget(got, 'trade');
    if (to) await evolveUI(got, to, true);
  },
  async vendeMagicarpa(n) {
    if (G.flags.magicarpa) { await say('Un trato es un trato. ¡No devuelvo el dinero!'); return; }
    if (!(await yesNo('Oye, chaval... ¿Quieres un MAGICARPA? ¡Es un Polemon increíble! Solo $500.'))) { await say('Tú te lo pierdes.'); return; }
    if (G.money < 500) { await say('¡No tienes dinero suficiente!'); return; }
    G.money -= 500; G.flags.magicarpa = true; Sound.sfx('money');
    await giveMon('magicarpa', 5);
    await say('¡Ja! ¡Gracias por el dinero! Ejem... digo, ¡cuídalo mucho!');
  },
  async practica(n) {
    const gy = GYMS[n.d.gym];
    await say('¡Hola! Soy el entrenador de práctica de este gimnasio. ¡Aquí puedes ENTRENAR!');
    const c = await ask('Mis Polemon de tipo ' + TYPES[gy.type].name.toUpperCase() + ' se adaptan a tu nivel. ¿Qué quieres?', ['ENTRENAR', 'CURAR', 'NADA']);
    if (c === 1) { healParty(); await Sound.jingle('heal'); await say('¡Tus Polemon están recuperados!'); return; }
    if (c !== 0) { await say('¡Vuelve cuando quieras entrenar!'); return; }
    const team = parseTeam(PRACTICE[gy.type]);
    const base = Math.max(5, maxPartyLevel() - 1);
    const party = team.map(([s, l]) => makeMon(s, clamp(base + l, 3, 100), { ivMin: 8 }));
    const tr = T('practica', 'de práctica', team, { title: 'Entrenador de práctica', look: 'guay', money: 14, lose: '¡Buen entrenamiento! Vuelve cuando quieras.' });
    await OW.battle({ trainer: tr, enemyParty: party, canLose: true });
  },
  // ---------- Rivales ----------
  async rival22(tr) {
    if (!G.flags.starter || G.flags.rival22) return;
    G.flags.rival22 = true;
    const n = await rivalAppears('{R}: ¡Eh, {P}! ¿Vas a la LIGA? ¡Sin medallas no te dejarán pasar!|Yo ya he atrapado otro Polemon. ¡Vamos a ver quién ha entrenado más!');
    await OW.battle({ trainer: rivalTrainer(1, { lose: '¡Bah! ¡Ha sido suerte!' }), enemyParty: rivalTeam(1).map(([s, l]) => makeMon(s, l)) });
    await say('{R}: Me voy a CIUDAD PLATERIA, al norte. ¡Allí está el primer gimnasio! ¡Nos vemos!');
    await rivalLeaves(n);
  },
  async rival24(tr) {
    if (!G.flags.starter || G.flags.rival24) return;
    G.flags.rival24 = true;
    const n = await rivalAppears('{R}: ¡Hola, {P}! ¿Todavía por aquí? Yo ya he cruzado el PUENTE PEPITA.|Mi equipo ha crecido mucho. ¡Te lo demostraré!');
    await OW.battle({ trainer: rivalTrainer(2, { lose: '¡Grrr! ¡Otra vez!' }), enemyParty: rivalTeam(2).map(([s, l]) => makeMon(s, l, { ivMin: 10 })) });
    await say('{R}: BILO, el que vive al final de la RUTA 25, me dio un montón de cosas. ¡Ve a verle!');
    await rivalLeaves(n);
  },
  async rivalTorre(tr) {
    if (!G.flags.starter || G.flags.rivalTorre) return;
    G.flags.rivalTorre = true;
    const n = await rivalAppears('{R}: ¡{P}! ¿Qué haces en este sitio tan tétrico?|¿Has venido a por los Polemon fantasma? ¡Pues antes tendrás que ganarme!');
    await OW.battle({ trainer: rivalTrainer(3, { lose: '¡¿Cómo?! ¡Mi equipo es el mejor!' }), enemyParty: rivalTeam(3).map(([s, l]) => makeMon(s, l, { ivMin: 12 })) });
    await say('{R}: Bah. Me voy a entrenar a la LIGA. ¡Algún día te ganaré para siempre!');
    await rivalLeaves(n);
  },
  async campeon(n) {
    await say('{R}: ¡{P}! ¡Por fin has llegado!|Mientras tú dabas vueltas, yo vencí al ALTO MANDO y me hice CAMPEÓN.|¡Soy el entrenador más fuerte del mundo! ¡Y te lo voy a demostrar!');
    const r = await OW.battle({ trainer: rivalTrainer(4, { title: 'Campeón ' + G.rival, boss: true, money: 100, lose: '¡No puede ser! ¡He perdido el título!' }), enemyParty: rivalTeam(4).map(([s, l]) => makeMon(s, l, { ivMin: 22 })) });
    if (r !== 'win') return;
    await say('{R}: ...¿Por qué? Lo hice todo bien... Entrené a mis Polemon...|...Supongo que tú los quieres más que yo. Enhorabuena, {P}.');
    await say('PROF. ROBLE: ¡{P}! ¡Lo has conseguido! ¡Eres el nuevo CAMPEÓN de la LIGA POLEMON!|Acompáñame, vamos a registraros en el SALÓN DE LA FAMA.');
    const first = !G.flags.campeon;
    G.flags.campeon = true;
    if (first) addItem('pase');
    for (const e of ELITE) delete G.flags['E_' + e.id];
    await hallOfFame();
    healParty();
    OW.load('casa_jugador', 4, 5, 'down');
    G.lastHeal = { map: 'casa_jugador', x: 4, y: 5 };
    saveGame(true);
    await Fade.in(600);
    await say('Ha pasado una noche desde tu victoria en la LIGA...|Tu aventura continúa: completa la POLEDEX y busca a los Polemon legendarios.');
  },
  async resetElite() { for (const e of ELITE) delete G.flags['E_' + e.id]; },
  // ---------- Regalos ----------
  async regaloBulbasor(n) {
    if (G.flags.regaloBulbasor) { await say('¡Cuida bien de BULBASOR! Le encanta el sol.'); return; }
    if (G.starter === 'bulbasor') { await say('¡Qué BULBASOR tan bonito tienes! Yo cuidaba a uno, pero ya se ha ido con otro entrenador.'); return; }
    await say('Encontré a este BULBASOR herido y lo cuidé hasta que se recuperó.|Pero necesita un entrenador de verdad... ¿Quieres llevártelo?');
    if (!(await yesNo('¿Aceptas a BULBASOR?'))) { await say('Vaya... piénsalo, por favor.'); return; }
    G.flags.regaloBulbasor = true; await giveMon('bulbasor', 12, { ivMin: 15 });
  },
  async regaloSquirtel(n) {
    if (G.flags.regaloSquirtel) { await say('El EQUIPO SOMBRA ya no molesta en la ciudad. ¡Buen trabajo!'); return; }
    if (G.starter === 'squirtel' || badgeCount() < 2) { await say('Soy el agente de policía de PUERTO CARMESÍ.|Necesitamos entrenadores fuertes. ¡Vuelve cuando tengas más medallas!'); return; }
    await say('¡Hola! Soy el agente de PUERTO CARMESÍ. Este SQUIRTEL fue abandonado y busca un entrenador.|Con tus medallas, sé que lo cuidarás. ¡Llévatelo!');
    G.flags.regaloSquirtel = true; await giveMon('squirtel', 16, { ivMin: 15 });
  },
  async regaloLaprax(n) {
    if (G.flags.regaloLaprax) { await say('Cuida bien de LAPRAX. Es una especie muy rara.'); return; }
    await say('Soy el PRESIDENTE de SILFO S.A. Nuestros científicos rescataron a este LAPRAX en el mar.|Necesita un entrenador fuerte. ¡Te lo confío!');
    G.flags.regaloLaprax = true; await giveMon('laprax', 25, { ivMin: 15 });
  },
  async regaloIvee(n) {
    if (G.flags.regaloIvee) { await say('IVEE puede evolucionar de muchas formas con las piedras del CENTRO COMERCIAL. ¡Qué emocionante!'); return; }
    await say('¡Hola, querido! En esta mansión tengo muchísimos Polemon.|Este IVEE es encantador, pero creo que contigo sería más feliz. ¡Llévatelo!');
    G.flags.regaloIvee = true; await giveMon('ivee', 20, { ivMin: 15 });
  },
  async canaVieja(n) {
    if (G.flags.canaVieja) { await say('¡Pescar es la mejor manera de pasar el tiempo! ¿Has pescado algo?'); return; }
    await say('¡Soy el GURÚ DE LA PESCA! ¿Te gusta pescar? ¡Claro que sí! ¡Toma esta CAÑA VIEJA!');
    G.flags.canaVieja = true; await giveItem('canaVieja');
    await say('Ponte frente al agua y pulsa A. ¡A ver qué pescas!');
  },
  async canaBuena(n) {
    if (G.flags.canaBuena) { await say('¡Con esa caña pescarás Polemon mucho mejores!'); return; }
    await say('Soy hermano del GURÚ DE LA PESCA de PUERTO CARMESÍ. ¿Te gusta pescar?|¡Toma esta CAÑA BUENA! Con ella pescarás Polemon más interesantes.');
    G.flags.canaBuena = true; await giveItem('canaBuena');
  },
  async bilo(n) {
    if (!G.flags.bilo) {
      await say('BILO: ¡Hola! Soy BILO, investigador de Polemon y experto en intercambios.|¡Qué bien que alguien me visite! Toma, esta SUPERCAÑA no la uso nunca.');
      G.flags.bilo = true; await giveItem('superCana');
      return;
    }
    if (!G.flags.regaloCharmandro && G.starter !== 'charmandro') {
      await say('BILO: Un amigo me dejó este CHARMANDRO antes de irse de viaje. Le vendría bien un entrenador.');
      if (await yesNo('¿Quieres cuidar de CHARMANDRO?')) { G.flags.regaloCharmandro = true; await giveMon('charmandro', 18, { ivMin: 15 }); }
      return;
    }
    await say('BILO: Mi compañera hace INTERCAMBIOS SORPRESA con gente de todo el mundo. ¡Prueba!|Y recuerda: algunos Polemon solo evolucionan al cambiar de entrenador.');
  },
  async srFuyi(n) {
    if (!G.flags.fuyi) {
      await say('SR. FUYI: Cuido de los Polemon que se quedan solos. Te veo cansado...|Déjame curar a tu equipo. Y toma esto, lo encontré en la torre.');
      healParty(); await Sound.jingle('heal');
      G.flags.fuyi = true; await giveItem('carameloRaro');
      return;
    }
    healParty(); await Sound.jingle('heal');
    await say('SR. FUYI: Tus Polemon ya están descansados. Trátalos siempre con cariño.');
  },
  // ---------- Intercambios ----------
  async tradeNidoran(n) { await npcTrade('pidgi', 'vulpiz', 10, 'COLITAS', 'trade1', 'MARTA'); },
  async tradeCelestia(n) { await npcTrade('jigglipuf', 'machop', 15, 'MUSCULIN', 'trade2', 'PACO'); },
  async tradeAzafrana(n) { await npcTrade('kadabra', 'haunterr', 30, 'SOMBRITA', 'trade3', 'SOL'); },
  async tradeAzulina(n) { await npcTrade('growlith', 'raltz', 20, 'BRISA', 'trade4', 'TOMÁS'); },
  async tradeFucsina(n) { await npcTrade('raticato', 'larvitar', 25, 'PEDRUSCO', 'trade5', 'LUZ'); },
  async tradeSorpresa(n) { await SCRIPTS.tradeOnline(n); },
};
</script>
<script>
'use strict';
// ============================================================
//  Arranque, guardado y carga
// ============================================================
let G = null;
const SAVE_KEY = 'polemon_save_v1';
const OLD_SAVE_KEY = 'bolsimon_save_v1'; // nombre anterior del juego
function savedRaw() { return Store.get(SAVE_KEY) || Store.get(OLD_SAVE_KEY); }

function serialize() {
  if (OW.map) { G.map = OW.map.id; G.x = OW.p.x; G.y = OW.p.y; G.dir = OW.p.dir; }
  return JSON.stringify(G);
}
function saveGame(silent) {
  if (!G || !G.started) return false;
  return Store.set(SAVE_KEY, serialize());
}
function validState(s) {
  return s && typeof s === 'object' && Array.isArray(s.party) && s.map && MAPS[s.map] && s.dex && s.bag;
}
function applyState(s) {
  const def = newGameState(s.name || 'ROJO', s.rival || 'GARI');
  G = Object.assign(def, s);
  G.opts = Object.assign(def.opts, s.opts || {});
  for (const m of G.party.concat(G.box)) { m.moves = m.moves.filter(x => MOVES[x.id]); if (!SPECIES[m.sp]) m.sp = 'ratata'; calcStats(m); m.hp = Math.min(m.hp, m.maxhp); }
  G.party = G.party.filter(m => SPECIES[m.sp]);
  if (!MAPS[G.map]) { G.map = 'casa_jugador'; G.x = 4; G.y = 5; }
  if (!G.lastHeal || !MAPS[G.lastHeal.map]) G.lastHeal = { map: 'casa_jugador', x: 4, y: 5 };
  Sound.setMusic(G.opts.music);
  return true;
}
function loadGame() {
  try {
    const raw = savedRaw();
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!validState(s)) return false;
    return applyState(s);
  } catch (e) { console.error(e); return false; }
}

// ---- Ayudas de depuración (consola: POLE.*) ----
const POLE = {
  give(spId, lvl = 50) { const m = makeMon(spId, lvl); addToParty(m); return m; },
  tp(map, x, y) { OW.load(map, x, y, 'down'); },
  badges(n = 8) { for (let i = 0; i < n; i++) G.badges[i] = true; },
  money(n = 99999) { G.money = n; },
  item(id, n = 10) { addItem(id, n); },
  heal() { healParty(); },
  flag(k, v = true) { G.flags[k] = v; },
};

async function boot() {
  resize();
  setupTouch();
  OW.init();
  await fontReady;
  buildAll();
  resize();
  const hot = window.claude && window.claude.hot;
  const start = data => {
    if (data && data.save) {
      try { const s = JSON.parse(data.save); if (validState(s)) { applyState(s); enterWorld(); Game.start(); return; } } catch (e) { /* sin estado previo */ }
    }
    Scenes.push(new TitleScene());
    Sound.music('title');
    Game.start();
  };
  if (hot && hot.snapshot) { try { hot.snapshot(() => (G && G.started ? { save: serialize() } : {})); } catch (e) { /* opcional */ } }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
}
boot();
</script>
