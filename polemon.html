    this.parts = this.parts.filter(p => p.life > 0);
    if (this.shakeT > 0) this.shakeT -= dt;
    if (this.flashT > 0) this.flashT -= dt;
  }
  update(dt) { this.tick(dt); }

  // ---------- dibujo ----------
  drawBg() {
    const pal = {
      grass: ['#f8f8e8', '#d8f0c8', '#a8d888', '#78b860', '#58a048'],
      forest: ['#d8e8c8', '#a8c890', '#78a868', '#588848', '#406838'],
      cave: ['#685848', '#806850', '#a08868', '#887050', '#685038'],
      ice: ['#e8f4fc', '#c8e4f4', '#a8d0e8', '#88b8d8', '#6898c0'],
      water: ['#e8f4fc', '#b8e0f8', '#78b8e8', '#5898d8', '#3878c0'],
      indoor: ['#f0e8d8', '#e0d0b8', '#c8b090', '#a89070', '#887050'],
      gym: ['#f0f0f0', '#d8d8e0', '#b8b8c8', '#9898a8', '#787888'],
      tower: ['#584870', '#685880', '#786890', '#584870', '#403058'],
    }[this.bg] || ['#f8f8e8', '#d8f0c8', '#a8d888', '#78b860', '#58a048'];
    const F = BTL.F;
    const g = ctx.createLinearGradient(0, 0, 0, F);
    g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[1]); g.addColorStop(1, pal[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, F);
    ctx.fillStyle = pal[2];
    for (let i = 0; i < 6; i++) ctx.fillRect(0, Math.round(F * 0.39 + i * F * 0.09), W, 1);
    // plataformas
    const plat = (cx, cy, rx, ry) => {
      ctx.fillStyle = pal[4]; ctx.beginPath(); ctx.ellipse(cx, cy + 2, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pal[3]; ctx.beginPath(); ctx.ellipse(cx, cy, rx - 2, ry - 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lighten(pal[3], 0.2); ctx.beginPath(); ctx.ellipse(cx - 8, cy - 2, rx - 20, ry - 6, 0, 0, Math.PI * 2); ctx.fill();
    };
    plat(...BTL.e.plat);
    plat(...BTL.p.plat);
  }
  drawMon(st, spId, back, cx, bottom) {
    if (!st.vis || !spId) return;
    const cv = back ? Art.back(spId, SPR) : Art.front(spId, SPR);
    const s = 2 * st.scale;
    const w = SPR * s, h = SPR * s;
    const x = Math.round(cx - w / 2 + st.x), y = Math.round(bottom - 0.97 * h + st.y);
    if (st.flash) return;
    ctx.globalAlpha = st.alpha;
    ctx.drawImage(cv, x, y, w, h);
    if (st.white > 0) { ctx.globalAlpha = st.white * st.alpha; ctx.drawImage(Art.silhouette(spId, SPR), x, y, w, h); }
    ctx.globalAlpha = 1;
  }
  // Recuadro de estado. full = el del jugador (con PS numéricos y barra de experiencia)
  drawHud(side, box, full) {
    const m = side.mon;
    if (!m) return;
    const { x, y, w, h } = box;
    drawBox(x, y, w, h, 'hud');
    txt(monName(m), x + 9, y + 8, '#363644', 7);
    txt('Nv' + m.lvl, x + w - 9, y + 8, '#363644', 7, 'right');
    const hp = Math.max(0, Math.round(side.dispHp));
    if (m.status) drawStatusTag(m.status, x + 8, y + 20); else txt('PS', x + 19, y + 21, '#c09030', 6, 'center');
    const bx = x + 34, bw = (full ? x + w - 9 : x + w - 21) - bx;
    drawHPBar(bx, y + 22, bw, side.dispHp / m.maxhp);
    if (!full && this.wild && G.dex.caught[m.sp]) drawBallIcon(x + w - 16, y + 21, 'bolsibola');
    if (full) {
      txt(hp + '/' + m.maxhp, x + w - 9, y + 31, '#363644', 7, 'right');
      const need = expAt(m.lvl + 1) - expAt(m.lvl);
      const have = (side.dispExp != null ? side.dispExp : m.exp) - expAt(m.lvl);
      const ey = y + h - 10;
      txt('EXP', x + 19, ey - 1, '#c09030', 6, 'center');
      ctx.fillStyle = '#383840'; ctx.fillRect(bx - 1, ey, bw + 2, 4);
      ctx.fillStyle = '#505058'; ctx.fillRect(bx, ey + 1, bw, 2);
      ctx.fillStyle = '#48a0f0'; ctx.fillRect(bx, ey + 1, Math.floor(bw * clamp(have / need, 0, 1)), 2);
    }
  }
  draw() {
    const L = BTL;
    ctx.save();
    if (this.shakeT > 0) ctx.translate(rnd.int(-3, 3), rnd.int(-2, 2));
    this.drawBg();
    if (this.tSprite) {
      const img = People.get(this.tSprite.look, 'down', 0);
      ctx.drawImage(img, Math.round(L.trainer.x + this.tSprite.x), L.trainer.y, L.PW, L.PH);
    }
    this.drawMon(this.es, this.e.mon && this.e.mon.sp, false, L.e.cx, L.e.bottom);
    if (this.pSprite) {
      const img = People.get('player', 'up', 0);
      ctx.drawImage(img, Math.round(L.player.x + this.pSprite.x), L.player.y, L.PW, L.PH);
    }
    this.drawMon(this.ps, this.p.mon && this.p.mon.sp, true, L.p.cx, L.p.bottom);
    if (this.ball) drawBallIcon(Math.round(this.ball.x - 7 + (this.ball.wob || 0)), Math.round(this.ball.y - 7), this.ball.kind, 2);
    for (const p of this.parts) {
      if (p.delay > 0) continue;
      ctx.fillStyle = p.c; ctx.strokeStyle = p.c;
      if (p.shape === 'ring') { const t = 1 - p.life / p.max; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(p.x, p.y, 10 + t * 38, 6 + t * 22, 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (p.shape === 'ring2') { ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.stroke(); }
      else if (p.shape === 'bolt') { ctx.lineWidth = 2; ctx.beginPath(); let x = p.x, y = p.y; ctx.moveTo(x, y); for (let i = 0; i < 5; i++) { x += rnd.float(-10, 10); y += p.len / 5; ctx.lineTo(x, y); } ctx.stroke(); }
      else if (p.shape === 'line') { ctx.fillRect(p.x, p.y, 18, 1); }
      else if (p.shape === 'leaf') { ctx.fillRect(p.x - 1, p.y, 3, 1); ctx.fillRect(p.x, p.y - 1, 1, 3); }
      else if (p.shape === 'shard') { ctx.fillRect(p.x, p.y, 1, p.s + 2); ctx.fillRect(p.x - 1, p.y + 1, 3, 1); }
      else if (p.shape === 'arrow') { const d = p.up ? -1 : 1; ctx.fillRect(p.x, p.y, 2, 6); ctx.fillRect(p.x - 2, p.y + (d < 0 ? 0 : 4), 6, 2); }
      else if (p.shape === 'star') { ctx.fillRect(p.x - 2, p.y, 5, 1); ctx.fillRect(p.x, p.y - 2, 1, 5); }
      else ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s || 2, p.s || 2);
    }
    if (this.flashT > 0) { ctx.fillStyle = 'rgba(255,255,240,.5)'; ctx.fillRect(0, 0, W, L.F); }
    ctx.restore();
    if (this.hudVis.e) this.drawHud(this.e, L.e.hud, false);
    if (this.hudVis.p) this.drawHud(this.p, L.p.hud, true);
    drawBox(0, H - 48, W, 48, 'dark');
  }

  // ---------- secuencias ----------
  async sendOut(side, first) {
    const st = side === this.p ? this.ps : this.es;
    const m = side.mon;
    if (side === this.e) registerSeen(m.sp);
    side.dispHp = m.hp;
    if (side === this.p) { side.dispExp = m.exp; this.participants.add(side.idx); }
    st.vis = true; st.scale = 0.1; st.white = 1; st.alpha = 1; st.x = 0; st.y = 0;
    Sound.sfx('poof');
    await tween(260, t => { st.scale = 0.1 + 0.9 * t; st.white = 1 - t; }, easeOut);
    st.scale = 1; st.white = 0;
    Sound.cry(m.sp);
    this.hudVis[side.name] = true;
    await wait(250);
  }
  async retract(side) {
    const st = side === this.p ? this.ps : this.es;
    st.white = 0;
    await tween(220, t => { st.scale = 1 - 0.9 * t; st.white = t; });
    st.vis = false; st.scale = 1; st.white = 0;
    this.hudVis[side.name] = false;
  }
  async intro() {
    const legend = this.o.legend;
    Sound.music(this.o.music || (legend ? 'legend' : this.trainer ? (this.trainer.boss ? 'boss' : 'trainer') : 'battle'));
    // desplazamientos de entrada/salida: siempre desde/hasta fuera de la pantalla
    const pIn = W - BTL.player.x, pOut = -(BTL.player.x + BTL.PW + 8);
    this.pSprite = { x: pIn };
    if (this.wild) {
      const eIn = -(BTL.e.cx + SPR + 35);
      this.es.vis = true; this.es.x = eIn; this.e.dispHp = this.e.mon.hp;
      registerSeen(this.e.mon.sp);
      await Fade.in(200);
      await tween(700, t => { this.es.x = eIn * (1 - t); this.pSprite.x = pIn * (1 - t); }, easeOut);
      Sound.cry(this.e.mon.sp);
      this.hudVis.e = true;
      await this.msg(legend ? '¡' + monName(this.e.mon) + ' te ataca!' : '¡Un ' + monName(this.e.mon) + ' salvaje apareció!', 1100);
    } else {
      const tIn = -(BTL.trainer.x + BTL.PW + 8), tOut = W - BTL.trainer.x + 8;
      this.tSprite = { look: this.trainer.look || 'joven', x: tIn };
      await Fade.in(200);
      await tween(700, t => { this.tSprite.x = tIn * (1 - t); this.pSprite.x = pIn * (1 - t); }, easeOut);
      await this.msg('¡' + this.trainer.title + ' quiere luchar!', 1100);
      await tween(350, t => { this.tSprite.x = tOut * t; });
      this.tSprite = null;
      await this.msg('¡' + this.trainer.title + ' sacó a ' + monName(this.e.mon) + '!', 600);
      await this.sendOut(this.e, true);
    }
    await tween(300, t => { this.pSprite.x = pOut * t; });
    this.pSprite = null;
    await this.msg('¡Adelante, ' + monName(this.p.mon) + '!', 500);
    await this.sendOut(this.p, true);
  }

  // ---------- elección del jugador ----------
  async chooseAction() {
    for (;;) {
      const mw = 136; // dos columnas de 7 px ("MOCHILA" = 49 px) con margen
      const tb = await sayHold('¿Qué debe hacer ' + monName(this.p.mon) + '?', { style: 'dark', w: W - mw });
      const c = await choose(['LUCHAR', 'MOCHILA', 'EQUIPO', 'HUIR'], { x: W - mw, y: H - 48, w: mw, h: 48, cols: 2, colW: 60, rowH: 16, cancel: false, size: 7 });
      Scenes.remove(tb);
      if (c === 0) {
        const m = this.p.mon;
        if (!m.moves.some(x => x.pp > 0)) { await this.msg('¡' + monName(m) + ' no tiene movimientos que usar!'); return { t: 'move', move: 'lucha' }; }
        const r = await this.chooseMove();
        if (r) return r;
      } else if (c === 1) {
        const r = await bagMenu({ battle: true, wild: this.wild });
        if (r) {
          const it2 = ITEMS[r.item];
          if (it2.ball) return { t: 'ball', item: r.item };
          return { t: 'item', item: r.item, target: r.target, move: r.move };
        }
      } else if (c === 2) {
        const idx = await partyMenu({ mode: 'battle', current: this.p.idx });
        if (idx != null && idx >= 0) return { t: 'switch', idx };
      } else if (c === 3) {
        if (!this.wild) { await this.msg('¡No puedes huir de un combate contra un entrenador!'); continue; }
        if (this.o.noRun) { await this.msg('¡No hay escapatoria!'); continue; }
        return { t: 'run' };
      }
    }
  }
  async chooseMove() {
    const m = this.p.mon;
    let start = this.lastMove && this.lastMove.uid === m.uid ? this.lastMove.i : 0;
    if (!m.moves[start] || m.moves[start].pp <= 0) start = Math.max(0, m.moves.findIndex(x => x.pp > 0));
    let sel = start;
    const items = m.moves.map(x => ({ label: MOVES[x.id].name }));
    while (items.length < 4) items.push({ label: '-', disabled: true });
    // lista de 2x2 (cabe el nombre más largo, 15 letras a 7 px, en cada columna) + panel de PP y tipo
    const mw = 248, px = mw, pw = W - mw, py = H - 48;
    const c = await choose(items, {
      x: 0, y: py, w: mw, h: 48, cols: 2, colW: 118, rowH: 16, size: 7, start,
      onMove: i => { sel = i; },
      extra: () => {
        const mv = m.moves[sel];
        drawBox(px, py, pw, 48, 'std');
        if (mv) {
          const M = MOVES[mv.id];
          txt('PP', px + 9, py + 11, '#363644', 7);
          txt(mv.pp + '/' + M.pp, px + pw - 9, py + 11, mv.pp ? '#363644' : '#c03030', 7, 'right');
          drawTypeTag(M.type, px + 9, py + 25, pw - 18);
        }
      },
    });
    if (c < 0) return null;
    const mv = m.moves[c];
    if (!mv) return null;
    if (mv.pp <= 0) { await this.msg('¡No quedan PP para este movimiento!'); return null; }
    this.lastMove = { uid: m.uid, i: c };
    return { t: 'move', move: mv.id };
  }

  // ---------- IA ----------
  enemyAI() {
    const me = this.e, foe = this.p, m = me.mon;
    const usable = m.moves.filter(x => x.pp > 0);
    if (!usable.length) return { t: 'move', move: 'lucha' };
    if (this.wild && !this.o.legend) return { t: 'move', move: rnd.pick(usable).id };
    if (me.potions > 0 && m.hp < m.maxhp * 0.25 && m.hp > 0 && rnd.chance(0.6)) { me.potions--; return { t: 'item', item: 'hiperpocion' }; }
    let best = null, bestS = -1;
    for (const x of usable) {
      const M = MOVES[x.id];
      let s;
      if (M.cat === 'S') {
        s = 18;
        if (M.st) s = foe.mon.status ? 0 : 38;
        if (M.fs) s = Object.entries(M.fs).every(([k]) => foe.st[k] <= -2) ? 2 : 22;
        if (M.ss) s = Object.entries(M.ss).every(([k]) => me.st[k] >= 2) ? 2 : (m.hp > m.maxhp * 0.6 ? 34 : 12);
        if (M.heal) s = m.hp < m.maxhp * 0.45 ? 80 : 0;
        if (M.rest) s = m.hp < m.maxhp * 0.35 && !m.status ? 70 : 0;
        if (M.seed) s = foe.v.seed || foe.mon.types && 0 ? 0 : (SPECIES[foe.mon.sp].types.includes('planta') || foe.v.seed ? 0 : 30);
        if (M.conf) s = foe.v.confuse ? 0 : 28;
        if (M.teleport || M.splash) s = 1;
        if (M.st && M.st[0] === 'slp' && foe.mon.status) s = 0;
      } else {
        const eff = typeEff(M.type, SPECIES[foe.mon.sp].types);
        if (eff === 0) s = 0;
        else {
          const dmg = this.calcDamage(me, foe, M, false, true);
          s = dmg / Math.max(1, foe.mon.hp) * 100 * ((M.acc || 100) / 100);
          if (dmg >= foe.mon.hp) s += 120;
          if (M.recharge) s *= 0.6;
          if (M.charge) s *= 0.6;
          if (M.dream && foe.mon.status !== 'slp') s = 0;
        }
      }
      s *= rnd.float(0.85, 1.15);
      if (s > bestS) { bestS = s; best = x.id; }
    }
    return { t: 'move', move: best };
  }

  // ---------- turno ----------
  order(pa, ea) {
    const pr = a => a.t === 'move' ? (MOVES[a.move].pri || 0) : 10;
    const P = pr(pa), E = pr(ea);
    let pFirst;
    if (P !== E) pFirst = P > E;
    else {
      const ps = this.stat(this.p, 'spe'), es = this.stat(this.e, 'spe');
      pFirst = ps === es ? rnd.chance(0.5) : ps > es;
    }
    return pFirst ? [[this.p, pa], [this.e, ea]] : [[this.e, ea], [this.p, pa]];
  }
  async turn() {
    const P = this.p, E = this.e;
    let pa;
    if (P.v.recharge) pa = { t: 'recharge' };
    else if (P.v.charge) pa = { t: 'move', move: P.v.charge };
    else pa = await this.chooseAction();
    if (pa.t === 'run') {
      if (await this.tryRun()) return 'run';
      pa = { t: 'none' };
    }
    if (pa.t === 'ball') {
      if (await this.throwBall(pa.item)) return 'caught';
      pa = { t: 'none' };
    }
    let ea = E.v.recharge ? { t: 'recharge' } : E.v.charge ? { t: 'move', move: E.v.charge } : this.enemyAI();
    for (const [me, act] of this.order(pa, ea)) {
      const foe = me === P ? E : P;
      if (me.mon.hp <= 0) continue;
      await this.doAction(me, foe, act);
      if (this.ended) return this.ended;
      if (P.mon.hp <= 0 || E.mon.hp <= 0) {
        const r = await this.handleFaints();
        P.v.flinch = E.v.flinch = false;
        return r;
      }
    }
    // efectos al final del turno
    for (const [me] of this.order({ t: 'none' }, { t: 'none' })) {
      const foe = me === P ? E : P;
      const m = me.mon;
      if (m.hp <= 0) continue;
      if (m.status === 'brn' || m.status === 'psn') {
        const d = Math.max(1, Math.floor(m.maxhp / 8));
        await this.msg(m.status === 'brn' ? '¡' + this.nm(me) + ' se resiente de la quemadura!' : '¡El veneno resta PS a ' + this.nm(me) + '!', 700);
        await this.damage(me, d, true);
      }
      if (me.v.seed && m.hp > 0 && foe.mon.hp > 0) {
        const d = Math.max(1, Math.floor(m.maxhp / 8));
        this.fx('planta', me, 'S');
        await this.msg('¡Drenadoras quitó PS a ' + this.nm(me) + '!', 700);
        await this.damage(me, d, true);
        await this.heal(foe, d);
      }
    }
    P.v.flinch = E.v.flinch = false;
    if (P.mon.hp <= 0 || E.mon.hp <= 0) return this.handleFaints();
    return null;
  }
  async doAction(me, foe, act) {
    if (act.t === 'switch') {
      await this.msg('¡' + monName(me.mon) + ', vuelve!', 500);
      await this.retract(me);
      me.idx = act.idx; me.reset();
      await this.msg('¡Adelante, ' + monName(me.mon) + '!', 500);
      await this.sendOut(me);
    } else if (act.t === 'item') {
      if (me === this.e) {
        const m = me.mon, h = Math.min(m.maxhp - m.hp, 120);
        await this.msg('¡' + this.trainer.title + ' usó una HIPERPOCIÓN!', 800);
        Sound.sfx('heal');
        await this.heal(me, h);
      } else await this.useItemInBattle(act);
    } else if (act.t === 'recharge') {
      me.v.recharge = false;
      await this.msg('¡' + this.nm(me) + ' tiene que recuperarse!', 800);
    } else if (act.t === 'move') {
      await this.useMove(me, foe, act.move);
    }
  }
  async useItemInBattle(act) {
    const it2 = ITEMS[act.item], m = G.party[act.target];
    removeItem(act.item);
    await this.msg('¡' + G.name + ' usó ' + it2.name + '!', 700);
    const side = act.target === this.p.idx ? this.p : null;
    if (it2.revive) {
      m.hp = Math.max(1, Math.floor(m.maxhp * it2.revive)); m.status = null;
      Sound.sfx('heal');
      await this.msg('¡' + monName(m) + ' se ha reanimado!', 800);
      return;
    }
    if (it2.heal) {
      const h = Math.min(m.maxhp - m.hp, it2.heal);
      Sound.sfx('heal');
      if (side) await this.heal(side, h); else m.hp += h;
      if (!it2.cure) await this.msg('¡' + monName(m) + ' recuperó ' + h + ' PS!', 800);
    }
    if (it2.cure) {
      if (it2.cure === 'all' || it2.cure === m.status) { m.status = null; m.sleep = 0; if (side) side.v.confuse = 0; }
      await this.msg('¡' + monName(m) + ' está como nuevo!', 800);
    }
    if (it2.pp && act.move != null) {
      const mv = m.moves[act.move];
      mv.pp = Math.min(MOVES[mv.id].pp, mv.pp + it2.pp);
      await this.msg('¡Se restauraron los PP de ' + MOVES[mv.id].name + '!', 800);
    }
  }
  async damage(side, d, quiet) {
    const m = side.mon;
    const to = Math.max(0, m.hp - d);
    m.hp = to;
    await this.tweenHp(side, to);
  }
  async heal(side, h) {
    const m = side.mon;
    if (h <= 0) return;
    const to = Math.min(m.maxhp, m.hp + h);
    m.hp = to;
    await this.tweenHp(side, to);
  }
  async blink(side) {
    const st = side === this.p ? this.ps : this.es;
    for (let i = 0; i < 3; i++) { st.flash = true; await wait(60); st.flash = false; await wait(60); }
  }
  async lunge(side) {
    const st = side === this.p ? this.ps : this.es;
    const d = side === this.p ? 1 : -1;
    await tween(90, t => { st.x = d * 12 * t; st.y = -d * 5 * t; });
    await tween(110, t => { st.x = d * 12 * (1 - t); st.y = -d * 5 * (1 - t); });
  }
  calcDamage(att, def, M, crit, avg) {
    const am = att.mon, dm = def.mon;
    if (M.fixed === 'lvl') return am.lvl;
    if (M.fixed === 'half') return Math.max(1, Math.floor(dm.hp / 2));
    if (typeof M.fixed === 'number') return M.fixed;
    const phys = M.cat === 'F';
    let A = phys ? am.atk : am.spa, D = phys ? dm.def : dm.spd;
    const as = att.st[phys ? 'atk' : 'spa'], ds = def.st[phys ? 'def' : 'spd'];
    A *= stageMult(crit ? Math.max(0, as) : as);
    D *= stageMult(crit ? Math.min(0, ds) : ds);
    let pow = M.pow;
    if (M.hex && dm.status) pow *= 2;
    let dmg = Math.floor(Math.floor(Math.floor(2 * am.lvl / 5 + 2) * pow * A / Math.max(1, D)) / 50) + 2;
    if (crit) dmg *= 1.5;
    dmg *= avg ? 0.925 : rnd.float(0.85, 1);
    if (M.type !== 'none' && SPECIES[am.sp].types.includes(M.type)) dmg *= 1.5;
    if (M.type !== 'none') dmg *= typeEff(M.type, SPECIES[dm.sp].types);
    if (phys && am.status === 'brn') dmg *= 0.5;
    return Math.max(1, Math.floor(dmg));
  }
  inflict(target, st, quietFail) {
    const m = target.mon, types = SPECIES[m.sp].types;
    if (st === 'tri') st = rnd.pick(['brn', 'par', 'frz']);
    if (m.hp <= 0) return null;
    if (m.status) return quietFail ? null : 'ya';
    if (st === 'brn' && types.includes('fuego')) return quietFail ? null : 'inmune';
    if (st === 'par' && types.includes('electrico')) return quietFail ? null : 'inmune';
    if (st === 'psn' && (types.includes('veneno') || types.includes('acero'))) return quietFail ? null : 'inmune';
    if (st === 'frz' && types.includes('hielo')) return quietFail ? null : 'inmune';
    m.status = st;
    if (st === 'slp') m.sleep = rnd.int(1, 3);
    return st;
  }
  async statusMsg(target, st) {
    const t = {
      psn: '¡' + this.nm(target) + ' ha sido envenenado!', brn: '¡' + this.nm(target) + ' se ha quemado!',
      par: '¡' + this.nm(target) + ' está paralizado! Quizás no pueda moverse.', slp: '¡' + this.nm(target) + ' se ha dormido!',
      frz: '¡' + this.nm(target) + ' ha sido congelado!',
    }[st];
    Sound.sfx('status');
    if (t) await this.msg(t, 900);
  }
  async changeStats(target, changes, self) {
    for (const [k, d] of Object.entries(changes)) {
      const cur = target.st[k];
      const nv = clamp(cur + d, -6, 6);
      const nm = this.nm(target);
      if (nv === cur) { await this.msg('¡' + (STAT_NAMES[k]) + ' de ' + nm + ' no puede ' + (d > 0 ? 'subir' : 'bajar') + ' más!', 800); continue; }
      target.st[k] = nv;
      this.statFx(target, d > 0);
      Sound.sfx(d > 0 ? 'statup' : 'statdown');
      await wait(250);
      await this.msg('¡' + STAT_NAMES[k] + ' de ' + nm + (d > 0 ? (d > 1 ? ' subió mucho!' : ' subió!') : (d < -1 ? ' bajó mucho!' : ' bajó!')), 800);
    }
  }
  async useMove(me, foe, mvId) {
    const m = me.mon;
    const M = MOVES[mvId];
    // estados que impiden actuar
    if (m.status === 'slp') {
      m.sleep--;
      if (m.sleep > 0) { me.v.charge = null; await this.msg('¡' + this.nm(me) + ' está dormido como un tronco!', 800); return; }
      m.status = null; await this.msg('¡' + this.nm(me) + ' se despertó!', 800);
    }
    if (m.status === 'frz') {
      if (rnd.chance(0.2)) { m.status = null; await this.msg('¡' + this.nm(me) + ' se descongeló!', 800); }
      else { await this.msg('¡' + this.nm(me) + ' está congelado!', 800); return; }
    }
    if (me.v.flinch) { me.v.flinch = false; await this.msg('¡' + this.nm(me) + ' retrocedió!', 800); return; }
    if (me.v.confuse > 0) {
      me.v.confuse--;
      if (me.v.confuse === 0) await this.msg('¡' + this.nm(me) + ' ya no está confuso!', 800);
      else {
        await this.msg('¡' + this.nm(me) + ' está confuso!', 700);
        if (rnd.chance(1 / 3)) {
          const d = this.calcDamage(me, me, { pow: 40, cat: 'F', type: 'none' }, false);
          await this.msg('¡Está tan confuso que se hirió a sí mismo!', 700);
          Sound.sfx('hit'); await this.blink(me);
          await this.damage(me, d);
          return;
        }
      }
    }
    if (m.status === 'par' && rnd.chance(0.25)) { me.v.charge = null; await this.msg('¡' + this.nm(me) + ' está paralizado! ¡No se puede mover!', 900); return; }
    // PP
    const slot = m.moves.find(x => x.id === mvId);
    const charging = me.v.charge === mvId;
    if (slot && !charging) slot.pp = Math.max(0, slot.pp - 1);
    if (M.charge && !charging) {
      me.v.charge = mvId;
      await this.msg('¡' + this.nm(me) + ' usó ' + M.name + '!', 500);
      await this.msg(M.charge.replace('{U}', this.nm(me)), 900);
      return;
    }
    me.v.charge = null;
    await this.msg('¡' + this.nm(me) + ' usó ' + M.name + '!', 500);
    if (M.splash) { await this.msg('¡Pero no pasó nada!', 800); return; }
    if (M.teleport) {
      if (this.wild && me === this.p) { Sound.sfx('run'); await this.msg('¡' + this.nm(me) + ' se teletransportó lejos del combate!', 900); this.ended = 'run'; return; }
      if (this.wild && me === this.e) { Sound.sfx('run'); await this.msg('¡' + this.nm(me) + ' huyó!', 900); this.ended = 'fled'; this.es.vis = false; return; }
      await this.msg('¡Pero falló!', 800); return;
    }
    const target = (M.cat === 'S' && !M.st && !M.fs && !M.conf && !M.seed) ? me : foe;
    // precisión
    if (M.acc && target === foe) {
      const p = M.acc / 100 * accMult(clamp(me.st.acc - foe.st.eva, -6, 6));
      if (!rnd.chance(p)) { await this.msg('¡El ataque de ' + this.nm(me) + ' falló!', 900); return; }
    }
    if (M.cat === 'S') {
      await this.lunge(me);
      this.fx(M.type, target, 'S');
      await wait(250);
      if (M.heal) {
        const h = Math.floor(m.maxhp * M.heal);
        if (m.hp >= m.maxhp) { await this.msg('¡Los PS de ' + this.nm(me) + ' están al máximo!', 800); return; }
        Sound.sfx('heal'); await this.heal(me, h);
        await this.msg('¡' + this.nm(me) + ' recuperó PS!', 800); return;
      }
      if (M.rest) {
        if (m.hp >= m.maxhp) { await this.msg('¡Pero falló!', 800); return; }
        m.status = 'slp'; m.sleep = 2;
        Sound.sfx('heal'); await this.heal(me, m.maxhp);
        await this.msg('¡' + this.nm(me) + ' se durmió y recuperó toda su salud!', 900); return;
      }
      if (M.seed) {
        if (foe.v.seed || SPECIES[foe.mon.sp].types.includes('planta')) { await this.msg('¡Pero falló!', 800); return; }
        foe.v.seed = true; await this.msg('¡' + this.nm(foe) + ' fue infectado por las semillas!', 900); return;
      }
      if (M.st) {
        const r = this.inflict(foe, M.st[0]);
        if (r === 'ya') await this.msg('¡' + this.nm(foe) + ' ya tiene un problema de estado!', 900);
        else if (r === 'inmune') await this.msg('No afecta a ' + this.nm(foe) + '...', 900);
        else await this.statusMsg(foe, r);
        return;
      }
      if (M.conf) {
        if (foe.v.confuse) { await this.msg('¡' + this.nm(foe) + ' ya está confuso!', 800); return; }
        foe.v.confuse = rnd.int(2, 5); await this.msg('¡' + this.nm(foe) + ' se encuentra confuso!', 900); return;
      }
      if (M.fs) await this.changeStats(foe, M.fs);
      if (M.ss) await this.changeStats(me, M.ss, true);
      return;
    }
    // movimiento de daño
    if (M.dream && foe.mon.status !== 'slp') { await this.msg('¡' + this.nm(foe) + ' no está dormido! No tuvo efecto.', 900); return; }
    const eff = M.type === 'none' ? 1 : typeEff(M.type, SPECIES[foe.mon.sp].types);
    if (eff === 0) { await this.msg('No afecta a ' + this.nm(foe) + '...', 900); return; }
    const hits = Array.isArray(M.multi) ? (rnd.chance(0.375) ? 2 : rnd.chance(0.6) ? 3 : rnd.chance(0.5) ? 4 : 5) : (M.multi || 1);
    let total = 0, n = 0, critAny = false;
    for (let i = 0; i < hits; i++) {
      if (foe.mon.hp <= 0) break;
      const crit = !M.fixed && rnd.chance(M.crit ? 1 / 8 : 1 / 16);
      critAny = critAny || crit;
      const d = Math.min(foe.mon.hp, this.calcDamage(me, foe, M, crit));
      await this.lunge(me);
      this.fx(M.type, foe, M.cat);
      Sound.sfx(eff > 1 ? 'super' : eff < 1 ? 'weak' : 'hit');
      await this.blink(foe);
      await this.damage(foe, d);
      total += d; n++;
      if (crit) await this.msg('¡Un golpe crítico!', 700);
    }
    if (!M.fixed) {
      if (eff > 1) await this.msg('¡Es muy eficaz!', 700);
      else if (eff < 1) await this.msg('No es muy eficaz...', 700);
    }
    if (n > 1) await this.msg('¡Golpeó ' + n + ' veces!', 700);
    // efectos secundarios
    if (foe.mon.hp > 0) {
      if (M.st && M.st[1] && rnd.chance(M.st[1] / 100)) { const r = this.inflict(foe, M.st[0], true); if (r) await this.statusMsg(foe, r); }
      if (foe.mon.status === 'frz' && M.type === 'fuego') { foe.mon.status = null; await this.msg('¡' + this.nm(foe) + ' se descongeló!', 700); }
      if (M.flinch && rnd.chance(M.flinch / 100)) foe.v.flinch = true;
      if (M.conf != null && M.conf > 0 && rnd.chance(M.conf / 100) && !foe.v.confuse) { foe.v.confuse = rnd.int(2, 5); await this.msg('¡' + this.nm(foe) + ' se encuentra confuso!', 800); }
      if (M.fs && rnd.chance((M.fc || 100) / 100)) await this.changeStats(foe, M.fs);
    }
    if (M.ss && rnd.chance((M.sc || 100) / 100) && m.hp > 0) await this.changeStats(me, M.ss, true);
    if (M.drain && total > 0 && m.hp > 0) {
      const h = Math.max(1, Math.floor(total * M.drain));
      await this.heal(me, h);
      await this.msg('¡' + this.nm(foe) + ' ha perdido energía!', 700);
    }
    if (M.recoil && total > 0 && m.hp > 0) {
      const d = Math.max(1, Math.floor(total * M.recoil));
      await this.msg('¡' + this.nm(me) + ' también se ha hecho daño!', 700);
      await this.damage(me, d);
    }
    if (M.recharge) me.v.recharge = true;
  }
  async faintAnim(side) {
    const st = side === this.p ? this.ps : this.es;
    Sound.cry(side.mon.sp, 0.7);
    await wait(250);
    Sound.sfx('faint');
    await tween(380, t => { st.y = t * 75; st.alpha = 1 - t; });
    st.vis = false; st.y = 0; st.alpha = 1;
    this.hudVis[side.name] = false;
  }
  async handleFaints() {
    const P = this.p, E = this.e;
    if (E.mon.hp <= 0) {
      await this.faintAnim(E);
      await this.msg('¡' + this.nm(E) + ' se debilitó!', 900);
      await this.giveExp();
      const next = E.party.findIndex(x => x.hp > 0);
      if (next < 0 || this.wild) {
        if (P.mon.hp <= 0 && aliveCount() === 0) { await this.faintAnim(P); return 'lose'; }
        return 'win';
      }
      E.idx = next; E.reset();
      this.participants = new Set();
      if (P.mon.hp > 0) this.participants.add(P.idx);
      await this.msg('¡' + this.trainer.title + ' va a sacar a ' + monName(E.mon) + '!', 900);
      if (P.mon.hp > 0 && aliveCount() > 1 && G.opts.shift) {
        if (await yesNo('¿Quieres cambiar de Polemon?', { style: 'dark' })) {
          const idx = await partyMenu({ mode: 'battle', current: P.idx });
          if (idx != null && idx >= 0 && idx !== P.idx) {
            await this.msg('¡' + monName(P.mon) + ', vuelve!', 400); await this.retract(P);
            P.idx = idx; P.reset();
            await this.msg('¡Adelante, ' + monName(P.mon) + '!', 400); await this.sendOut(P);
          }
        }
      }
      await this.sendOut(E);
    }
    if (P.mon.hp <= 0) {
      await this.faintAnim(P);
      await this.msg('¡' + monName(P.mon) + ' se debilitó!', 900);
      if (aliveCount() === 0) return 'lose';
      if (this.wild && !this.o.legend) {
        const c = await ask('¿Usar al siguiente Polemon?', ['SÍ', 'NO'], { style: 'dark' });
        if (c === 1) { if (await this.tryRun()) return 'run'; }
      }
      let idx = -1;
      while (idx < 0) idx = await partyMenu({ mode: 'forced', current: P.idx });
      P.idx = idx; P.reset();
      await this.msg('¡Adelante, ' + monName(P.mon) + '!', 500);
      await this.sendOut(P);
    }
    return null;
  }
  async giveExp() {
    const def = this.e.mon;
    const parts = [...this.participants].filter(i => G.party[i] && G.party[i].hp > 0);
    if (!parts.length) return;
    const base = SPECIES[def.sp].xp * def.lvl / 7 * (this.trainer ? 1.5 : 1) * EXP_MULT;
    const each = Math.max(1, Math.floor(base / parts.length));
    for (const i of parts) {
      const m = G.party[i];
      if (m.lvl >= 100) continue;
      await this.msg('¡' + monName(m) + ' ganó ' + each + ' puntos de experiencia!', 900);
      let left = each;
      while (left > 0 && m.lvl < 100) {
        const need = expAt(m.lvl + 1) - m.exp;
        const add = Math.min(left, need);
        if (i === this.p.idx) {
          const from = m.exp;
          Sound.sfx('exp');
          await tween(Math.min(900, 200 + add / (expAt(m.lvl + 1) - expAt(m.lvl)) * 800), t => { this.p.dispExp = from + add * t; });
        }
        m.exp += add; left -= add;
        if (m.exp >= expAt(m.lvl + 1)) {
          const r = levelUpRaw(m);
          this.leveled.add(m.uid);
          if (i === this.p.idx) { this.p.dispHp = m.hp; this.p.dispExp = m.exp; }
          await Sound.jingle('level');
          await this.msgWait('¡' + monName(m) + ' subió al nivel ' + m.lvl + '!');
          await showStatGain(m, r.old);
          for (const mv of learnAt(m.sp, m.lvl)) await learnMoveUI(m, mv, { style: 'dark' });
        }
      }
      if (i === this.p.idx) this.p.dispExp = m.exp;
    }
  }
  async tryRun() {
    if (!this.wild) { await this.msg('¡No puedes huir de un combate contra un entrenador!'); return false; }
    this.runTries++;
    const ps = this.stat(this.p, 'spe'), es = this.stat(this.e, 'spe');
    const F = Math.floor(ps * 128 / Math.max(1, es)) + 30 * this.runTries;
    if (ps >= es || rnd.int(0, 255) < F) {
      Sound.sfx('run');
      await this.msg('¡Escapaste sin problemas!', 800);
      return true;
    }
    await this.msg('¡No has podido escapar!', 800);
    return false;
  }
  async throwBall(itemId) {
    const it2 = ITEMS[itemId];
    removeItem(itemId);
    await this.msg('¡' + G.name + ' lanzó una ' + it2.name.toUpperCase() + '!', 500);
    // sale de la mano del jugador, describe un arco y se abre sobre el rival
    const x0 = BTL.player.x + 2, y0 = BTL.player.y + 50, x1 = BTL.e.cx, y1 = BTL.ballY - 40;
    this.ball = { x: x0, y: y0, kind: BALL_SPRITE[itemId] || 'bolsibola', wob: 0 };
    Sound.sfx('ball');
    await tween(520, t => { this.ball.x = x0 + (x1 - x0) * t; this.ball.y = y0 - 137 * Math.sin(t * Math.PI * 0.9) + (y1 + 10 - y0) * t * 0.3; });
    if (!this.wild) {
      this.ball = null;
      await this.msg('¡El entrenador ha bloqueado la bola!', 800);
      await this.msg('¡No seas ladrón!', 800);
      return false;
    }
    this.ball.x = x1; this.ball.y = y1;
    this.es.white = 0;
    await tween(260, t => { this.es.white = t; this.es.scale = 1 - 0.85 * t; });
    this.es.vis = false; this.es.scale = 1; this.es.white = 0;
    await tween(300, t => { this.ball.y = y1 + (BTL.ballY - y1) * easeIn(t); });
    const m = this.e.mon, sp2 = SPECIES[m.sp];
    let shakes;
    if (it2.ball >= 255) shakes = 4;
    else {
      const bonus = m.status === 'slp' || m.status === 'frz' ? 2.5 : m.status ? 1.5 : 1;
      const a = ((3 * m.maxhp - 2 * m.hp) * sp2.cr * it2.ball) / (3 * m.maxhp) * bonus;
      if (a >= 255) shakes = 4;
      else {
        const b = 1048560 / Math.sqrt(Math.sqrt(16711680 / Math.max(1, a)));
        shakes = 0;
        for (let i = 0; i < 4; i++) { if (rnd.int(0, 65535) < b) shakes++; else break; }
      }
    }
    for (let i = 0; i < Math.min(3, shakes); i++) {
      await wait(350);
      Sound.sfx('shake');
      await tween(320, t => { this.ball.wob = Math.sin(t * Math.PI * 2) * 5; });
      this.ball.wob = 0;
    }
    await wait(300);
    if (shakes >= 4) {
      this.spawn(10, i => ({ x: x1, y: BTL.ballY - 5, vx: Math.cos(i * .63) * 62, vy: Math.sin(i * .63) * 62 - 25, life: .6, c: '#f8e060', shape: 'star' }));
      await Sound.jingle('catch');
      const isNew = !G.dex.caught[m.sp];
      await this.msgWait('¡Ya está! ¡' + sp2.name + ' atrapado!');
      if (isNew) await this.msgWait('Se han añadido los datos de ' + sp2.name + ' a la POLEDEX.');
      m.ot = G.name;
      const where = addToParty(m);
      if (where === 'box') await this.msgWait(sp2.name + ' ha sido enviado a la CAJA del PC.');
      return true;
    }
    Sound.sfx('poof');
    this.ball = null;
    this.es.vis = true; this.es.white = 1;
    await tween(220, t => { this.es.white = 1 - t; });
    this.es.white = 0;
    await this.msg(['¡Oh, no! ¡El Polemon se ha escapado!', '¡Vaya! ¡Parecía que lo tenías!', '¡Argh! ¡Casi lo atrapas!', '¡Uf! ¡Por muy poco!'][shakes], 1000);
    return false;
  }
  async outro(result) {
    if (result === 'win') {
      Sound.music(this.trainer && this.trainer.boss ? 'victory' : 'victory');
      if (this.trainer) {
        const tIn = W - BTL.trainer.x + 8;
        this.tSprite = { look: this.trainer.look || 'joven', x: tIn };
        await tween(450, t => { this.tSprite.x = tIn * (1 - t); }, easeOut);
        await this.msgWait('¡Has vencido a ' + this.trainer.title + '!');
        if (this.trainer.lose) await say(this.trainer.lose, { style: 'dark' });
        const last = this.e.party[this.e.party.length - 1];
        const money = Math.floor((this.trainer.money || 20) * last.lvl);
        G.money += money;
        Sound.sfx('money');
        await this.msgWait('¡' + G.name + ' ha ganado $' + money + '!');
      }
    } else if (result === 'lose') {
      await this.msgWait('¡A ' + G.name + ' no le quedan Polemon en condiciones de luchar!');
      if (this.o.canLose) await this.msgWait('Bueno, ¡al menos ha sido un buen entrenamiento!');
      else await this.msgWait('¡' + G.name + ' se ha desmayado!');
    }
  }
}

// Inicia un combate. Devuelve 'win' | 'lose' | 'run' | 'caught' | 'fled'
async function startBattle(o) {
  Input.consume();
  const prevMusic = Sound.current;
  // transición
  Sound.sfx('surprise');
  for (let i = 0; i < 3; i++) { await Fade.to(0.85, 70, '#ffffff'); await Fade.to(0, 70); }
  await Fade.to(1, 220, '#000000');
  const b = new BattleScene(o);
  Scenes.push(b);
  let result;
  try {
    await b.intro();
    result = null;
    while (!result) result = await b.turn();
    if (result === 'fled') result = 'run';
    await b.outro(result);
  } catch (e) { console.error(e); Game.error = String(e && e.stack || e); result = 'run'; }
  await Fade.out(300);
  Scenes.remove(b);
  // los estados volátiles desaparecen; el resto se mantiene
  for (const m of G.party) if (m.hp <= 0) m.status = null;
  // evoluciones pendientes
  if (result !== 'lose') {
    for (const m of G.party.slice()) {
      if (!b.leveled.has(m.uid) || m.hp <= 0) continue;
      const to = evoTarget(m, 'level');
      if (to) await evolveUI(m, to);
    }
  }
  if (prevMusic) Sound.music(prevMusic);
  return result;
}
// Cuadro de aumento de stats tras subir de nivel
function showStatGain(m, old) {
  return new Promise(res => {
    let page = 0;
    const scene = {
      update() { if (Input.p('a') || Input.p('b')) { Sound.sfx('blip'); page++; if (page > 1) { Scenes.remove(scene); res(); } } },
      draw() {
        const w = 140, h = 116, x = W - w - 5, y = 5;
        drawBox(x, y, w, h, 'std');
        const rows = [['PS', 'maxhp'], ['Ataque', 'atk'], ['Defensa', 'def'], ['At. Esp.', 'spa'], ['Def. Esp.', 'spd'], ['Velocidad', 'spe']];
        rows.forEach(([n, k], i) => {
          txt(n, x + 12, y + 12 + i * 17, '#363644', 7);
          txt(page === 0 ? '+' + (m[k] - old[k]) : String(m[k]), x + w - 12, y + 12 + i * 17, '#363644', 7, 'right');
        });
      },
    };
    Scenes.push(scene);
  });
}

<script>
'use strict';

class PickScene {

function drawPanelBg(c1 = '#5878b8', c2 = '#486898') {
  const q = 10;   // cuadros del damero
  ctx.fillStyle = c1; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = c2;
  for (let y = 0; y < H; y += q) for (let x = (y / q) % 2 ? 0 : q; x < W; x += q * 2) ctx.fillRect(x, y, q, q);
}
function hint(text) { drawBox(0, H - 24, W, 24, 'std'); txt(text, 12, H - 16, '#363644', 7); }

// ---------------- Menú de inicio ----------------
async function startMenu() {
  let last = 0;
  for (;;) {
    const opts = [];
    if (G.flags.dex) opts.push(['POLEDEX', 'dex']);
    if (G.party.length) opts.push(['POLEMON', 'party']);
    opts.push(['MOCHILA', 'bag'], ['MAPA', 'map'], [G.name, 'card'], ['GUARDAR', 'save'], ['OPCIONES', 'opts'], ['SALIR', 'exit']);
    const c = await choose(opts.map(o => o[0]), { x: W - 118, y: 2, w: 116, rowH: 18, start: Math.min(last, opts.length - 1) });
    if (c < 0) return;
    last = c;
    const k = opts[c][1];
    if (k === 'exit') return;
    if (k === 'dex') await dexMenu();
    if (k === 'party') await partyMenu({ mode: 'field' });
    if (k === 'bag') await bagMenu({});
    if (k === 'map') await townMap();
    if (k === 'card') await trainerCard();
    if (k === 'save') { if (await yesNo('¿Quieres guardar la partida?')) { saveGame(); Sound.sfx('money'); await say('¡' + G.name + ' guardó la partida!'); } return; }
    if (k === 'opts') await optionsMenu();
  }
}

// ---------------- Equipo ----------------
class PartyScene extends PickScene {
  constructor(o) {
    super(); this.o = o; this.i = clamp(o.current || 0, 0, Math.max(0, G.party.length - 1)); this.swap = -1;
    this.msg = o.msg || (o.mode === 'forced' ? 'Elige el siguiente Polemon.' : 'Elige un Polemon.');
    if (o.mode === 'forced') { const k = G.party.findIndex((m, j) => m.hp > 0 && j !== o.current); if (k >= 0) this.i = k; }
  }
  update() {
    if (!this.res) return;
    const n = G.party.length;
    if (Input.r('up')) { this.i = (this.i + n - 1) % n; Sound.sfx('move'); }
    if (Input.r('down')) { this.i = (this.i + 1) % n; Sound.sfx('move'); }
    if (Input.p('a')) { Sound.sfx('blip'); this.done(this.i); }
    else if (Input.p('b') && this.o.mode !== 'forced') { Sound.sfx('blip'); this.done(-1); }
  }
  draw() {
    drawPanelBg('#58a078', '#4a9068');
    // 6 filas de 30 px (cada una con su icono de ICON px) sobre la caja de mensaje
    const bx = 4, bw = W - 8, rh = 30, pitch = 31, R = bx + bw - 10, bar = 108;
    G.party.forEach((m, k) => {
      const y = 4 + k * pitch;
      const sel = k === this.i, sw = k === this.swap;
      drawBox(bx, y, bw, rh, sel ? 'red' : sw ? 'hud' : 'std');
      const bob = sel ? Math.round(Math.sin(Game.time * 8)) : 0;
      ctx.drawImage(Art.icon(m.sp), bx + 4, y + (rh - ICON) / 2 - 3 + bob);
      const tx = bx + ICON + 8;
      txt(monName(m), tx, y + 6, '#363644', 8);
      txt('Nv' + m.lvl, tx, y + 17, '#5a5a6a', 7);
      if (this.o.filter) { const ok = this.o.filter(m); txt(ok === true ? 'APTO' : ok || 'NO APTO', R, y + 11, ok === true ? '#308030' : '#b03030', 7, 'right'); return; }
      if (m.hp <= 0) drawStatusTag('fnt', tx + 42, y + 16); else if (m.status) drawStatusTag(m.status, tx + 42, y + 16);
      txt('PS', R - bar - 16, y + 7, '#c09030', 6);
      drawHPBar(R - bar, y + 8, bar, m.hp / m.maxhp);
      txt(m.hp + '/' + m.maxhp, R, y + 17, '#363644', 7, 'right');
    });
    drawBox(0, H - 44, W, 44, 'std');
    txt(fmt(this.msg), 12, H - 30, '#363644', 8);
  }
}
async function partyMenu(o = {}) {
  if (!G.party.length) return -1;
  const s = new PartyScene(o);
  Scenes.push(s);
  try {
    for (;;) {
      const i = await s.pick();
      if (i < 0) return -1;
      const m = G.party[i];
      if (o.mode === 'item' || o.mode === 'select') return i;
      if (o.mode === 'battle' || o.mode === 'forced') {
        const c = await choose(['CAMBIAR', 'DATOS', 'SALIR'], { x: W - 108, y: H - 44 - 70, w: 104, rowH: 18 });
        if (c === 0) {
          if (m.hp <= 0) { await say('¡' + monName(m) + ' no puede luchar!'); continue; }
          if (i === o.current) { await say('¡' + monName(m) + ' ya está luchando!'); continue; }
          return i;
        }
        if (c === 1) await summaryMenu(i);
        continue;
      }
      // campo
      const c = await choose(['DATOS', 'MOVER', 'SALIR'], { x: W - 108, y: H - 44 - 70, w: 104, rowH: 18 });
      if (c === 0) { const j = await summaryMenu(i); s.i = j; }
      if (c === 1) {
        s.swap = i; s.msg = '¿Con quién lo cambias?';
        const j = await s.pick();
        if (j >= 0 && j !== i) { const t = G.party[i]; G.party[i] = G.party[j]; G.party[j] = t; Sound.sfx('blip'); }
        s.swap = -1; s.msg = 'Elige un Polemon.';
      }
    }
  } finally { Scenes.remove(s); }
}

// ---------------- Datos ----------------
class SummaryScene extends PickScene {
  constructor(list, i) { super(); this.list = list; this.i = i; this.page = 0; }
  update() {
    if (!this.res) return;
    if (Input.r('left')) { this.page = (this.page + 2) % 3; Sound.sfx('move'); }
    if (Input.r('right')) { this.page = (this.page + 1) % 3; Sound.sfx('move'); }
    if (Input.r('up') && this.list.length > 1) { this.i = (this.i + this.list.length - 1) % this.list.length; Sound.sfx('move'); Sound.cry(this.list[this.i].sp); }
    if (Input.r('down') && this.list.length > 1) { this.i = (this.i + 1) % this.list.length; Sound.sfx('move'); Sound.cry(this.list[this.i].sp); }
    if (Input.p('b') || Input.p('a')) { Sound.sfx('blip'); this.done(this.i); }
  }
  draw() {
    const m = this.list[this.i], S = SPECIES[m.sp];
    drawPanelBg('#c8a058', '#b89048');
    // columna izquierda: sprite grande + ficha de especie (nº, nombre y tipos)
    const SW = SPR * 2, LW = SW + 16, SH = SW + 40;
    drawBox(4, 4, LW, SH, 'hud');
    ctx.drawImage(Art.front(m.sp, SPR), 12, 4 + (SH - SW) / 2, SW, SW);
    const IY = SH + 8;
    drawBox(4, IY, LW, H - 4 - IY, 'hud');
    // bloque centrado en la caja (Nº 7 px + nombre 8 px + tipos 11 px = 51 px de alto)
    const BY = IY + 4 + Math.floor((H - 12 - IY - 51) / 2);
    txt('Nº' + String(S.num).padStart(3, '0'), 14, BY, '#7a6a5a', 7);
    txt(S.name, 14, BY + 16, '#363644', 8);
    S.types.forEach((t, k) => drawTypeTag(t, 14 + k * 50, BY + 40, 46));
    // columna derecha: cabecera, pestañas y panel
    const X = LW + 8, PW = W - 4 - X, L0 = X + 10, R0 = W - 14;
    drawBox(X, 4, PW, 24, 'std');
    txt(monName(m), L0, 12, '#363644', 8); txt('Nv' + m.lvl, R0, 13, '#363644', 7, 'right');
    const tabs = ['INFO', 'STATS', 'MOVS'], tx = k => X + Math.round(k * (PW + 2) / 3);
    tabs.forEach((t, k) => { const tw = tx(k + 1) - tx(k) - 2; drawBox(tx(k), 32, tw, 18, k === this.page ? 'red' : 'std'); txt(t, tx(k) + tw / 2, 38, '#363644', 7, 'center'); });
    const PY = 54;
    drawBox(X, PY, PW, H - 4 - PY, 'std');
    const L = (a, b, y, c = '#363644') => { txt(a, L0, y, '#7a6a5a', 7); txt(b, R0, y, c, 7, 'right'); };
    if (this.page === 0) {
      L('PS', m.hp + '/' + m.maxhp, PY + 12);
      L('ESTADO', m.hp <= 0 ? 'DEBILITADO' : m.status ? STATUS_NAMES[m.status].toUpperCase() : 'OK', PY + 30);
      L('EXP', String(m.exp), PY + 48);
      L('SIGUIENTE', m.lvl < 100 ? String(expAt(m.lvl + 1) - m.exp) : '-', PY + 66);
      L('ENT. ORIG.', m.ot || G.name, PY + 84);
      ctx.fillStyle = '#e4e4dc'; ctx.fillRect(L0, PY + 102, R0 - L0, 1);
      const lines = wrapText(S.dx, R0 - L0, 7);
      lines.slice(0, 5).forEach((l, k) => txt(l, L0, PY + 112 + k * 12, '#5a5a6a', 7));
    } else if (this.page === 1) {
      const rows = [['PS', m.maxhp], ['ATAQUE', m.atk], ['DEFENSA', m.def], ['AT. ESP.', m.spa], ['DEF. ESP.', m.spd], ['VELOCIDAD', m.spe]];
      rows.forEach(([a, b], k) => L(a, String(b), PY + 12 + k * 18));
      ctx.fillStyle = '#e4e4dc'; ctx.fillRect(L0, PY + 120, R0 - L0, 1);
      txt('Pulsa ARRIBA/ABAJO para', L0, PY + 132, '#7a6a5a', 7); txt('ver a otros Polemon.', L0, PY + 144, '#7a6a5a', 7);
    } else {
      m.moves.forEach((mv, k) => {
        const M = MOVES[mv.id], y = PY + 10 + k * 43;
        if (k) { ctx.fillStyle = '#e4e4dc'; ctx.fillRect(L0, y - 9, R0 - L0, 1); }
        txt(M.name, L0, y, '#363644', 7);
        txt('PP ' + mv.pp + '/' + M.pp, R0, y, '#363644', 7, 'right');
        drawTypeTag(M.type, L0, y + 12, 44);
        txt('PREC ' + (M.acc || '--'), L0 + 52, y + 14, '#5a5a6a', 7);
        txt((M.cat === 'S' ? 'ESTADO' : M.cat === 'F' ? 'FÍS ' : 'ESP ') + (M.pow ? M.pow : M.fixed ? '--' : ''), R0, y + 14, '#5a5a6a', 7, 'right');
      });
    }
  }
}
async function summaryMenu(i, list) {
  const s = new SummaryScene(list || G.party, i);
  Scenes.push(s);
  Sound.cry((list || G.party)[i].sp);
  const r = await s.pick();
  Scenes.remove(s);
  return r;
}

// ---------------- Lista genérica con desplazamiento ----------------
class ListScene extends PickScene {
  constructor(o) {
    super(); this.o = o; this.i = 0; this.top = 0; this.tab = o.tab || 0;
    // la lista ocupa todo el alto disponible (encima de la caja de descripción si la hay)
    const avail = (o.desc ? H - 48 : H - 4) - 4;
    this.rows = o.rows || Math.floor((avail - 16) / 18);
    this.rh = Math.min(20, Math.floor((avail - 16) / this.rows));
  }
  items() { return this.o.items(this.tab); }
  update() {
    if (!this.res) return;
    const it2 = this.items(), n = it2.length;
    if (this.o.tabs && (Input.r('left') || Input.r('right'))) {
      this.tab = (this.tab + (Input.r('left') ? this.o.tabs.length - 1 : 1)) % this.o.tabs.length; this.i = 0; this.top = 0; Sound.sfx('move');
    }
    if (n) {
      if (Input.r('up')) { this.i = (this.i + n - 1) % n; Sound.sfx('move'); }
      if (Input.r('down')) { this.i = (this.i + 1) % n; Sound.sfx('move'); }
    }
    if (this.i >= n) this.i = Math.max(0, n - 1);
    if (this.i < this.top) this.top = this.i;
    if (this.i >= this.top + this.rows) this.top = this.i - this.rows + 1;
    if (Input.p('a') && n) { Sound.sfx('blip'); this.done({ i: this.i, item: it2[this.i], tab: this.tab }); }
    else if (Input.p('b')) { Sound.sfx('blip'); this.done(null); }
  }
  draw() {
    const o = this.o;
    drawPanelBg(o.bg1, o.bg2);
    const x = o.x != null ? o.x : 128, y = 4, w = W - x - 4, rh = this.rh, h = this.rows * rh + 16;
    const ty = Math.floor((rh - 7) / 2);
    if (o.tabs) {
      drawBox(4, 4, x - 8, 24, 'red');
      txt(o.tabs[this.tab], 4 + (x - 8) / 2, 12, '#363644', 7, 'center');
      txt('<', 12, 12, '#c84050', 7); txt('>', x - 12, 12, '#c84050', 7, 'right');
    } else if (o.title) { drawBox(4, 4, x - 8, 24, 'red'); txt(o.title, 4 + (x - 8) / 2, 12, '#363644', 7, 'center'); }
    drawBox(x, y, w, h, 'std');
    const it2 = this.items();
    if (!it2.length) txt(o.empty || 'No hay nada.', x + 18, y + 8 + ty, '#8a8a9a', 7);
    for (let k = 0; k < this.rows && this.top + k < it2.length; k++) {
      const e = it2[this.top + k], yy = y + 8 + k * rh + ty;
      txt(e.label, x + 18, yy, e.disabled ? '#a0a0a8' : '#363644', 7);
      if (e.icon) drawBallIcon(x + w - 19, yy, 'bolsibola');
      else if (e.right != null) txt(e.right, x + w - 12, yy, '#363644', 7, 'right');
      if (this.top + k === this.i) drawCursor(x + 9, yy);
    }
    const cx = Math.floor(x + w / 2);
    // flechas de desplazamiento dentro de la caja, en espejo (arriba y+5..y+8, abajo y+h-9..y+h-6)
    if (this.top > 0) { ctx.fillStyle = '#c84050'; ctx.fillRect(cx, y + 5, 1, 1); ctx.fillRect(cx - 1, y + 6, 3, 1); ctx.fillRect(cx - 2, y + 7, 5, 1); ctx.fillRect(cx - 3, y + 8, 7, 1); }
    if (this.top + this.rows < it2.length) drawDownArrow(cx - 3, y + h - 9);
    if (o.side) o.side(it2[this.i], this);
    if (o.desc) {
      drawBox(0, H - 44, W, 44, 'std');
      if (it2[this.i]) wrapText(o.desc(it2[this.i]) || '', W - 24, 7).slice(0, 3).forEach((l, k) => txt(l, 12, H - 36 + k * 11, '#363644', 7));
    }
  }
}

// Panel lateral con un personaje a x5 (mochila, tienda): ocupa la columna izquierda hasta el pie de la lista

}

// ---------------- Mochila ----------------
function bagItems(pocket, o) {
  return Object.keys(G.bag).filter(id => ITEMS[id] && ITEMS[id].pocket === pocket && G.bag[id] > 0)
    .map(id => ({ id, label: ITEMS[id].name, right: ITEMS[id].pocket === 'clave' || ITEMS[id].pocket === 'mt' ? '' : 'x' + G.bag[id], disabled: o.battle && !ITEMS[id].battle }));
}
async function bagMenu(o = {}) {
  const s = new ListScene({
    tabs: POCKETS.map(p => p[1]), items: tab => bagItems(POCKETS[tab][0], o), x: 128, bg1: '#d07858', bg2: '#c06848',
    desc: e => ITEMS[e.id].desc, empty: 'Bolsillo vacío.',
    side: (e, ls) => personPanel('player', ls),
  });
  s.tab = o.battle ? 1 : 0;
  Scenes.push(s);
  try {
    for (;;) {
      const r = await s.pick();
      if (!r) return null;
      const id = r.item.id, it2 = ITEMS[id];
      if (o.battle) {
        if (!it2.battle) { await say('¡No puedes usar eso ahora!'); continue; }
        if (it2.ball) {
          if (G.party.length >= 6 && G.box.length >= 300) { await say('¡No queda sitio en el PC!'); continue; }
          return { item: id };
        }
        const t = await partyMenu({ mode: 'item', msg: '¿En quién usar ' + it2.name + '?' });
        if (t < 0) continue;
        const m = G.party[t];
        const ok = itemApplicable(it2, m);
        if (ok !== true) { await say(ok); continue; }
        let mvI = null;
        if (it2.pp) { mvI = await choose(m.moves.map(x => MOVES[x.id].name + ' ' + x.pp + '/' + MOVES[x.id].pp), { rowH: 18 }); if (mvI < 0) continue; }
        return { item: id, target: t, move: mvI };
      }
      const acts = it2.pocket === 'clave' ? ['USAR', 'SALIR'] : it2.pocket === 'mt' ? ['ENSEÑAR', 'SALIR'] : it2.field ? ['USAR', 'TIRAR', 'SALIR'] : ['TIRAR', 'SALIR'];
      const c = await choose(acts, { x: W - 110, w: 106, rowH: 18 });
      const a = acts[c];
      if (a === 'USAR' || a === 'ENSEÑAR') { const r2 = await useItemField(id); if (r2 === 'close') return null; }
      if (a === 'TIRAR') {
        const q = await pickQty(G.bag[id]);
        if (q > 0 && await yesNo('¿Tirar ' + q + ' x ' + it2.name + '?')) { removeItem(id, q); await say('Has tirado ' + it2.name + '.'); }
      }
    }
  } finally { Scenes.remove(s); }
}
function itemApplicable(it2, m) {
  if (it2.revive) return m.hp <= 0 ? true : '¡No tendría ningún efecto!';
  if (m.hp <= 0) return '¡Está debilitado!';
  if (it2.heal && it2.cure) return m.hp < m.maxhp || m.status ? true : '¡No tendría ningún efecto!';
  if (it2.heal) return m.hp < m.maxhp ? true : '¡No tendría ningún efecto!';
  if (it2.cure) return (it2.cure === 'all' ? m.status : m.status === it2.cure) ? true : '¡No tendría ningún efecto!';
  if (it2.pp) return true;
  return true;
}
async function useItemField(id) {
  const it2 = ITEMS[id];
  if (it2.rod) { await say('Ponte frente al agua y pulsa A para pescar.'); return; }
  if (it2.repel) { G.repel = it2.repel; removeItem(id); Sound.sfx('heal'); await say('¡Usaste ' + it2.name + '! Los Polemon débiles no se acercarán.'); return 'close'; }
  if (it2.escape) {
    const ex = OW.map.exitTo;
    if (!OW.map.dungeon || !ex) { await say('¡No puedes usarla aquí!'); return; }
    removeItem(id); await say('¡Usaste la CUERDA HUIDA!');
    await OW.warpTo(ex.map, ex.x, ex.y, 'down', 'stairs');
    return 'close';
  }
  if (id === 'bolsidex') { await dexMenu(); return; }
  if (id === 'pase') { await say('Es el pase de CAMPEÓN. ¡Estás muy orgulloso de él!'); return; }
  if (!it2.field && !it2.mt) { await say('No puedes usar eso ahora.'); return; }
  const filter = it2.mt ? (m => knows(m, it2.mt) ? 'APRENDIDO' : mtCompatible(m.sp, id) ? true : 'NO APTO')
    : it2.stone ? (m => evoTarget(m, 'item', id) ? true : 'NO APTO') : null;
  const t = await partyMenu({ mode: 'item', msg: '¿En quién usar ' + it2.name + '?', filter });
  if (t < 0) return;
  const m = G.party[t];
  if (it2.mt) {
    if (knows(m, it2.mt)) { await say(monName(m) + ' ya conoce ' + MOVES[it2.mt].name + '.'); return; }
    if (!mtCompatible(m.sp, id)) { await say(monName(m) + ' no puede aprender ' + MOVES[it2.mt].name + '.'); return; }
    await say('Iniciando ' + it2.name + '...');
    await learnMoveUI(m, it2.mt);
    return;
  }
  if (it2.stone) {
    const to = evoTarget(m, 'item', id);
    if (!to) { await say('¡No tendría ningún efecto!'); return; }
    removeItem(id);
    await evolveUI(m, to, true);
    return 'close';
  }
  if (it2.rare) {
    if (m.lvl >= 100) { await say('¡No tendría ningún efecto!'); return; }
    removeItem(id);
    m.exp = Math.max(m.exp, expAt(m.lvl + 1));
    const r = levelUpRaw(m);
    await Sound.jingle('level');
    await say('¡' + monName(m) + ' subió al nivel ' + m.lvl + '!');
    await showStatGain(m, r.old);
    for (const mv of learnAt(m.sp, m.lvl)) await learnMoveUI(m, mv);
    const to = evoTarget(m, 'level');
    if (to) { await evolveUI(m, to, true); return 'close'; }
    return;
  }
  const ok = itemApplicable(it2, m);
  if (ok !== true) { await say(ok); return; }
  removeItem(id);
  Sound.sfx('heal');
  if (it2.revive) { m.hp = Math.max(1, Math.floor(m.maxhp * it2.revive)); m.status = null; await say('¡' + monName(m) + ' se ha reanimado!'); return; }
  if (it2.heal) { const h = Math.min(m.maxhp - m.hp, it2.heal); m.hp += h; if (!it2.cure) await say('¡' + monName(m) + ' recuperó ' + h + ' PS!'); }
  if (it2.cure) { m.status = null; m.sleep = 0; await say('¡' + monName(m) + ' está como nuevo!'); }
  if (it2.pp) {
    const c = await choose(m.moves.map(x => MOVES[x.id].name + ' ' + x.pp + '/' + MOVES[x.id].pp), { rowH: 18 });
    if (c < 0) { addItem(id); return; }
    const mv = m.moves[c]; mv.pp = Math.min(MOVES[mv.id].pp, mv.pp + it2.pp);
    await say('¡Se restauraron los PP de ' + MOVES[mv.id].name + '!');
  }
}

// ---------------- Aprender movimiento ----------------
async function learnMoveUI(m, mvId, o = {}) {
  if (knows(m, mvId)) return false;
  const M = MOVES[mvId], nm = monName(m);
  if (m.moves.length < 4) {
    m.moves.push({ id: mvId, pp: M.pp });
    Sound.jingle('item');
    await say('¡' + nm + ' aprendió ' + M.name + '!', o);
    return true;
  }
  await say(nm + ' quiere aprender ' + M.name + '.|Pero ' + nm + ' ya conoce cuatro movimientos.', o);
  for (;;) {
    if (await yesNo('¿Olvidar un movimiento para aprender ' + M.name + '?', o)) {
      const items = m.moves.map(x => MOVES[x.id].name).concat([M.name + ' (NUEVO)']);
      const c = await choose(items, { x: W - 222, y: 4, w: 218, rowH: 18 });

    if (c === 0) {
      const s = new ListScene({
        title: '$' + G.money, x: 128, bg1: '#5888c8', bg2: '#4878b8',

        side: (e, ls) => personPanel('clerk', ls),
      });
      Scenes.push(s);
      for (;;) {
        s.o.title = '$' + G.money;
        const r = await s.pick();
        if (!r) break;
        const it2 = ITEMS[r.item.id];
        const max = Math.min(99, Math.floor(G.money / it2.price));

        const q = it2.pocket === 'mt' ? 1 : await pickQty(max, it2.price);

        if (await yesNo(it2.name + ' x' + q + ', ¿son $' + q * it2.price + '?')) {
          G.money -= q * it2.price; addItem(it2.id, q); Sound.sfx('money');
          await say('¡Aquí tienes! ¡Muchas gracias!');
          if (it2.id === 'bolsibola' && q >= 10) { addItem('superbola', 1); await say('¡Te regalo una SUPERBOLA por tu compra!'); }
        }
      }
      Scenes.remove(s);
    } else {
      const s = new ListScene({
        title: '$' + G.money, x: 128, bg1: '#5888c8', bg2: '#4878b8',
        items: () => Object.keys(G.bag).filter(id => ITEMS[id] && ITEMS[id].price > 0 && ITEMS[id].pocket !== 'clave' && ITEMS[id].pocket !== 'mt').map(id => ({ id, label: ITEMS[id].name, right: 'x' + G.bag[id] })),

        side: (e, ls) => personPanel('clerk', ls),

      for (;;) {
        s.o.title = '$' + G.money;

        if (!r) break;
        const it2 = ITEMS[r.item.id];
        const q = await pickQty(G.bag[it2.id], Math.floor(it2.price / 2));
        if (q <= 0) continue;
        if (await yesNo('¿Te doy $' + q * Math.floor(it2.price / 2) + ' por ' + it2.name + ' x' + q + '?')) {
          removeItem(it2.id, q); G.money += q * Math.floor(it2.price / 2); Sound.sfx('money');
        }
      }
      Scenes.remove(s);
    }
  }
}

<script>
'use strict';
// ============================================================
//  Construcción de mapas: bloques ASCII, interiores y cuevas
// ============================================================
class GameMap {
  constructor(id, w, h, fill = TL.tree) {
    this.id = id; this.w = w; this.h = h;
    this.t = new Uint8Array(w * h).fill(fill);
    this.name = ''; this.music = 'route'; this.theme = null; this.outdoor = false;
    this.warps = new Map(); this.signs = new Map(); this.npcs = []; this.structs = []; this.triggers = [];
    this.areas = [null]; this.areaGrid = null;
    this.bg = 'grass'; this.enc = null; this.fish = null; this.dungeon = false; this.exitTo = null; this.encRate = 1 / 14;
  }
  at(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? -1 : this.t[y * this.w + x]; }
  set(x, y, t) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.t[y * this.w + x] = t; }
  fill(x, y, w, h, t) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, t); }
  area(x, y) {
    if (!this.areaGrid) return this.areas[1] || this.defArea();
    const a = this.areaGrid[y * this.w + x];
    return this.areas[a] || this.defArea();
  }
  defArea() { return this._def || (this._def = { name: this.name, music: this.music, grass: this.enc, fish: this.fish, bg: this.bg }); }
  addArea(x, y, w, h, info) {
    if (!this.areaGrid) this.areaGrid = new Uint8Array(this.w * this.h);
    const idx = this.areas.length; this.areas.push(info);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const xx = x + i, yy = y + j; if (xx >= 0 && yy >= 0 && xx < this.w && yy < this.h) this.areaGrid[yy * this.w + xx] = idx; }
    return idx;
  }
  warp(x, y, to, tx, ty, dir, extra) { this.warps.set(x + ',' + y, Object.assign({ to, x: tx, y: ty, dir }, extra || {})); }
  getWarp(x, y) { return this.warps.get(x + ',' + y); }
}
const MAPS = {};
const OUTDOOR_LEG = {
  'T': 'tree', '.': 'grass', ',': 'tall', ':': 'path', '~': 'water', '_': 'sand', '*': 'flower', '|': 'fence', 'O': 'boulder',
  'V': 'ledge', '=': 'bridge', '^': 'mount', '@': 'cave', '$': 'sign', ';': 'bush', '&': 'dark', '+': 'rocky', '%': 'snow',
  'W': 'lava', 'P': 'pier', '"': 'darktall', '#': 'struct',
};
const BLD_LETTERS = { H: 'house', B: 'bighouse', C: 'center', M: 'mart', G: 'gym', L: 'lab', K: 'tower', D: 'dept', E: 'plant', X: 'league', Y: 'mansion', U: 'museum', J: 'dojo', S: 'silfo' };

// Pendientes de enlazar (se resuelven cuando existen todos los mapas)
const PENDING_LINKS = [];

// Estampa un bloque ASCII en un mapa exterior
function stamp(map, ox, oy, rows, def = {}) {
  const lines = rows.replace(/^\n/, '').replace(/\n\s*$/, '').split('\n');
  const width = Math.max(...lines.map(l => l.length));
  lines.forEach((l, i) => { if (l.length !== width) console.warn('Bloque', def.area && def.area.name, 'fila', i, 'ancho', l.length, '!=', width); });
  let signI = 0, caveI = 0, bldI = 0;
  const objs = def.obj || {};
  const ground = def.ground || '.';
  const blds = [];
  lines.forEach((line, j) => {
    for (let i = 0; i < line.length; i++) {
      const ch = line[i], x = ox + i, y = oy + j;
      if (ch === ' ') continue;
      if (OUTDOOR_LEG[ch]) {
        map.set(x, y, TL[OUTDOOR_LEG[ch]]);
        if (ch === '$') { const s = (def.signs || [])[signI++]; if (s) map.signs.set(x + ',' + y, s); else console.warn('Falta texto de cartel en', def.area && def.area.name); }
        if (ch === '@') { const c = (def.caves || [])[caveI++]; if (c) { c.x = x; c.y = y; PENDING_LINKS.push(Object.assign({ kind: 'cave', map }, c)); } else console.warn('Falta cueva en', def.area && def.area.name); }
      } else if (BLD_LETTERS[ch]) {
        blds.push({ kind: BLD_LETTERS[ch], x, y, def: (def.bld || [])[bldI++] || {} });
        map.set(x, y, TL.struct);
      } else if (/[0-9a-z]/.test(ch)) {
        const o = objs[ch];
        map.set(x, y, TL[OUTDOOR_LEG[(o && o.g) || ground]]);
        if (o) { const list = Array.isArray(o) ? o : [o]; for (const oo of list) map.npcs.push(Object.assign({}, oo, { x, y, id: oo.id || (map.id + ':' + (def.key || ox + '_' + oy) + ':' + ch) })); }
        else console.warn('Marcador sin objeto', ch, def.area && def.area.name);
      } else console.warn('Carácter desconocido', JSON.stringify(ch), def.area && def.area.name);
    }
  });
  for (const b of blds) {
    const K = Tiles.BKIND[b.kind];
    for (let j = 0; j < K.h; j++) for (let i = 0; i < K.w; i++) {
      const c = (lines[b.y - oy + j] || '')[b.x - ox + i];
      if (!(i === 0 && j === 0) && c !== '#') console.warn('Huella de edificio incorrecta', b.kind, 'en', b.x, b.y, 'char', c, def.area && def.area.name);
      map.set(b.x + i, b.y + j, TL.struct);
    }
    const dx = b.x + K.door, dy = b.y + K.h - 1;

// Laberinto de bosque generado dentro de un rectángulo del mapa exterior

  const stack = [[entryCol, rows - 1]];
  vis[(rows - 1) * cols + entryCol] = 1; open(entryCol, rows - 1);
  while (stack.length) {
    const [c, rr] = stack[stack.length - 1];
    const nb = [[0, -1], [1, 0], [0, 1], [-1, 0]].map(([a, b]) => [c + a, rr + b, a, b]).filter(([nc, nr]) => nc >= 0 && nr >= 0 && nc < cols && nr < rows && !vis[nr * cols + nc]);
    if (!nb.length) { stack.pop(); continue; }
    const [nc, nr, a, b] = nb[Math.floor(r() * nb.length)];
    vis[nr * cols + nc] = 1; open(nc, nr);
    if (a === 1) map.fill(cellX(c) + 2, cellY(rr), 1, 2, TL.dark);
    if (a === -1) map.fill(cellX(nc) + 2, cellY(nr), 1, 2, TL.dark);
    if (b === 1) map.fill(cellX(c), cellY(rr) + 2, 2, 1, TL.dark);
    if (b === -1) map.fill(cellX(nc), cellY(nr) + 2, 2, 1, TL.dark);
    stack.push([nc, nr]);
  }
  // atajos para que no sea tan lineal
  for (let k = 0; k < Math.floor(cols * rows / 6); k++) {
    const c = Math.floor(r() * (cols - 1)), rr = Math.floor(r() * (rows - 1));
    if (r() < 0.5) map.fill(cellX(c) + 2, cellY(rr), 1, 2, TL.dark); else map.fill(cellX(c), cellY(rr) + 2, 2, 1, TL.dark);

  for (let y = oy; y < oy + rows * 3 + 1; y++) for (let x = ox; x < ox + cols * 3 + 2; x++) if (map.at(x, y) === TL.dark && r() < 0.42) map.set(x, y, TL.darktall);

  map.fill(cellX(entryCol), cellY(rows - 1) + 2, 2, 2, TL.dark);
  map.fill(cellX(exitCol), oy - 1, 2, 2, TL.dark);
  map.fill(cellX(exitCol), oy, 2, 1, TL.dark);
  return { cellX, cellY, r };
}

// ---- Resolución de puertas y cuevas ----
function resolveLinks() {
  let n = 0;
  for (const p of PENDING_LINKS) {
    if (p.kind === 'door') {
      const id = p.id || p.to || (p.map.id + '_b' + (n++) + '_' + slug(p.center || p.name || p.bkind || 'x'));
      if (!MAPS[id]) createInterior(id, p);
      const m = MAPS[id];
      const exits = findTiles(m, TL.exit);
      if (!exits.length) { console.warn('Interior sin salida', id); continue; }
      const [ex, ey] = exits[0];
      p.map.warp(p.x, p.y, id, ex, ey - 1, 'up', { lock: p.lock });
      for (const [x, y] of exits) m.warp(x, y, p.map.id, p.x, p.y + 1, 'down');
      m.exitTo = m.exitTo || { map: p.map.id, x: p.x, y: p.y + 1 };
      m.parent = p.map.id;
      if (p.name) m.name = fmt(p.name);
    } else if (p.kind === 'cave') {
      const m = MAPS[p.to];
      if (!m) { console.warn('Cueva sin mapa', p.to); continue; }
      const e = m.outEntry;
      const back = p.back || [0, 1];
      const bdir = back[1] > 0 ? 'down' : back[1] < 0 ? 'up' : back[0] > 0 ? 'right' : 'left';
      p.map.warp(p.x, p.y, p.to, e.arrive[0], e.arrive[1], e.dir || 'up', { lock: p.lock });
      m.warp(e.pos[0], e.pos[1], p.map.id, p.x + back[0], p.y + back[1], bdir);
    }
  }
  // salidas de la torre, central y mansión
  for (const id of ['torre2', 'torre3']) MAPS[id].exitTo = MAPS.torre1.exitTo;
  MAPS.mansion2.exitTo = MAPS.mansion1.exitTo;
}

let WORLD_READY = false;
function buildAll() {
  if (WORLD_READY) return;
  PENDING_LINKS.length = 0;
  buildWorld();
  buildDungeons();
  // la cueva de Celeste y la Liga apuntan arriba
  for (const p of PENDING_LINKS) {
    if (p.kind === 'cave' && p.to === 'victoria2') p.back = [0, -1];
  }
  resolveLinks();
  WORLD_READY = true;
}
